# Existing-EC2 deployment: this project owns only the backend container.
# PostgreSQL and Redis are intentionally absent and must be operated separately.
name: blocbuy-backend-app

services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable image digest}
    container_name: blocbuy-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${BACKEND_ENV_FILE:-/etc/blocbuy/backend.env}
    environment:
      SPRING_PROFILES_ACTIVE: ec2
      # /api prefix is carried by the controller mappings (ApiConstants.API_V1) plus the
      # management base-path in application.yml — NOT by a servlet context-path, so it never
      # doubles (/api/api/...). CloudFront routes /api/* to the ALB origin; everything else
      # stays on S3. Local health checks and the ALB target-group probe use /api/actuator/health.
      # Honor X-Forwarded-Proto/Host from CloudFront/ALB so generated links stay https.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    labels:
      org.opencontainers.image.revision: ${BLOCBUY_GIT_SHA:-unknown}
      com.blocbuy.deployed-image: ${BACKEND_IMAGE}
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    # Ship container logs to CloudWatch Logs so they survive --force-recreate and are
    # searchable by traceId in Logs Insights (json-file logs die with the container).
    # Credentials come from the EC2 instance role (BlocBuyEc2Runtime + BlocBuyEc2CloudWatchLogs
    # policy) via IMDS — no keys in env files. Docker >= 20.10 dual logging keeps
    # `docker logs blocbuy-backend` working locally as before.
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-southeast-1
        # Overridable per environment (prod deploy passes BLOCBUY_LOG_GROUP=/blocbuy/backend/prod);
        # dev is the default so the existing deploy.sh path needs no change.
        awslogs-group: ${BLOCBUY_LOG_GROUP:-/blocbuy/backend/dev}
        awslogs-stream: backend
        awslogs-create-group: "true"
