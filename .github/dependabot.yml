version: 2
updates:
  - package-ecosystem: maven
    cooldown:
      default-days: 7
    directory: /backend
    schedule:
      interval: daily
    groups:
      spring:
        patterns: ['org.springframework*']
      test:
        patterns: ['org.junit*', 'org.testcontainers*', 'com.tngtech.archunit*']
    # Spring majors ride deliberate upgrades, not Dependabot.
    ignore:
      - dependency-name: 'org.springframework*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: /
    groups:
      version-updates:
        applies-to: version-updates
        patterns:
          - '*'
    schedule:
      interval: daily
    target-branch: dev

  - package-ecosystem: docker
    cooldown:
      default-days: 7
    directory: /backend
    schedule:
      interval: daily

  # pnpm 12 lockfile: GitHub documents pnpm v7–v10 under `npm`; confirm it parses via
  # Insights → Dependency graph → Dependabot → "Check for updates" (frontend/docs/plan.md §12.4).
  - package-ecosystem: npm
    cooldown:
      default-days: 7
    directory: /frontend
    schedule:
      interval: daily
    groups:
      tanstack:
        patterns: ['@tanstack/*']
      heroui:
        patterns: ['@heroui/*', 'react-aria-components']
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Pinned to a `next` snapshot on purpose: every published release up to 0.99.0 loads the
      # classic TypeScript compiler API, which typescript@7 no longer ships, so `pnpm install`
      # dies in `prepare` (hey-api/hey-api#4235; frontend/docs/plan.md §12 note 19; Dependabot
      # PRs #111/#112 failed exactly there). Lift this once a release supports TypeScript 7.
      # Dependabot alert 1 (GHSA-hhx9-57xq-r5rw, fixed in 0.97.3) matches the `0.0.0-next-*`
      # version string only: the snapshot postdates the fix by three months and the generated
      # `core/params.gen.ts` already writes every slot into an `Object.create(null)` record.
      - dependency-name: '@hey-api/openapi-ts'
