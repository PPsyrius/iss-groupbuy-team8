# Weekly dependency updates, grouped to keep PR volume low.
version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ['org.springframework*']
      test:
        patterns: ['org.junit*', 'org.testcontainers*', 'com.tngtech.archunit*']
    # Spring majors ride the deliberate Boot 4 migration, not Dependabot:
    # Boot 4's BOM drops testcontainers version management and breaks Boot-3
    # property overrides (tomcat.version etc.) — see parent pom CVE pins.
    ignore:
      - dependency-name: 'org.springframework*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
