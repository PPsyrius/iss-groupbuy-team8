version: 2
updates:
  - package-ecosystem: maven
    cooldown:
      default-days: 7
    directory: /backend
    schedule:
      interval: daily
    groups:
      spring:
        patterns: ['org.springframework*']
      test:
        patterns: ['org.junit*', 'org.testcontainers*', 'com.tngtech.archunit*']
    # Spring majors ride deliberate upgrades, not Dependabot.
    ignore:
      - dependency-name: 'org.springframework*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: /
    groups:
      version-updates:
        applies-to: version-updates
        patterns:
          - '*'
    schedule:
      interval: daily
    target-branch: dev

  - package-ecosystem: docker
    cooldown:
      default-days: 7
    directory: /backend
    schedule:
      interval: daily
