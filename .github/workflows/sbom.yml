# Software bill of materials and licence inventory for the backend (Maven) and frontend (pnpm).
# Scope is what ships: Maven compile and runtime dependencies (Trivy skips test and optional ones)
# and the frontend's production dependency closure (Trivy suppresses devDependencies).
# Licence categories are report-only; a missing or empty inventory fails the job.
# Vulnerability gating stays in security.yml (trivy-deps).
name: sbom

on:
  push:
    tags: ['v*'] # keep one SBOM per release tag
  schedule:
    - cron: '53 3 * * 1' # weekly Monday 03:53 UTC
  workflow_dispatch:
  # On a pull request it runs only on request: add the `run-sbom` label. The label stays on the PR,
  # so `gh pr list --label run-sbom --state all` lists every PR it ran for.
  pull_request:
    branches: [dev]
    types: [labeled]

permissions:
  contents: read

env:
  TRIVY_VERSION: v0.74.0

jobs:
  sbom:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-sbom'
    # Job-level, so that adding some other label (a skipped run) cannot cancel a running inventory.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a full run takes about 70 s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Trivy reads Maven dependencies and their licences from ~/.m2, as in trivy-deps.
      - name: Populate local Maven repository
        timeout-minutes: 5
        run: ./mvnw -B -q -f pom.xml dependency:go-offline -DskipTests
        working-directory: backend

      # No `version` input: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Licences of npm packages come from node_modules/*/package.json; the lockfile alone has none.
      # --ignore-scripts skips `prepare` (API client generation), which the inventory does not need.
      - name: Install frontend dependencies (frozen lockfile, no scripts)
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend

      - name: Prepare output directory
        run: mkdir -p sbom

      - name: Backend SBOM (CycloneDX)
        timeout-minutes: 2
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: 'true'
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: backend/
          format: cyclonedx
          output: sbom/backend.cdx.json

      - name: Frontend SBOM (CycloneDX)
        timeout-minutes: 2
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: frontend/
          format: cyclonedx
          output: sbom/frontend.cdx.json

      - name: Backend licence inventory
        timeout-minutes: 2
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: 'true'
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: backend/
          scanners: license
          format: json
          exit-code: '0' # report only
          output: sbom/backend-licences.json

      - name: Frontend licence inventory
        timeout-minutes: 2
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: frontend/
          scanners: license
          format: json
          exit-code: '0' # report only
          output: sbom/frontend-licences.json

      - name: Summarise and check the inventory
        timeout-minutes: 1
        run: >-
          python3 .github/scripts/sbom-summary.py --dir sbom
          --part backend=com.blocbuy: --part frontend
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOMs and licence reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          retention-days: 90
          if-no-files-found: warn
