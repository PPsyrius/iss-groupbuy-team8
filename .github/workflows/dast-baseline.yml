# DAST: passive OWASP ZAP baseline scan of the running dev environment.
# Advisory only. The baseline spiders for at most a few minutes and only inspects the responses
# (headers, cookies, information leaks); it never sends attack payloads, so it is safe against
# the shared dev site. Findings are uploaded as reports and summarised; nothing here gates a merge.
name: dast-baseline

on:
  schedule:
    - cron: '41 3 * * 1' # weekly Monday 03:41 UTC, after the weekly dependency scan
  workflow_dispatch:
    inputs:
      base-url:
        description: Base URL to scan (default vars.FRONTEND_URL_DEV)
        required: false
        type: string
  # Run once when this scan itself changes, so a PR shows the effect of its own edit.
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/dast-baseline.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zap-baseline:
    name: zap-baseline (${{ matrix.surface }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The SPA and its security headers, served by CloudFront from S3.
          - surface: web
            path: /
          # The backend behind the same origin (CloudFront /api/* -> ALB -> EC2).
          - surface: api
            path: /api/v1/products
    steps:
      - name: Run ZAP baseline (passive only)
        env:
          BASE_URL: ${{ inputs.base-url || vars.FRONTEND_URL_DEV }}
          SCAN_PATH: ${{ matrix.path }}
          SURFACE: ${{ matrix.surface }}
        run: |
          set -Eeuo pipefail
          [[ -n "$BASE_URL" ]] || { echo "::error::No base URL: set vars.FRONTEND_URL_DEV"; exit 1; }
          work="${RUNNER_TEMP}/zap-${SURFACE}"
          mkdir -p "$work"
          chmod 777 "$work" # the ZAP image runs as the unprivileged user "zap"
          status=0
          # ZAP 2.17.0, pinned by digest. -m 3: spider for at most 3 minutes.
          # -I: warnings do not fail the scan; exit 1 still means at least one FAIL rule fired.
          docker run --rm --volume "${work}:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6 \
            zap-baseline.py -t "${BASE_URL%/}${SCAN_PATH}" -m 3 -I \
            -r report.html -J report.json -w report.md || status=$?
          case "$status" in
            0) result="no alerts above the warning level" ;;
            1) result="at least one FAIL alert (advisory)" ;;
            2) result="warnings only" ;;
            *) echo "::error::ZAP did not complete (exit $status)"; exit "$status" ;;
          esac
          {
            echo "## ZAP baseline: ${SURFACE} (${BASE_URL%/}${SCAN_PATH})"
            echo
            echo "Result: ${result}. Full HTML and JSON reports are in the \`zap-${SURFACE}\` artifact."
            echo
            if [[ -f "${work}/report.md" ]]; then cat "${work}/report.md"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-${{ matrix.surface }}
          path: ${{ runner.temp }}/zap-${{ matrix.surface }}/
          retention-days: 30
          if-no-files-found: warn
