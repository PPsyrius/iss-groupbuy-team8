# SWE5001 service images (docs/swe5001/impl-github-configuration.md, section 6).
# Reusable and AWS-free: builds each runtime image for ARM64 (the ECS task platform),
# scans it with Trivy. Deployment callers export/upload swe5001-image-<service>;
# PR validation keeps the build/scan but never uploads unused image archives.
# It never pushes; swe5001-deploy.yml publishes the exact scanned image.
#
# Strangler step 0: only the monolith image. PR 9 of #376 adds identity-svc,
# commerce-svc and notification-svc to the matrix.
name: swe5001-service-images

on:
  workflow_call:
    inputs:
      upload-images:
        description: Export scanned images for same-run deployment publication
        type: boolean
        default: true
    outputs:
      services:
        description: Space-separated service names; deployment calls upload one image artifact each
        value: ${{ jobs.build.outputs.services }}

permissions: {}

jobs:
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      services: monolith
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: monolith
            dockerfile: Dockerfile.ci
            jar: blocbuy-bootstrap/target/blocbuy-backend.jar
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache: these images are published, and a cache written by a PR
      # run could otherwise poison them.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # Tests ran on the PRs into dev; this only packages the merged source.
      - name: Package
        env:
          JAR: ${{ matrix.jar }}
        run: |
          ./mvnw -B -q -DskipTests package
          test -f "$JAR"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build image (linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/${{ matrix.dockerfile }}
          platforms: linux/arm64
          load: true
          tags: swe5001-${{ matrix.service }}:${{ github.sha }}

      # Same gate as the ci-backend image scan.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: swe5001-${{ matrix.service }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Export image
        if: inputs.upload-images && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        env:
          SERVICE: ${{ matrix.service }}
        run: docker save "swe5001-${SERVICE}:${GITHUB_SHA}" | gzip --stdout > "${RUNNER_TEMP}/swe5001-image-${SERVICE}.tgz"

      - name: Upload verified image
        if: inputs.upload-images && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swe5001-image-${{ matrix.service }}
          path: ${{ runner.temp }}/swe5001-image-${{ matrix.service }}.tgz
          retention-days: 2
          if-no-files-found: error
