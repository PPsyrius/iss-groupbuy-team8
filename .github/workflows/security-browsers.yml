# Additional compatibility evidence, not a deployment or a required PR gate.
name: Browser security compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-browsers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build reproducible browser tooling and current SPA
        run: docker build --file frontend/tooling/security-browsers.Dockerfile --tag blocbuy-security-browsers:ci .

      - name: Check frontend
        run: docker run --rm --cpus=2 --memory=6g blocbuy-security-browsers:ci pnpm check

      - name: Test all browser projects with local fixtures only
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/browser-security-evidence
        run: |
          mkdir -p "$EVIDENCE_DIR"
          # The image runs as node (UID 1000), not the hosted runner's UID.
          sudo chown 1000:1000 "$EVIDENCE_DIR"
          docker run --rm --ipc=host --cpus=2 --memory=6g \
            --mount "type=bind,source=$EVIDENCE_DIR,target=/evidence" \
            blocbuy-security-browsers:ci

      - name: Retain browser reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-security-${{ github.sha }}
          path: ${{ runner.temp }}/browser-security-evidence
          retention-days: 14
          if-no-files-found: warn
