name: perf-tooling

on:
  pull_request:
    branches: [dev]
    paths:
      - 'perf/k6/**'
      - 'infra/swe5001/scripts/connection-budget.sh'
      - 'infra/swe5001/scripts/http-preflight.sh'
      - 'infra/swe5001/scripts/test-http-preflight.sh'
      - '.github/workflows/perf-tooling.yml'

permissions: {}

jobs:
  generator-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Pure configuration, calibration and budget tests
        run: node --test perf/k6/lib.test.mjs
      - name: Read-only AWS capture contract (stubbed, no credentials)
        run: bash infra/swe5001/scripts/test-http-preflight.sh
      - name: Pull disposable fixture tools before isolating their network
        run: |
          docker pull node:24-bookworm
          docker pull postgres:18
          docker pull grafana/k6:1.6.1@sha256:a5ad6bc089a08d77c3ec49f3db8c6fa7a148e4073efcac44c675dbaf3568d8e1
      - name: Real k6 runner against an isolated local fixture (no AWS)
        run: node --test perf/k6/integration.test.mjs
