# Frontend pipeline: pull requests are the authoritative validation gate.
# A dev push rebuilds dist/ from the merged source for delivery without repeating
# the pre-merge quality gates, then deploys to S3 + CloudFront and smoke-tests dev.
# `merge_group` support is retained for repositories where GitHub Merge Queue is available.
# Design: frontend/docs/plan.md §7. Runbook: docs/deploy/dev-cloudfront-deployment.md §14–§17
# (SPA fallback, response headers policy, OIDC deploy role, `frontend-dev` environment + variables).
name: ci-frontend

on:
  push:
    branches: [dev]
    paths:
      - "frontend/**"
      - "contracts/**"
      - "lefthook.yml"
      - ".github/workflows/ci-frontend.yml"
  # Dormant on the current private personal repository, but keeps the workflow
  # ready for GitHub Merge Queue if the repository later becomes eligible.
  merge_group:
    types: [checks_requested]
  # Run for every PR targeting dev so the required `frontend-check` status is always reported
  # (a path-filtered required check leaves unrelated PRs waiting forever). `detect-changes`
  # decides whether the frontend gates actually execute; otherwise the job reports
  # "not applicable" and succeeds, the same shape as `build-quality` in ci-backend.yml (#108).
  pull_request:
    branches: [dev]

concurrency:
  group: ci-frontend-${{ github.ref }}
  # Stale PR runs are disposable; merge-queue validation must never be cancelled.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

# Applies to `run` steps only; `uses` steps (pnpm/node setup, artifacts) resolve paths from the
# repository root, hence the explicit `frontend/` prefixes on their inputs.
defaults:
  run:
    working-directory: frontend

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'contracts/**'
              - 'lefthook.yml'
              - '.github/workflows/ci-frontend.yml'

  frontend-check:
    # The one required frontend check: always present on PRs and merge groups, gates only
    # when frontend-relevant paths changed (see the `pull_request` trigger note above).
    needs: detect-changes
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Frontend validation not applicable
        if: needs.detect-changes.outputs.frontend != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "No frontend-relevant changes; frontend-check is not applicable."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.detect-changes.outputs.frontend == 'true'

      # No `version` input: the action reads `packageManager` (pnpm@12.4.2) from package.json.
      # It must run before setup-node so `cache: pnpm` can find the pnpm store.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.detect-changes.outputs.frontend == 'true'
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.detect-changes.outputs.frontend == 'true'
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # `prepare` runs `gen:api`, so the generated client exists before any check.
      - name: Install (frozen lockfile)
        if: needs.detect-changes.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile

      # Runtime configuration comes from the API and the same-origin `/api` path, never from
      # build-time env; a `VITE_*` or `import.meta.env` reference means a value got baked into dist/.
      - name: Forbid import.meta.env
        if: needs.detect-changes.outputs.frontend == 'true'
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' -E 'import\.meta\.env|VITE_' src e2e; then
            echo "::error::import.meta.env / VITE_* are forbidden in the frontend (frontend/docs/plan.md §7.1)"
            exit 1
          fi

      - name: Check (gen:api, tsc, oxlint, oxfmt, vitest, knip)
        if: needs.detect-changes.outputs.frontend == 'true'
        run: pnpm check

      - name: Build
        if: needs.detect-changes.outputs.frontend == 'true'
        run: pnpm build

      # e2e-preview consumes this exact build; nothing rebuilds it inside the validation path.
      - name: Upload validation build artifact
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          retention-days: 2
          if-no-files-found: error

  sonar-frontend:
    name: SonarCloud Frontend
    needs: detect-changes
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'merge_group' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Frontend SonarCloud not applicable
        if: >-
          needs.detect-changes.outputs.frontend != 'true' ||
          github.actor == 'dependabot[bot]' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.fork == true)
        working-directory: ${{ github.workspace }}
        run: echo "No trusted frontend change to analyze; SonarCloud Frontend is not applicable."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: >-
          needs.detect-changes.outputs.frontend == 'true' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.fork == false)
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: >-
          needs.detect-changes.outputs.frontend == 'true' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.fork == false)
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: >-
          needs.detect-changes.outputs.frontend == 'true' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.fork == false)
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        if: >-
          needs.detect-changes.outputs.frontend == 'true' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.fork == false)
        run: pnpm install --frozen-lockfile

      - name: Generate frontend LCOV coverage
        if: >-
          needs.detect-changes.outputs.frontend == 'true' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.fork == false)
        run: pnpm exec vitest run --coverage --coverage.reporter=text --coverage.reporter=lcov

      - name: Analyze frontend with SonarCloud
        if: >-
          needs.detect-changes.outputs.frontend == 'true' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.fork == false)
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=blocbuy-frontend
            "-Dsonar.projectName=BlocBuy Frontend"
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
            -Dsonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,src/api/generated/**,src/routeTree.gen.ts
            -Dsonar.coverage.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,src/api/generated/**,src/routeTree.gen.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.typescript.tsconfigPaths=tsconfig.json

      - name: Check frontend SonarCloud quality gate
        if: >-
          needs.detect-changes.outputs.frontend == 'true' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.fork == false)
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        with:
          scanMetadataReportFile: frontend/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  intent-stale:
    # Consumer-side drift check: `intent stale` is a maintainer command (plan §12.3), so instead
    # diff the installed TanStack skill set against the committed manifest and confirm the
    # Intent-managed block in AGENTS.md is still present.
    needs: detect-changes
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Intent is fetched from npm at an exact version; pnpm dlx does not support
      # GitHub-style commit-SHA pinning used for Actions.
      # The committed manifest has `packageRoot` values relative to frontend/ (plan §11 outcome);
      # apply the same rewrite to the fresh listing so the diff is machine-independent.
      - name: Fail if the installed skill set drifted from docs/tanstack-skills.json
        run: |
          set -Eeuo pipefail
          pnpm dlx @tanstack/intent@0.4.0 list --json \
            | sed "s#$PWD/##g" \
            | jq -S . > "${RUNNER_TEMP}/skills.json"
          jq -S . docs/tanstack-skills.json > "${RUNNER_TEMP}/skills-committed.json"
          diff "${RUNNER_TEMP}/skills-committed.json" "${RUNNER_TEMP}/skills.json"

      - name: Verify the Intent-managed block in AGENTS.md
        run: grep -q intent-skills AGENTS.md

  e2e-preview:
    # Smoke the validated dist/ through `vite preview` (playwright.config.ts starts it when
    # E2E_BASE_URL is unset). Only the home test runs here; the dev-target tests skip.
    # `frontend-check` also succeeds when it was "not applicable", so gate on the filter too.
    needs:
      - detect-changes
      - frontend-check
    if: >-
      needs.frontend-check.result == 'success' &&
      needs.detect-changes.outputs.frontend == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # upload-artifact strips the common ancestor (frontend/dist), so restore into it explicitly:
      # `vite preview` serves dist/ relative to frontend/.
      - name: Download validation build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist

      - name: Verify build artifact
        run: test -f dist/index.html

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke (vite preview)
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  package-dev:
    name: package-dev
    needs: detect-changes
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      vars.ENABLE_S3_DEPLOY == 'true' &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The up-to-date PR already passed the authoritative quality gates.
      # This delivery path only regenerates dependencies/API output and builds the merged source.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build merged frontend
        run: pnpm build

      - name: Upload delivery build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist-dev-${{ github.sha }}
          path: frontend/dist
          retention-days: 2
          if-no-files-found: error

  deploy-s3-dev:
    name: deploy-s3-dev

    # Deployments queue and finish; the workflow-level cancel policy must not
    # interrupt a half-synced bucket.
    concurrency:
      group: deploy-s3-frontend-dev
      cancel-in-progress: false

    needs:
      - detect-changes
      - package-dev

    # Gated on ENABLE_S3_DEPLOY until the bucket, OIDC role and `frontend-dev` environment exist
    # (runbook §16–§17). The role trusts the `environment:frontend-dev` OIDC subject.
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      vars.ENABLE_S3_DEPLOY == 'true' &&
      needs.detect-changes.result == 'success' &&
      needs.package-dev.result == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    environment:
      name: frontend-dev
      url: ${{ vars.FRONTEND_URL_DEV }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The delivery artifact is rebuilt from the merged dev source after the authoritative
      # pre-merge validation; no quality/security checks are repeated here.
      - name: Download delivery build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist-dev-${{ github.sha }}
          path: frontend/dist

      - name: Verify build artifact
        run: test -f dist/index.html

      - name: Assume frontend deploy role with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN_DEV }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: BlocBuy-Frontend-${{ github.run_id }}

      # Hashed assets are immutable; `--delete` drops assets of the previous build (plan §7.1:
      # keep one build for rollback by removing --delete and adding a lifecycle rule in T2-07).
      - name: Sync hashed assets (immutable cache)
        run: aws s3 sync dist/ "s3://${{ vars.FRONTEND_S3_BUCKET_DEV }}" --delete --exclude index.html --cache-control "public,max-age=31536000,immutable"

      # index.html is the only mutable object: uploaded last so it never references a missing asset.
      - name: Publish index.html (no-cache)
        run: aws s3 cp dist/index.html "s3://${{ vars.FRONTEND_S3_BUCKET_DEV }}/index.html" --cache-control no-cache --content-type text/html

      - name: Invalidate index.html on CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.FRONTEND_CLOUDFRONT_DIST_ID_DEV }}" --paths /index.html

      - name: Record deployment
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL_DEV }}
        run: |
          {
            echo "### Frontend deployed (dev)"
            echo "- Git SHA: \`$GITHUB_SHA\`"
            echo "- URL: $FRONTEND_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e-dev:
    # Smoke the deployed site through CloudFront (home, deep link, /api/actuator/health).
    needs: deploy-s3-dev
    if: needs.deploy-s3-dev.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # With E2E_BASE_URL set, playwright.config.ts starts no local server.
      - name: Playwright smoke (dev CloudFront)
        env:
          E2E_TARGET: dev
          E2E_BASE_URL: ${{ vars.FRONTEND_URL_DEV }}
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-dev
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore
