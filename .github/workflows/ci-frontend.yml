# Frontend pipeline: pull requests are the authoritative validation gate.
# A dev push rebuilds dist/ from the merged source for delivery without repeating
# the pre-merge quality gates, then deploys to S3 + CloudFront and smoke-tests dev.
# `merge_group` support is retained for repositories where GitHub Merge Queue is available.
# Design: frontend/docs/plan.md §7. Runbook: docs/deploy/dev-cloudfront-deployment.md §14–§17
# (SPA fallback, response headers policy, OIDC deploy role, `frontend-dev` environment + variables).
name: ci-frontend

on:
  push:
    branches: [dev]
    paths:
      - "frontend/**"
      - "contracts/**"
      - "lefthook.yml"
      - ".github/workflows/ci-frontend.yml"
  # Dormant on the current private personal repository, but keeps the workflow
  # ready for GitHub Merge Queue if the repository later becomes eligible.
  merge_group:
    types: [checks_requested]
  # Run for every PR targeting dev so the required `frontend-check` status is always reported
  # (a path-filtered required check leaves unrelated PRs waiting forever). `detect-changes`
  # decides whether the frontend gates actually execute; otherwise the job reports
  # "not applicable" and succeeds, the same shape as `build-quality` in ci-backend.yml (#108).
  pull_request:
    branches: [dev]

concurrency:
  group: ci-frontend-${{ github.ref }}
  # Stale PR runs are disposable; merge-queue validation must never be cancelled.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

# Applies to `run` steps only; `uses` steps (pnpm/node setup, artifacts) resolve paths from the
# repository root, hence the explicit `frontend/` prefixes on their inputs.
defaults:
  run:
    working-directory: frontend

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      intent: ${{ steps.filter.outputs.intent }}
      sonar: ${{ steps.filter.outputs.sonar }}
    steps:
      # paths-filter compares Git history for push/merge-group events. Fetch it during checkout so
      # the action never needs credentials after checkout removes them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Keep required jobs present on every PR but exclude documentation from
          # app validation and deployment; Intent still checks AGENTS and its manifest.
          predicate-quantifier: some-with-excludes
          filters: |
            frontend:
              - 'frontend/**'
              - '!frontend/docs/**'
              - '!frontend/README.md'
              - '!frontend/AGENTS.md'
              - '!frontend/CLAUDE.md'
              - 'contracts/**'
              - 'lefthook.yml'
              - 'deployment/frontend/cloudfront/response-headers-policy.json'
              - '.github/workflows/ci-frontend.yml'
            intent:
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/.npmrc'
              - 'frontend/.nvmrc'
              - 'frontend/AGENTS.md'
              - 'frontend/docs/tanstack-skills.json'
              - '.github/workflows/ci-frontend.yml'
            sonar:
              - 'frontend/src/**'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/pnpm-workspace.yaml'
              - 'frontend/.npmrc'
              - 'frontend/.nvmrc'
              - 'frontend/.mise.toml'
              - 'frontend/tsconfig*.json'
              - 'frontend/vitest.config.ts'
              - 'frontend/vite.config.ts'
              - 'frontend/openapi-ts.config.ts'
              - 'frontend/scripts/**'
              - 'contracts/**'
              - '.github/workflows/ci-frontend.yml'

  frontend-check:
    # The required frontend check is present on every PR/merge group; a job-level
    # skip avoids allocating a runner when change detection found no frontend inputs.
    needs: detect-changes
    if: >-
      always() &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      (needs.detect-changes.result != 'success' ||
       needs.detect-changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require successful change detection
        if: needs.detect-changes.result != 'success'
        working-directory: ${{ github.workspace }}
        run: exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.detect-changes.outputs.frontend == 'true'
        with:
          persist-credentials: false

      # No `version` input: the action reads `packageManager` (pnpm@12.4.2) from package.json.
      # It must run before setup-node so `cache: pnpm` can find the pnpm store.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: needs.detect-changes.outputs.frontend == 'true'
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.detect-changes.outputs.frontend == 'true'
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # `prepare` runs `gen:api`, so the generated client exists before any check.
      - name: Install (frozen lockfile)
        if: needs.detect-changes.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile

      # Runtime configuration comes from the API and the same-origin `/api` path, never from
      # build-time env; a `VITE_*` or `import.meta.env` reference means a value got baked into dist/.
      - name: Forbid import.meta.env
        if: needs.detect-changes.outputs.frontend == 'true'
        run: |
          if grep -rn --include='*.ts' --include='*.tsx' -E 'import\.meta\.env|VITE_' src e2e; then
            echo "::error::import.meta.env / VITE_* are forbidden in the frontend (frontend/docs/plan.md §7.1)"
            exit 1
          fi

      - name: Check (gen:api, tsc, oxlint, oxfmt, vitest, knip)
        if: needs.detect-changes.outputs.frontend == 'true'
        env:
          CI_COVERAGE: 'true'
        run: pnpm check

      - name: Upload frontend LCOV for SonarCloud
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-lcov
          path: frontend/coverage/lcov.info
          retention-days: 1
          if-no-files-found: error

      - name: Build
        if: needs.detect-changes.outputs.frontend == 'true'
        run: pnpm build

      # e2e-preview consumes this exact build; nothing rebuilds it inside the validation path.
      - name: Upload validation build artifact
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist
          retention-days: 2
          if-no-files-found: error

  sonar-frontend:
    name: SonarCloud Frontend
    needs:
      - detect-changes
      - frontend-check
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      ((github.event_name == 'push' && needs.detect-changes.outputs.sonar == 'true') ||
       ((github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
        needs.detect-changes.outputs.frontend == 'true' &&
        needs.frontend-check.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Frontend SonarCloud not applicable
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.pull_request.user.login == 'dependabot[bot]' ||
           github.event.pull_request.head.repo.fork == true)
        working-directory: ${{ github.workspace }}
        run: echo "No trusted frontend change to analyze; SonarCloud Frontend is not applicable."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: >-
          needs.detect-changes.outputs.frontend == 'true' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.user.login != 'dependabot[bot]' &&
            github.event.pull_request.head.repo.fork == false))
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: github.event_name == 'push' && needs.detect-changes.outputs.frontend == 'true'
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'push' && needs.detect-changes.outputs.frontend == 'true'
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        if: github.event_name == 'push' && needs.detect-changes.outputs.frontend == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate frontend LCOV coverage (dev only)
        if: github.event_name == 'push' && needs.detect-changes.outputs.frontend == 'true'
        run: pnpm exec vitest run --coverage --coverage.reporter=text --coverage.reporter=lcov

      - name: Download frontend LCOV from validation
        if: >-
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
          needs.detect-changes.outputs.frontend == 'true' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.user.login != 'dependabot[bot]' &&
            github.event.pull_request.head.repo.fork == false))
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-lcov
          path: frontend/coverage

      - name: Verify frontend LCOV report
        if: >-
          needs.detect-changes.outputs.frontend == 'true' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.user.login != 'dependabot[bot]' &&
            github.event.pull_request.head.repo.fork == false))
        run: test -s coverage/lcov.info

      - name: Analyze frontend with SonarCloud
        if: >-
          needs.detect-changes.outputs.frontend == 'true' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.user.login != 'dependabot[bot]' &&
            github.event.pull_request.head.repo.fork == false))
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=blocbuy-frontend
            "-Dsonar.projectName=BlocBuy Frontend"
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
            -Dsonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,src/api/generated/**,src/routeTree.gen.ts
            -Dsonar.coverage.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,src/api/generated/**,src/routeTree.gen.ts,src/main.tsx,src/router.tsx,src/dev/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.typescript.tsconfigPaths=tsconfig.json

      - name: Check frontend SonarCloud quality gate
        if: >-
          needs.detect-changes.outputs.frontend == 'true' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.user.login != 'dependabot[bot]' &&
            github.event.pull_request.head.repo.fork == false))
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        with:
          scanMetadataReportFile: frontend/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  intent-stale:
    # Consumer-side drift check: `intent stale` is a maintainer command (plan §12.3), so instead
    # diff the installed TanStack skill set against the committed manifest and confirm the
    # Intent-managed block in AGENTS.md is still present. Only inputs to that
    # manifest/check need a fresh install and comparison.
    needs: detect-changes
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.detect-changes.outputs.intent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Intent is fetched from npm at an exact version; pnpm dlx does not support
      # GitHub-style commit-SHA pinning used for Actions.
      # The committed manifest has `packageRoot` values relative to frontend/ (plan §11 outcome);
      # apply the same rewrite to the fresh listing so the diff is machine-independent.
      - name: Fail if the installed skill set drifted from docs/tanstack-skills.json
        run: |
          set -Eeuo pipefail
          pnpm dlx @tanstack/intent@0.4.0 list --json \
            | sed "s#$PWD/##g" \
            | jq -S . > "${RUNNER_TEMP}/skills.json"
          jq -S . docs/tanstack-skills.json > "${RUNNER_TEMP}/skills-committed.json"
          diff "${RUNNER_TEMP}/skills-committed.json" "${RUNNER_TEMP}/skills.json"

      - name: Verify the Intent-managed block in AGENTS.md
        run: grep -q intent-skills AGENTS.md

  e2e-preview:
    # Smoke the validated dist/ through `vite preview` (playwright.config.ts starts it when
    # E2E_BASE_URL is unset). Every spec runs here: smoke, and the login, buyer-journey,
    # join-refusal, quote, product-gallery and admin specs on `page.route` stubs; the @auth and
    # @admin cases (no storage state) and the dev-only smoke test skip.
    # `frontend-check` also succeeds when it was "not applicable", so gate on the filter too.
    needs:
      - detect-changes
      - frontend-check
    if: >-
      needs.frontend-check.result == 'success' &&
      needs.detect-changes.outputs.frontend == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    # Use the runner's preinstalled Chromium libraries; do not apt-install them on every run.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # upload-artifact strips the common ancestor (frontend/dist), so restore into it explicitly:
      # `vite preview` serves dist/ relative to frontend/.
      - name: Download validation build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist

      - name: Verify build artifact
        run: test -f dist/index.html

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu24-playwright-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      # Native libraries are already on ubuntu-24.04. --with-deps redundantly invokes apt;
      # a slow Ubuntu mirror exhausted this job's budget in run 40366511054.
      - name: Install Chromium headless shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 2
        run: pnpm exec playwright install --only-shell chromium

      - name: Playwright smoke (vite preview)
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  package-dev:
    name: package-dev
    needs: detect-changes
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      vars.ENABLE_S3_DEPLOY == 'true' &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The up-to-date PR already passed the authoritative quality gates.
      # This delivery path only regenerates dependencies/API output and builds the merged source.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build merged frontend
        run: pnpm build

      - name: Upload delivery build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist-dev-${{ github.sha }}
          path: frontend/dist
          retention-days: 2
          if-no-files-found: error

  deploy-s3-dev:
    name: deploy-s3-dev

    # Deployments queue and finish; the workflow-level cancel policy must not
    # interrupt a half-synced bucket.
    concurrency:
      group: deploy-s3-frontend-dev
      cancel-in-progress: false

    needs:
      - detect-changes
      - package-dev

    # ENABLE_S3_DEPLOY is the operational deploy/freeze switch. The role trusts the
    # `environment:frontend-dev` OIDC subject and the environment permits only dev.
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      vars.ENABLE_S3_DEPLOY == 'true' &&
      needs.detect-changes.result == 'success' &&
      needs.package-dev.result == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    environment:
      name: frontend-dev
      url: ${{ vars.FRONTEND_URL_DEV }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The delivery artifact is rebuilt from the merged dev source after the authoritative
      # pre-merge validation; no quality/security checks are repeated here.
      - name: Download delivery build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist-dev-${{ github.sha }}
          path: frontend/dist

      - name: Verify build artifact
        run: test -f dist/index.html

      - name: Assume frontend deploy role with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_FRONTEND_DEPLOY_ROLE_ARN_DEV }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: BlocBuy-Frontend-${{ github.run_id }}

      # Hashed assets are immutable; `--delete` drops assets of the previous build (plan §7.1:
      # keep one build for rollback by removing --delete and adding a lifecycle rule in T2-07).
      - name: Sync hashed assets (immutable cache)
        run: aws s3 sync dist/ "s3://${{ vars.FRONTEND_S3_BUCKET_DEV }}" --delete --exclude index.html --exclude "*.map" --cache-control "public,max-age=31536000,immutable"

      # index.html is the only mutable object: uploaded last so it never references a missing asset.
      - name: Publish index.html (no-cache)
        run: aws s3 cp dist/index.html "s3://${{ vars.FRONTEND_S3_BUCKET_DEV }}/index.html" --cache-control no-cache --content-type text/html

      - name: Invalidate index.html on CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.FRONTEND_CLOUDFRONT_DIST_ID_DEV }}" --paths /index.html

      - name: Record deployment
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL_DEV }}
        run: |
          {
            echo "### Frontend deployed (dev)"
            echo "- Git SHA: \`$GITHUB_SHA\`"
            echo "- URL: $FRONTEND_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e-dev:
    # Smoke the deployed site through CloudFront (home, deep link, /api/actuator/health).
    needs: deploy-s3-dev
    if: needs.deploy-s3-dev.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu24-playwright-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      # Match preview: reuse the pinned runner's native libraries and cache only browser binaries.
      - name: Install Chromium headless shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 2
        run: pnpm exec playwright install --only-shell chromium

      # With E2E_BASE_URL set, playwright.config.ts starts no local server.
      - name: Playwright smoke (dev CloudFront)
        env:
          E2E_TARGET: dev
          E2E_BASE_URL: ${{ vars.FRONTEND_URL_DEV }}
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-dev
          path: frontend/playwright-report
