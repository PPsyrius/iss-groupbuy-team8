# Controlled application rollback for the existing backend EC2 instances (dev and prod).
# Database/Flyway rollback is deliberately out of scope: migrations must remain backward-compatible.
name: rollback-backend

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to roll back"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      target_image:
        description: "Optional immutable ECR digest; leave blank to use the host's recorded previous image"
        required: false
        type: string
      reason:
        description: "Incident/change reason recorded in the workflow summary"
        required: true
        type: string
      confirm_rollback:
        description: "I understand this changes the running backend but does not reverse database migrations"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  rollback-existing-ec2:
    if: inputs.target == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment:
      name: backend-dev
      url: ${{ vars.BACKEND_URL_DEV }}
    concurrency:
      group: deploy-existing-ec2-backend-dev
      cancel-in-progress: false
    steps:
      - name: Validate authorization, target, and confirmation
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_DEV }}
          INSTANCE_ID: ${{ vars.BACKEND_EC2_INSTANCE_ID_DEV }}
          DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN_DEV }}
          TARGET_IMAGE: ${{ inputs.target_image }}
          ROLLBACK_REASON: ${{ inputs.reason }}
          CONFIRM_ROLLBACK: ${{ inputs.confirm_rollback }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/dev' ]] \
            || { echo "Rollback must be dispatched from the dev branch"; exit 1; }
          [[ "$CONFIRM_ROLLBACK" == 'true' ]] \
            || { echo "confirm_rollback must be selected"; exit 1; }
          reason_without_whitespace="${ROLLBACK_REASON//[[:space:]]/}"
          [[ -n "$reason_without_whitespace" && ${#ROLLBACK_REASON} -le 256 ]] \
            || { echo "reason must contain 1-256 non-whitespace characters"; exit 1; }

          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] \
            || { echo "AWS_ACCOUNT_ID must contain 12 digits"; exit 1; }
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]$ ]] \
            || { echo "AWS_REGION is invalid"; exit 1; }
          [[ "$ECR_REPOSITORY" =~ ^[a-z0-9][a-z0-9._/-]+$ ]] \
            || { echo "ECR_REPOSITORY is invalid"; exit 1; }
          [[ "$INSTANCE_ID" =~ ^i-([a-f0-9]{8}|[a-f0-9]{17})$ ]] \
            || { echo "BACKEND_EC2_INSTANCE_ID_DEV is invalid"; exit 1; }
          [[ "$DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::${AWS_ACCOUNT_ID}:role/[A-Za-z0-9+=,.@_/-]+$ ]] \
            || { echo "AWS_DEPLOY_ROLE_ARN_DEV must be an IAM role in AWS_ACCOUNT_ID"; exit 1; }

          if [[ -n "$TARGET_IMAGE" ]]; then
            expected_repository="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
            image_digest="${TARGET_IMAGE#"$expected_repository@"}"
            [[ "$TARGET_IMAGE" == "$expected_repository@$image_digest" ]] \
              || { echo "target_image repository does not match deployment configuration"; exit 1; }
            [[ "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]] \
              || { echo "target_image must be pinned by a valid digest"; exit 1; }
          fi

      - name: Roll back dev EC2
        uses: ./.github/actions/deploy-ec2
        with:
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          ecr-repository: ${{ vars.ECR_REPOSITORY_DEV }}
          instance-id: ${{ vars.BACKEND_EC2_INSTANCE_ID_DEV }}
          deploy-role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_DEV }}
          image-uri: ${{ inputs.target_image || format('{0}.dkr.ecr.{1}.amazonaws.com/{2}@placeholder', vars.AWS_ACCOUNT_ID, vars.AWS_REGION, vars.ECR_REPOSITORY_DEV) }}
          mode: rollback
          target-image: ${{ inputs.target_image }}
          reason: ${{ inputs.reason }}
          health-url: ${{ vars.BACKEND_URL_DEV != '' && format('{0}/api/actuator/health', vars.BACKEND_URL_DEV) || '' }}

  rollback-existing-ec2-prod:
    if: inputs.target == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    # Required reviewers on backend-prod gate a prod rollback the same way as a deploy.
    environment:
      name: backend-prod
      url: ${{ vars.BACKEND_URL_PROD }}
    concurrency:
      # Shared with deploy-existing-ec2-prod so a rollback and a deploy can never interleave.
      group: deploy-existing-ec2-backend-prod
      cancel-in-progress: false
    steps:
      - name: Validate authorization, target, and confirmation
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_PROD }}
          INSTANCE_ID: ${{ vars.BACKEND_EC2_INSTANCE_ID_PROD }}
          DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH }}
          TARGET_IMAGE: ${{ inputs.target_image }}
          ROLLBACK_REASON: ${{ inputs.reason }}
          CONFIRM_ROLLBACK: ${{ inputs.confirm_rollback }}
        run: |
          set -Eeuo pipefail
          # Prod releases are tagged from the release branch, but the release branch
          # may also be rolled back to dev state — allow dispatch from either.
          if [[ "$GITHUB_REF" != 'refs/heads/dev' ]]; then
            [[ -n "$RELEASE_BRANCH" && "$GITHUB_REF" == "refs/heads/${RELEASE_BRANCH}" ]] \
              || { echo "Prod rollback must be dispatched from the dev branch or the release branch (RELEASE_BRANCH variable)"; exit 1; }
          fi
          [[ "$CONFIRM_ROLLBACK" == 'true' ]] \
            || { echo "confirm_rollback must be selected"; exit 1; }
          reason_without_whitespace="${ROLLBACK_REASON//[[:space:]]/}"
          [[ -n "$reason_without_whitespace" && ${#ROLLBACK_REASON} -le 256 ]] \
            || { echo "reason must contain 1-256 non-whitespace characters"; exit 1; }

          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] \
            || { echo "AWS_ACCOUNT_ID must contain 12 digits"; exit 1; }
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]$ ]] \
            || { echo "AWS_REGION is invalid"; exit 1; }
          [[ "$ECR_REPOSITORY" =~ ^[a-z0-9][a-z0-9._/-]+$ ]] \
            || { echo "ECR_REPOSITORY_PROD is invalid"; exit 1; }
          [[ "$INSTANCE_ID" =~ ^i-([a-f0-9]{8}|[a-f0-9]{17})$ ]] \
            || { echo "BACKEND_EC2_INSTANCE_ID_PROD is invalid"; exit 1; }
          [[ "$DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::${AWS_ACCOUNT_ID}:role/[A-Za-z0-9+=,.@_/-]+$ ]] \
            || { echo "AWS_DEPLOY_ROLE_ARN_PROD must be an IAM role in AWS_ACCOUNT_ID"; exit 1; }

          if [[ -n "$TARGET_IMAGE" ]]; then
            expected_repository="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
            image_digest="${TARGET_IMAGE#"$expected_repository@"}"
            [[ "$TARGET_IMAGE" == "$expected_repository@$image_digest" ]] \
              || { echo "target_image repository does not match deployment configuration"; exit 1; }
            [[ "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]] \
              || { echo "target_image must be pinned by a valid digest"; exit 1; }
          fi

      - name: Roll back prod EC2
        uses: ./.github/actions/deploy-ec2
        with:
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          ecr-repository: ${{ vars.ECR_REPOSITORY_PROD }}
          instance-id: ${{ vars.BACKEND_EC2_INSTANCE_ID_PROD }}
          deploy-role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          image-uri: ${{ inputs.target_image || format('{0}.dkr.ecr.{1}.amazonaws.com/{2}@placeholder', vars.AWS_ACCOUNT_ID, vars.AWS_REGION, vars.ECR_REPOSITORY_PROD) }}
          mode: rollback
          target-image: ${{ inputs.target_image }}
          reason: ${{ inputs.reason }}
          health-url: ${{ vars.BACKEND_URL_PROD != '' && format('{0}/actuator/health', vars.BACKEND_URL_PROD) || '' }}
