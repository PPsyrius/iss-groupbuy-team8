# Backend pipeline: quality and security gates → immutable ECR image → existing-EC2 deploy through SSM.
# Gates and thresholds: docs/quality/quality-gates.md. Plan: docs/ci/devsecops-pipeline-plan.md.
name: ci-backend

on:
  push:
    branches: [dev]
    # Path/branch filters are not evaluated for tag pushes: every v* tag runs the
    # full gate chain so the release artifact is built by the same pipeline.
    tags: ['v*']
    paths:
      - "backend/**"
      - "contracts/**"
      - "docker-compose.yaml"
      - "deployment/backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    # labeled/unlabeled: applying or removing `contract-change-approved` must
    # re-run the contract gate — the label is only visible in a fresh event.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [dev]
    paths:
      - "backend/**"
      - "contracts/**"
      - "docker-compose.yaml"
      - "deployment/backend/**"
      - ".github/workflows/ci-backend.yml"

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yaml'
              - 'deployment/backend/**'
              - '.github/workflows/ci-backend.yml'
            contracts:
              - 'backend/**'
              - 'contracts/**'

  build-quality:
    needs: detect-changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Formatting + style gates (fail fast)
        run: ./mvnw -B spotless:check checkstyle:check

      - name: Verify (unit + ArchUnit + ITs + SpotBugs + JaCoCo)
        run: ./mvnw -B verify

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports
          retention-days: 7
          path: |
            backend/blocbuy-bootstrap/target/site/jacoco-aggregate/jacoco.xml
            backend/**/target/spotbugsXml.xml
            backend/**/target/checkstyle-result.xml
          if-no-files-found: ignore

      # mvn verify already packaged the boot jar — hand it to the docker job so the
      # image build (Dockerfile.ci) doesn't repeat the whole Maven build in-container.
      - name: Upload boot jar for docker job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-boot-jar
          retention-days: 1
          path: backend/blocbuy-bootstrap/target/blocbuy-bootstrap-*.jar
          if-no-files-found: error

      - name: Upload Sonar inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-inputs
          retention-days: 1
          path: |
            backend/**/target/classes/**
            backend/**/target/test-classes/**
            backend/**/target/site/jacoco*/**
            backend/**/target/surefire-reports/**
            backend/**/target/failsafe-reports/**
          if-no-files-found: error

      # Docker packages this exact verified binary instead of rebuilding the
      # application from source.
      - name: Upload verified backend application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-application
          retention-days: 1
          path: backend/blocbuy-bootstrap/target/blocbuy-backend.jar
          if-no-files-found: error

  contract-check:
    needs: detect-changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.detect-changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Regenerate contracts/openapi.json from code
        run: ./mvnw -B post-integration-test -Popenapi-export -DskipTests -DskipITs -Dspotless.check.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true

      - name: Fail if committed contract drifted
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- contracts/

      - name: Fail on backward-incompatible API change (PR only)
        if: github.event_name == 'pull_request'
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'contract-change-approved') }}
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git show FETCH_HEAD:contracts/openapi.json > /tmp/openapi-base.json
          curl -sSfL -o /tmp/openapi-diff.jar \
            https://repo1.maven.org/maven2/org/openapitools/openapidiff/openapi-diff-cli/2.1.7/openapi-diff-cli-2.1.7-all.jar
          if [ "$APPROVED" = "true" ]; then
            java -jar /tmp/openapi-diff.jar /tmp/openapi-base.json ../contracts/openapi.json || true
            echo "::notice::Incompatible contract change approved via contract-change-approved label"
          else
            java -jar /tmp/openapi-diff.jar --fail-on-incompatible \
              /tmp/openapi-base.json ../contracts/openapi.json
          fi

  sonar:
    needs:
      - build-quality
    if: >-
      needs.build-quality.result == 'success' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The artifact's paths are relative to backend/ (upload-artifact strips the
      # common ancestor), so restore into backend/ — otherwise the scanner misses the
      # JaCoCo aggregate report, coverage reads 0%, and the quality gate fails.
      - name: Download Sonar inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonar-inputs
          path: backend

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar
          -Dsonar.token="$SONAR_TOKEN"
          -Dsonar.organization="${{ vars.SONAR_ORGANIZATION }}"
          -Dsonar.projectKey="${{ vars.SONAR_PROJECT_KEY }}"
          -Dsonar.coverage.jacoco.xmlReportPaths="blocbuy-bootstrap/target/site/jacoco-aggregate/jacoco.xml"

      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        with:
          scanMetadataReportFile: backend/target/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    needs:
      - detect-changes
      - build-quality
      - contract-check
      - sonar
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.build-quality.result == 'success' || needs.build-quality.result == 'skipped') &&
      (needs.contract-check.result == 'success' || needs.contract-check.result == 'skipped') &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped')
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.publish.outputs.image_uri }}

    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: write

    env:
      BLOCBUY_PUBLISH: >-
        ${{
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          vars.ENABLE_EC2_DEPLOY == 'true'
        }}
      BLOCBUY_ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_DEV }}
      BLOCBUY_ECR_PUSH_ROLE_ARN: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # When build-quality ran it uploaded the boot jar (mvn verify packages it);
      # Dockerfile.ci then assembles the image in seconds instead of rebuilding all
      # modules in-container. When build-quality was skipped (e.g. contracts-only PR)
      # there is no jar artifact — fall back to the full multi-stage Dockerfile.
      - name: Download boot jar from build-quality
        if: needs.build-quality.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-boot-jar
          path: backend/blocbuy-bootstrap/target

      - name: Select Dockerfile
        id: dockerfile
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ needs.build-quality.result }}" = "success" ]; then
            ls backend/blocbuy-bootstrap/target/blocbuy-bootstrap-*.jar
            echo "file=./backend/Dockerfile.ci" >> "$GITHUB_OUTPUT"
          else
            echo "file=./backend/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Download verified backend application
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-application
          path: backend/blocbuy-bootstrap/target

      - name: Verify backend application artifact
        run: test -f blocbuy-bootstrap/target/blocbuy-backend.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          file: ${{ steps.dockerfile.outputs.file }}
          load: true
          tags: blocbuy-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test EC2 profile (boot + /api/actuator/health)
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker rm -f smoke-app smoke-postgres smoke-redis >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup

          docker run -d --name smoke-postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=blocbuy -e POSTGRES_PASSWORD=blocbuy -e POSTGRES_DB=Blocbuy \
            postgres:18

          docker run -d --name smoke-redis -p 127.0.0.1:6379:6379 \
            redis:8.10 redis-server --requirepass blocbuy

          for attempt in $(seq 1 30); do
            if docker exec smoke-postgres pg_isready -U blocbuy -d Blocbuy; then
              echo "PostgreSQL became ready on attempt $attempt"
              break
            fi
            sleep 2
          done

          docker run -d --network host --name smoke-app \
            -e SPRING_PROFILES_ACTIVE=ec2 \
            -e DB_USERNAME=blocbuy -e DB_PASSWORD=blocbuy \
            -e REDIS_PASSWORD=blocbuy \
            blocbuy-backend:ci-${{ github.sha }}

          ok=0
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:8589/api/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend became healthy on attempt $attempt"
              ok=1
              break
            fi
            sleep 2
          done

          if [ "$ok" != "1" ]; then
            echo '--- smoke-app logs ---'
            docker logs smoke-app
            exit 1
          fi

      # The vulnerability DB is ~300MB and otherwise re-downloads every run. Each run
      # saves a fresh entry (run_id key) and restores the newest previous one — the DB
      # stays recent while the download drops out of the scan's critical path.
      - name: Cache Trivy vulnerability DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: blocbuy-backend:ci-${{ github.sha }}
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: 'true'
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-image.sarif

      # PRs keep the SARIF as an artifact but skip the ~45s codeql-action upload —
      # the Trivy step's exit-code already gates the merge; code scanning history
      # accumulates from dev/tag pushes.
      - name: Upload image scan SARIF
        uses: ./.github/actions/upload-sarif
        with:
          name: trivy-image
          sarif-file: trivy-image.sarif
          code-scanning: ${{ github.event_name != 'pull_request' }}

      - name: Validate ECR release configuration
        if: env.BLOCBUY_PUBLISH == 'true'
        uses: ./.github/actions/validate-ecr-publish
        with:
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          ecr-repository: ${{ env.BLOCBUY_ECR_REPOSITORY }}
          ecr-push-role-arn: ${{ env.BLOCBUY_ECR_PUSH_ROLE_ARN }}

      - name: Assume ECR publishing role with GitHub OIDC
        if: env.BLOCBUY_PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ env.BLOCBUY_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: BlocBuy-ECR-${{ github.run_id }}

      - id: login-ecr
        name: Log in to Amazon ECR
        if: env.BLOCBUY_PUBLISH == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - id: publish
        name: Publish verified image by immutable digest
        if: env.BLOCBUY_PUBLISH == 'true'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.BLOCBUY_ECR_REPOSITORY }}
          IMAGE_TAG: git-${{ github.sha }}-run-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          local_image="blocbuy-backend:ci-${GITHUB_SHA}"
          repository_uri="${REGISTRY}/${ECR_REPOSITORY}"
          tagged_image="${repository_uri}:${IMAGE_TAG}"

          docker tag "$local_image" "$tagged_image"
          docker push "$tagged_image"

          repo_digest=''
          while IFS= read -r candidate; do
            if [[ "$candidate" == "$repository_uri@"* ]]; then
              repo_digest="$candidate"
            fi
          done < <(docker image inspect "$tagged_image" --format '{{range .RepoDigests}}{{println .}}{{end}}')

          image_digest="${repo_digest#"$repository_uri@"}"

          [[ "$repo_digest" == "$repository_uri@$image_digest" ]] \
            || { echo "Docker did not record the pushed repository digest"; exit 1; }

          [[ "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]] \
            || { echo "Docker returned an invalid image digest"; exit 1; }

          ecr_digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          [[ "$ecr_digest" == "$image_digest" ]] \
            || { echo "ECR digest does not match the image that passed CI"; exit 1; }

          image_uri="${repository_uri}@${image_digest}"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"

          {
            echo "### Backend release candidate"
            echo "- Git SHA: \`$GITHUB_SHA\`"
            echo "- Image: \`$image_uri\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of Amazon ECR
        if: always() && steps.login-ecr.outcome == 'success'
        run: docker logout '${{ steps.login-ecr.outputs.registry }}'

      - name: Export release image for prod publish
        if: >-
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v') &&
          vars.ENABLE_EC2_DEPLOY_PROD == 'true'
        run: docker save blocbuy-backend:ci-${{ github.sha }} | gzip --stdout > "${RUNNER_TEMP}/backend-image.tgz"

      - name: Upload release image artifact
        if: >-
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v') &&
          vars.ENABLE_EC2_DEPLOY_PROD == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-image-${{ github.sha }}
          path: ${{ runner.temp }}/backend-image.tgz
          retention-days: 2
          if-no-files-found: error

  publish-ecr-prod:
    name: publish-ecr-prod
    # Prod publication is environment-scoped: the ECR push role trusts the stable
    # `environment:backend-prod-publish` OIDC subject because varying tag refs cannot
    # be exact-matched (infra/terraform/backend-app-stack/github-oidc.tf). The GitHub
    # environment is restricted to v* tags; approval stays on the deploy job.
    needs:
      - detect-changes
      - build-quality
      - contract-check
      - sonar
      - docker
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      vars.ENABLE_EC2_DEPLOY_PROD == 'true' &&
      needs.detect-changes.result == 'success' &&
      (needs.build-quality.result == 'success' || needs.build-quality.result == 'skipped') &&
      (needs.contract-check.result == 'success' || needs.contract-check.result == 'skipped') &&
      needs.docker.result == 'success' &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: backend-prod-publish
    outputs:
      image_uri: ${{ steps.publish.outputs.image_uri }}
    steps:
      - name: Download release image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-image-${{ github.sha }}
          path: ${{ runner.temp }}

      # Restores the exact image the docker job built, smoke-tested, and scanned —
      # same tag, same digest; publish never rebuilds.
      - name: Load release image
        run: docker load --input "${RUNNER_TEMP}/backend-image.tgz"

      - name: Validate ECR release configuration
        uses: ./.github/actions/validate-ecr-publish
        with:
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          ecr-repository: ${{ vars.ECR_REPOSITORY_PROD }}
          ecr-push-role-arn: ${{ vars.AWS_ECR_PUSH_ROLE_ARN_PROD }}

      - name: Assume ECR publishing role with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN_PROD }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: BlocBuy-ECR-Prod-${{ github.run_id }}

      - id: login-ecr
        name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - id: publish
        name: Publish verified image by immutable digest
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_PROD }}
          IMAGE_TAG: git-${{ github.sha }}-run-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          local_image="blocbuy-backend:ci-${GITHUB_SHA}"
          repository_uri="${REGISTRY}/${ECR_REPOSITORY}"
          tagged_image="${repository_uri}:${IMAGE_TAG}"

          docker tag "$local_image" "$tagged_image"
          docker push "$tagged_image"

          repo_digest=''
          while IFS= read -r candidate; do
            if [[ "$candidate" == "$repository_uri@"* ]]; then
              repo_digest="$candidate"
            fi
          done < <(docker image inspect "$tagged_image" --format '{{range .RepoDigests}}{{println .}}{{end}}')
          image_digest="${repo_digest#"$repository_uri@"}"
          [[ "$repo_digest" == "$repository_uri@$image_digest" ]] \
            || { echo "Docker did not record the pushed repository digest"; exit 1; }
          [[ "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]] \
            || { echo "Docker returned an invalid image digest"; exit 1; }

          ecr_digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "$ecr_digest" == "$image_digest" ]] \
            || { echo "ECR digest does not match the image that passed CI"; exit 1; }

          image_uri="${repository_uri}@${image_digest}"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"
          {
            echo "### Backend release candidate (prod)"
            echo "- Git SHA: \`$GITHUB_SHA\`"
            echo "- Image: \`$image_uri\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of Amazon ECR
        if: always() && steps.login-ecr.outcome == 'success'
        run: docker logout '${{ steps.login-ecr.outputs.registry }}'

  deploy-existing-ec2:
    name: deploy-existing-ec2
    # Deployments queue and finish; the workflow-level cancel policy must not interrupt a host update.
    concurrency:
      group: deploy-existing-ec2-backend-dev
      cancel-in-progress: false
    needs:
      - detect-changes
      - build-quality
      - contract-check
      - sonar
      - docker
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      vars.ENABLE_EC2_DEPLOY == 'true' &&
      needs.detect-changes.result == 'success' &&
      (needs.build-quality.result == 'success' || needs.build-quality.result == 'skipped') &&
      (needs.contract-check.result == 'success' || needs.contract-check.result == 'skipped') &&
      needs.docker.result == 'success' &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') &&
      needs.docker.outputs.image_uri != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment:
      name: backend-dev
      url: ${{ vars.BACKEND_URL_DEV }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy to dev EC2
        uses: ./.github/actions/deploy-ec2
        with:
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          ecr-repository: ${{ vars.ECR_REPOSITORY_DEV }}
          instance-id: ${{ vars.BACKEND_EC2_INSTANCE_ID_DEV }}
          deploy-role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_DEV }}
          image-uri: ${{ needs.docker.outputs.image_uri }}
          mode: deploy
          health-url: ${{ vars.BACKEND_URL_DEV != '' && format('{0}/api/actuator/health', vars.BACKEND_URL_DEV) || '' }}

  deploy-existing-ec2-prod:
    name: deploy-existing-ec2-prod
    # Same queueing rule as dev: a prod host update must never be cancelled mid-run.
    concurrency:
      group: deploy-existing-ec2-backend-prod
      cancel-in-progress: false
    needs:
      - detect-changes
      - build-quality
      - contract-check
      - sonar
      - docker
      - publish-ecr-prod
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      vars.ENABLE_EC2_DEPLOY_PROD == 'true' &&
      needs.detect-changes.result == 'success' &&
      (needs.build-quality.result == 'success' || needs.build-quality.result == 'skipped') &&
      (needs.contract-check.result == 'success' || needs.contract-check.result == 'skipped') &&
      needs.docker.result == 'success' &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped') &&
      needs.publish-ecr-prod.result == 'success' &&
      needs.publish-ecr-prod.outputs.image_uri != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    # The approval gate: backend-prod requires reviewers and is restricted to v* tags.
    environment:
      name: backend-prod
      url: ${{ vars.BACKEND_URL_PROD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy to prod EC2
        uses: ./.github/actions/deploy-ec2
        with:
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_REGION }}
          ecr-repository: ${{ vars.ECR_REPOSITORY_PROD }}
          instance-id: ${{ vars.BACKEND_EC2_INSTANCE_ID_PROD }}
          deploy-role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN_PROD }}
          image-uri: ${{ needs.publish-ecr-prod.outputs.image_uri }}
          mode: deploy
          fetch-env-path: /blocbuy/prod
          health-url: ${{ vars.BACKEND_URL_PROD != '' && format('{0}/actuator/health', vars.BACKEND_URL_PROD) || '' }}
