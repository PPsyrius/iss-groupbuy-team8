# Backend pipeline: format → lint → tests+ArchUnit → SpotBugs+JaCoCo → contract drift/breaking → Sonar → image+smoke+Trivy.
# Gates and thresholds: docs/quality/quality-gates.md. Plan: docs/ci/devsecops-pipeline-plan.md.
name: ci-backend

on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "contracts/**"
      - "docker-compose.yaml"
      - ".gha-ignore"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [dev]
    paths:
      - "backend/**"
      - "contracts/**"
      - "docker-compose.yaml"
      - ".gha-ignore"
      - ".github/workflows/ci-backend.yml"

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  build-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven # picks up backend/**/pom.xml

      - name: Formatting + style gates (fail fast)
        run: ./mvnw -B spotless:check checkstyle:check

      - name: Verify (unit + ArchUnit + ITs + SpotBugs + JaCoCo)
        run: ./mvnw -B verify

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          retention-days: 7
          path: |
            backend/blocbuy-bootstrap/target/site/jacoco-aggregate/jacoco.xml
            backend/**/target/spotbugsXml.xml
            backend/**/target/checkstyle-result.xml
          if-no-files-found: ignore

  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Regenerate contracts/openapi.json from code
        run: ./mvnw -B verify -Popenapi-export -DskipTests -Dspotless.check.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true

      # Pathspec must resolve from the repo root: `contracts/` under backend/ matches nothing
      # and git diff exits 0 — the drift check would silently never fail.
      - name: Fail if committed contract drifted
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- contracts/

      # Drift check above catches "forgot to commit"; this catches "broke consumers".
      # Old spec = base branch committed contract; new spec = regenerated from PR code.
      - name: Fail on backward-incompatible API change (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git show FETCH_HEAD:contracts/openapi.json > /tmp/openapi-base.json
          curl -sSfL -o /tmp/openapi-diff.jar \
            https://repo1.maven.org/maven2/org/openapitools/openapidiff/openapi-diff-cli/2.1.7/openapi-diff-cli-2.1.7-all.jar
          java -jar /tmp/openapi-diff.jar --fail-on-incompatible \
            /tmp/openapi-base.json ../contracts/openapi.json

  sonar:
    # Activated by setting repo variable SONAR_HOST_URL (+ secret SONAR_TOKEN).
    # SonarCloud also needs variable SONAR_ORGANIZATION. See docs/ci/devsecops-pipeline-plan.md Step 3.
    if: vars.SONAR_HOST_URL != ''
    needs: build-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for accurate new-code analysis

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}
          restore-keys: sonar-${{ runner.os }}

      - name: SonarQube scan (verify + analyze in one pass for coverage)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: >
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar
          -Dsonar.host.url="$SONAR_HOST_URL"
          -Dsonar.token="$SONAR_TOKEN"
          ${SONAR_ORGANIZATION:+-Dsonar.organization="$SONAR_ORGANIZATION"}
          -Dsonar.qualitygate.wait=true

  docker:
    # Runs on PR too: image build + smoke + scan must gate before merge, not after push.
    needs: build-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload (no-op without GHAS on private repos)
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t blocbuy-backend:ci-${{ github.sha }} backend/

      # Boot the real image against real PG 18 + Redis 8 and probe the health endpoint.
      # Container names match application-docker.yml hostnames (postgres/redis).
      - name: Smoke test (boot + /actuator/health)
        run: |
          set -e
          docker network create smoke-net
          docker run -d --network smoke-net --name postgres \
            -e POSTGRES_USER=blocbuy -e POSTGRES_PASSWORD=blocbuy -e POSTGRES_DB=Blocbuy \
            postgres:18
          docker run -d --network smoke-net --name redis \
            redis:8.1 redis-server --requirepass blocbuy
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U blocbuy -d Blocbuy && break || sleep 2
          done
          docker run -d --network smoke-net --name smoke-app -p 8589:8589 \
            -e SPRING_PROFILES_ACTIVE=docker \
            -e DB_USERNAME=blocbuy -e DB_PASSWORD=blocbuy \
            -e REDIS_PASSWORD=blocbuy \
            blocbuy-backend:ci-${{ github.sha }}
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8589/actuator/health | grep -q '"status":"UP"'; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo '--- smoke-app logs ---'; docker logs smoke-app; exit 1; fi

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: blocbuy-backend:ci-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true # gate wording is "0 unfixed"; unfixed-pending CVEs don't fail
          exit-code: '1'       # actually fail the job — default 0 only reports
          format: sarif
          output: trivy-image.sarif

      - name: Upload image scan SARIF
        continue-on-error: true # requires GHAS on private repos; job already gated by exit-code above
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
  deploy-ec2:
    name: deploy-ec2
    needs:
      - build-quality
      - contract-check
      - sonar
      - docker
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      needs.build-quality.result == 'success' &&
      needs.contract-check.result == 'success' &&
      needs.docker.result == 'success' &&
      (needs.sonar.result == 'success' || needs.sonar.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment:
      name: backend-dev
      url: ${{ steps.deploy.outputs.vm_url }}
    steps:
      - id: aws-credentials
        name: Assume AWS deployment role with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "402178232802"
          role-session-name: BlocBuy-${{ github.run_id }}
          output-credentials: true

      - id: deploy
        name: Provision EC2 and deploy Docker Compose
        uses: bitovi/github-actions-deploy-docker-to-ec2@v1.0.3
        with:
          aws_access_key_id: ${{ steps.aws-credentials.outputs.aws-access-key-id }}
          aws_secret_access_key: ${{ steps.aws-credentials.outputs.aws-secret-access-key }}
          aws_session_token: ${{ steps.aws-credentials.outputs.aws-session-token }}
          aws_default_region: ${{ vars.AWS_REGION }}

          aws_resource_identifier: ppsyrius-iss-groupbuy-team8-backend-dev
          tf_state_file_name: ppsyrius-iss-groupbuy-team8-backend-dev
          aws_additional_tags: '{"Project":"blocbuy","Environment":"dev","ManagedBy":"github-actions"}'

          aws_ec2_instance_type: t3.medium
          aws_ec2_instance_root_vol_size: 30
          aws_ec2_instance_root_vol_preserve: true
          aws_ec2_instance_public_ip: true
          aws_ec2_iam_instance_profile: BlocBuyEc2InstanceRole

          aws_vpc_create: true
          aws_vpc_cidr_block: 10.20.0.0/16
          aws_vpc_public_subnets: 10.20.10.0/24
          aws_vpc_availability_zones: ${{ vars.AWS_AVAILABILITY_ZONE }}

          aws_elb_create: true
          aws_elb_app_port: 8589
          aws_elb_app_protocol: HTTP
          aws_elb_listen_port: 80
          aws_elb_listen_protocol: HTTP
          aws_elb_healthcheck: HTTP:8589/actuator/health

          docker_repo_app_directory: /
          docker_repo_app_directory_cleanup: true
          docker_backup_retention: 5
          docker_remove_orphans: true
          docker_full_cleanup: false
          ansible_start_docker_timeout: 900

          env_ghs: ${{ secrets.BACKEND_DOT_ENV }}

          docker_cloudwatch_enable: true
          docker_cloudwatch_retention_days: 14