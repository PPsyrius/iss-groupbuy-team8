# Security scans: workflow/shell policy, secrets, dependency and deployment config, optional SAST.
# The built backend image is scanned in ci-backend.yml before it can be published.
name: security

on:
  # Keep the dev badge current with a lightweight post-merge secret scan;
  # production releases still receive the full security gate before publication.
  push:
    branches: [dev]
    tags: ['v*']
  # Merge queue gate: same security gates validate the speculative dev merge.
  merge_group:
    types: [checks_requested]
  # Run for every PR targeting dev so required security checks are always reported.
  # Specialized jobs below use detect-changes to avoid unnecessary work.
  pull_request:
    branches: [dev]
  schedule:
    - cron: '17 2 * * 1' # weekly Monday 02:17 UTC — catch newly published CVEs in unchanged deps
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Merge queue runs must never cancel each other.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  detect-changes:
    # PR/tag/weekly scans need path filtering; dev pushes only run Gitleaks.
    if: github.event_name != 'push' || github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflow: ${{ steps.filter.outputs.workflow }}
      deployment: ${{ steps.filter.outputs.deployment }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            workflow:
              - '.github/workflows/**'
              - '.github/tests/**'
              - '.github/scripts/**'
              - '.github/actions/**'
              - '.github/dependabot.yml'
              - '.gitleaks.toml'
              - '.gitleaksignore'
              - 'deployment/frontend/cloudfront/response-headers-policy.json'
              - 'infra/terraform/frontend-stack/cloudfront.tf'
              - 'fullstack-localhost/cloudfront-headers.mjs'
              - 'frontend/scripts/verify-csp-styles.mjs'
              - 'frontend/tooling/**'
            deployment:
              - 'deployment/**'
            dependencies:
              - 'backend/**/pom.xml'
              - 'backend/.mvn/**'
              - 'backend/mvnw'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
            config:
              - '.github/**'
              - 'deployment/**'
              - 'infra/**'
              - 'Dockerfile*'
              - 'docker-compose*.yml'
              - 'backend/docker-compose.yaml'
              - 'frontend/tooling/**'

  workflow-lint:
    needs: detect-changes
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.detect-changes.outputs.workflow == 'true' ||
      (github.event_name != 'pull_request' && github.event_name != 'merge_group')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test closed-PR cache cleanup safety
        run: node --test .github/tests/cleanup-pr-caches.test.cjs

      - name: Test CI tooling policies
        run: python3 -m unittest discover -s .github/tests -p '*_test.py'

      - name: Test generated CloudFront-compatible headers
        run: node --test .github/tests/security-headers.test.cjs .github/tests/style-policy.test.cjs

      - name: Lint GitHub Actions and embedded shell
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          --workdir /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  deployment-bundle:
    needs: detect-changes
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.detect-changes.outputs.deployment == 'true' ||
      (github.event_name != 'pull_request' && github.event_name != 'merge_group')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check deployment script syntax
        run: bash -n deployment/backend/bin/*.sh

      - name: ShellCheck deployment scripts
        run: >-
          docker run --rm
          --entrypoint shellcheck
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          koalaman/shellcheck-alpine@sha256:5921d946dac740cbeec2fb1c898747b6105e585130cc7f0602eec9a10f7ddb63
          /repo/deployment/backend/bin/deploy.sh
          /repo/deployment/backend/bin/fetch-env.sh
          /repo/deployment/backend/bin/health-check.sh
          /repo/deployment/backend/bin/preflight.sh
          /repo/deployment/backend/bin/rollback.sh

      - name: Enforce backend-only Compose boundary
        run: |
          set -Eeuo pipefail
          compose_json="$(docker compose \
            --file deployment/backend/compose.yml \
            config --no-interpolate --format json)"
          jq -e '
            (.services | keys == ["backend"]) and
            (.services.backend.network_mode == "host") and
            (.services.backend.environment.SPRING_PROFILES_ACTIVE == "ec2") and
            ((.services.backend | has("ports")) | not) and
            ((.services.backend | has("volumes")) | not)
          ' <<< "$compose_json" >/dev/null

      - name: Verify SSM bundle boundary and size
        run: |
          set -Eeuo pipefail
          bundle_archive="${RUNNER_TEMP}/blocbuy-backend-deployment.tgz"
          tar --create --gzip --file "$bundle_archive" \
            --directory deployment/backend compose.yml bin
          expected_entries="$(printf '%s\n' \
            compose.yml bin/ bin/deploy.sh bin/fetch-env.sh bin/health-check.sh bin/preflight.sh bin/rollback.sh \
            | LC_ALL=C sort)"
          bundle_entries="$(tar --list --gzip --file "$bundle_archive" | LC_ALL=C sort)"
          if [[ "$bundle_entries" != "$expected_entries" ]]; then
            echo "Deployment bundle contains an unexpected or missing file" >&2
            printf '%s\n' "$bundle_entries" >&2
            exit 1
          fi
          bundle_size="$(wc -c < "$bundle_archive" | tr -d ' ')"
          ((bundle_size <= 9000)) \
            || { echo "Deployment bundle exceeds the SSM inline transport limit"; exit 1; }
          echo "Deployment bundle policy passed: $bundle_size bytes"

  # Secrets can be introduced anywhere in the repository, including documentation,
  # frontend code, workflows, and configuration, so Gitleaks runs on every PR
  # and merged dev push, independently of the other scans.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action v3 lists PR commits to scope the scan on pull_request events
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a deleted secret is still a leaked secret

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # required by gitleaks-action v3 for pull_request events
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false # don't post PR comments; the job gate is enough

  trivy-deps:
    needs: detect-changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      ((github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
       needs.detect-changes.outputs.dependencies == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven # cache ~/.m2 so dependency:go-offline is cheap on repeat runs

      - name: Populate local Maven repository
        # Trivy resolves pom.xml dependencies against ~/.m2 first; resolving here
        # lets the scan run offline and avoids repo.maven.apache.org 429 blocks.
        run: ./mvnw -B -q -f pom.xml dependency:go-offline -DskipTests
        working-directory: backend

      - name: Trivy filesystem scan (Maven dependencies)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: 'true'
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: backend/
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: 'true' # otherwise entrypoint drops the severity filter and LOW findings trip exit-code
          ignore-unfixed: true # gate wording is "0 unfixed"; unfixed-pending CVEs don't fail
          exit-code: '1'       # actually fail the job — default 0 only reports
          format: sarif
          output: trivy-fs.sarif

      - name: Upload dependency scan SARIF
        if: always()
        uses: ./.github/actions/upload-sarif
        with:
          name: trivy-dependencies
          sarif-file: trivy-fs.sarif
          code-scanning: false

      # Trivy reads pnpm-lock.yaml directly; no Node setup and no ~/.m2 dependency.
      - name: Trivy filesystem scan (pnpm lockfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: frontend/
          scanners: vuln
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: 'true'
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-frontend.sarif

      - name: Upload frontend dependency scan SARIF
        if: always()
        uses: ./.github/actions/upload-sarif
        with:
          name: trivy-frontend-dependencies
          sarif-file: trivy-frontend.sarif
          code-scanning: false

  trivy-config:
    needs: detect-changes
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.detect-changes.outputs.config == 'true' ||
      (github.event_name != 'pull_request' && github.event_name != 'merge_group')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy deployment configuration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: 'true' # otherwise entrypoint drops the severity filter and LOW findings trip exit-code
          exit-code: '1'
          format: sarif
          output: trivy-config.sarif

      - name: Upload deployment configuration SARIF
        if: always()
        uses: ./.github/actions/upload-sarif
        with:
          name: trivy-configuration
          sarif-file: trivy-config.sarif
          code-scanning: false

  codeql:
    # SAST for Java. Opt-in: enable with repo variable ENABLE_CODEQL=true.
    # Code Scanning must be available for the repository.
    # See docs/ci/devsecops-pipeline-plan.md Step 5.
    if: >-
      vars.ENABLE_CODEQL == 'true' &&
      (github.event_name != 'push' || github.ref != 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      actions: read # only for private repos
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: java-kotlin
          build-mode: none # CodeQL traces compiled code itself; no Maven build needed

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:java-kotlin
