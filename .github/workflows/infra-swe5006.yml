# Offline checks only (#622): static checks and mocked plans; no AWS credentials,
# remote state, real-provider plan or apply.
name: infra-swe5006

on:
  pull_request:
    branches: [dev]
    paths:
      - "infra/terraform/**"
      - "deployment/frontend/cloudfront/**"
      - "deployment/backend/ecr-lifecycle-policy.json"
      - ".github/workflows/infra-swe5006.yml"
      - ".github/scripts/terraform_checkov_summary.py"
      - ".github/tests/terraform_ci_test.py"
  workflow_dispatch:

permissions: {}

concurrency:
  group: infra-swe5006-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.16.4
  CHECKOV_VERSION: 3.3.22
  TF_IN_AUTOMATION: "true"
  CHECKOV_SKIP_MAPPING: "true"

jobs:
  static:
    name: static (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stack: [frontend-stack, backend-app-stack]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform formatting
        env:
          STACK: ${{ matrix.stack }}
        run: terraform fmt -check -recursive "infra/terraform/${STACK}"

      - name: Terraform init and validate (no backend)
        env:
          STACK: ${{ matrix.stack }}
        run: |
          terraform -chdir="infra/terraform/${STACK}" init -backend=false -input=false -lockfile=readonly
          terraform -chdir="infra/terraform/${STACK}" validate

      - name: Test planned frontend headers with a mocked provider
        if: matrix.stack == 'frontend-stack'
        run: terraform -chdir=infra/terraform/frontend-stack test -filter=tests/security_headers.tftest.hcl

      # Only policy findings are advisory. Installation, execution, malformed
      # reports, parsing errors and empty scans still fail the job.
      - name: Checkov policy scan (advisory findings)
        shell: bash
        env:
          STACK: ${{ matrix.stack }}
        run: |
          report="${RUNNER_TEMP}/checkov-${STACK}.json"
          pipx run "checkov==${CHECKOV_VERSION}" -d "infra/terraform/${STACK}" \
            --framework terraform --download-external-modules false \
            --skip-path '\.terraform' --soft-fail --output json > "$report"
          summary="${RUNNER_TEMP}/checkov-${STACK}.md"
          python3 .github/scripts/terraform_checkov_summary.py "$report" > "$summary"
          cat "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
