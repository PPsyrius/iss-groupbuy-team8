name: 'Deploy/Rollback EC2 via SSM'
description: 'Validates, packages, and deploys or rolls back an EC2 instance via SSM with OIDC authentication'

inputs:
  aws-account-id:
    description: 'AWS account ID (12 digits)'
    required: true
  aws-region:
    description: 'AWS region (e.g. ap-southeast-1)'
    required: true
  ecr-repository:
    description: 'ECR repository name'
    required: true
  instance-id:
    description: 'EC2 instance ID'
    required: true
  deploy-role-arn:
    description: 'IAM role ARN for deployment via OIDC'
    required: true
  image-uri:
    description: 'Full ECR image URI with digest (repo@sha256:...)'
    required: true
  mode:
    description: 'deploy or rollback'
    required: true
    default: 'deploy'
  target-image:
    description: 'For rollback: specific image URI to roll back to (leave blank for previous)'
    required: false
    default: ''
  health-url:
    description: 'Full health check URL (e.g. https://example.com/api/actuator/health). Skip if empty.'
    required: false
    default: ''
  health-retries:
    description: 'Number of health check retries'
    required: false
    default: '5'
  health-retry-delay:
    description: 'Seconds between health check retries'
    required: false
    default: '3'
  deploy-timeout:
    description: 'SSM command timeout in seconds'
    required: false
    default: '900'
  fetch-env-path:
    description: 'If set, runs fetch-env.sh with this path before deploy.sh (e.g. /blocbuy/prod)'
    required: false
    default: ''
  reason:
    description: 'Incident/change reason for rollback (shown in step summary)'
    required: false
    default: ''

outputs:
  image-uri:
    description: 'The deployed/resolved image URI'
    value: ${{ steps.ssm-exec.outputs.image-uri }}
  ssm-command-id:
    description: 'The SSM command ID'
    value: ${{ steps.ssm-exec.outputs.command-id }}
  ssm-status:
    description: 'Final SSM command status'
    value: ${{ steps.ssm-exec.outputs.status }}

runs:
  using: 'composite'
  steps:
    # ------------------------------------------------------------------
    # 1. Validate deployment configuration
    # ------------------------------------------------------------------
    - name: Validate deployment configuration
      shell: bash
      env:
        AWS_ACCOUNT_ID: ${{ inputs.aws-account-id }}
        AWS_REGION: ${{ inputs.aws-region }}
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        INSTANCE_ID: ${{ inputs.instance-id }}
        DEPLOY_ROLE_ARN: ${{ inputs.deploy-role-arn }}
        IMAGE_URI: ${{ inputs.image-uri }}
      run: |
        set -Eeuo pipefail
        [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] \
          || { echo "::error::AWS_ACCOUNT_ID must contain 12 digits"; exit 1; }
        [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]$ ]] \
          || { echo "::error::AWS_REGION is invalid"; exit 1; }
        [[ "$ECR_REPOSITORY" =~ ^[a-z0-9][a-z0-9._/-]+$ ]] \
          || { echo "::error::ECR_REPOSITORY is invalid"; exit 1; }
        [[ "$INSTANCE_ID" =~ ^i-([a-f0-9]{8}|[a-f0-9]{17})$ ]] \
          || { echo "::error::INSTANCE_ID is invalid"; exit 1; }
        [[ "$DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::${AWS_ACCOUNT_ID}:role/[A-Za-z0-9+=,.@_/-]+$ ]] \
          || { echo "::error::DEPLOY_ROLE_ARN must be an IAM role in AWS_ACCOUNT_ID"; exit 1; }

        expected_repository="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
        image_digest="${IMAGE_URI#"$expected_repository@"}"
        [[ "$IMAGE_URI" == "$expected_repository@$image_digest" ]] \
          || { echo "::error::Image repository does not match deployment configuration"; exit 1; }
        [[ "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]] \
          || { echo "::error::IMAGE_URI is not pinned by a valid digest"; exit 1; }

    # ------------------------------------------------------------------
    # 2. Package deployment bundle
    # ------------------------------------------------------------------
    - name: Package deployment bundle
      if: inputs.mode == 'deploy'
      id: bundle
      shell: bash
      run: |
        set -Eeuo pipefail
        bundle_archive="${RUNNER_TEMP}/blocbuy-backend-deployment.tgz"
        tar --create --gzip --file "$bundle_archive" \
          --directory "${GITHUB_WORKSPACE}/deployment/backend" \
          compose.yml bin

        expected_entries="$(printf '%s\n' \
          compose.yml bin/ bin/deploy.sh bin/fetch-env.sh bin/health-check.sh bin/preflight.sh bin/rollback.sh \
          | LC_ALL=C sort)"
        bundle_entries="$(tar --list --gzip --file "$bundle_archive" | LC_ALL=C sort)"
        [[ "$bundle_entries" == "$expected_entries" ]] || {
          echo "::error::Deployment bundle contains an unexpected or missing file"
          printf '%s\n' "$bundle_entries" >&2
          exit 1
        }
        bundle_size="$(wc -c < "$bundle_archive" | tr -d ' ')"
        ((bundle_size <= 9000)) \
          || { echo "::error::Deployment bundle is too large for SSM inline transport"; exit 1; }
        echo "archive=$bundle_archive" >> "$GITHUB_OUTPUT"
        echo "Packaged deployment bundle: $bundle_size bytes"

    # ------------------------------------------------------------------
    # 3. Assume OIDC role
    # ------------------------------------------------------------------
    - name: Assume deployment role via OIDC
      uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
      with:
        role-to-assume: ${{ inputs.deploy-role-arn }}
        aws-region: ${{ inputs.aws-region }}
        allowed-account-ids: ${{ inputs.aws-account-id }}
        role-session-name: BlocBuy-SSM-${{ github.run_id }}

    # ------------------------------------------------------------------
    # 4. Pre-deploy health check
    # ------------------------------------------------------------------
    - name: Pre-deploy health check
      if: inputs.mode == 'deploy' && inputs.health-url != ''
      shell: bash
      env:
        HEALTH_URL: ${{ inputs.health-url }}
        HEALTH_RETRIES: ${{ inputs.health-retries }}
        HEALTH_RETRY_DELAY: ${{ inputs.health-retry-delay }}
      run: |
        set -Eeuo pipefail
        echo "Checking current deployment health before deploying..."
        if curl --fail --show-error --silent --connect-timeout 5 --max-time 10 \
          --retry "$HEALTH_RETRIES" --retry-delay "$HEALTH_RETRY_DELAY" "$HEALTH_URL" \
          | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'; then
          echo "Current deployment is healthy. Proceeding with deploy."
        else
          echo "::warning::Current deployment is unhealthy. Proceeding anyway — new deploy may fix the issue."
        fi

    # ------------------------------------------------------------------
    # 5. Execute SSM command
    # ------------------------------------------------------------------
    - name: Execute SSM command
      id: ssm-exec
      shell: bash
      env:
        AWS_ACCOUNT_ID: ${{ inputs.aws-account-id }}
        AWS_REGION: ${{ inputs.aws-region }}
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        INSTANCE_ID: ${{ inputs.instance-id }}
        IMAGE_URI: ${{ inputs.image-uri }}
        MODE: ${{ inputs.mode }}
        TARGET_IMAGE: ${{ inputs.target-image }}
        DEPLOY_TIMEOUT: ${{ inputs.deploy-timeout }}
        FETCH_ENV_PATH: ${{ inputs.fetch-env-path }}
        BUNDLE_ARCHIVE: ${{ steps.bundle.outputs.archive || '' }}
      run: |
        set -Eeuo pipefail
        remote_script="${RUNNER_TEMP}/blocbuy-remote-deploy.sh"
        request_file="${RUNNER_TEMP}/blocbuy-ssm-request.json"
        invocation_file="${RUNNER_TEMP}/blocbuy-ssm-invocation.json"

        # Build the remote script
        {
          echo 'set -Eeuo pipefail'
          if [[ "$MODE" == "deploy" ]]; then
            echo 'install -d -m 0750 /opt/blocbuy/backend/bin /opt/blocbuy/backend/state'
            printf "printf '%%s' '%s' | base64 --decode | tar --extract --gzip --file - --directory /opt/blocbuy/backend --no-same-owner\n" \
              "$(base64 --wrap=0 "$BUNDLE_ARCHIVE")"
            echo 'chown -R root:root /opt/blocbuy/backend'
            echo 'chmod 0644 /opt/blocbuy/backend/compose.yml'
            echo 'chmod 0755 /opt/blocbuy/backend/bin/*.sh'
            if [[ -n "$FETCH_ENV_PATH" ]]; then
              printf "BLOCBUY_EXPECTED_AWS_ACCOUNT_ID='%s' BLOCBUY_EXPECTED_AWS_REGION='%s' /opt/blocbuy/backend/bin/fetch-env.sh '%s'\n" \
                "$AWS_ACCOUNT_ID" "$AWS_REGION" "$FETCH_ENV_PATH"
            fi
            printf "BLOCBUY_EXPECTED_AWS_ACCOUNT_ID='%s' BLOCBUY_EXPECTED_AWS_REGION='%s' BLOCBUY_EXPECTED_ECR_REPOSITORY='%s' /opt/blocbuy/backend/bin/deploy.sh '%s' '%s'\n" \
              "$AWS_ACCOUNT_ID" "$AWS_REGION" "$ECR_REPOSITORY" "$IMAGE_URI" "$GITHUB_SHA"
          else
            echo 'test -x /opt/blocbuy/backend/bin/rollback.sh'
            if [[ -n "$TARGET_IMAGE" ]]; then
              printf "BLOCBUY_EXPECTED_AWS_ACCOUNT_ID='%s' BLOCBUY_EXPECTED_AWS_REGION='%s' BLOCBUY_EXPECTED_ECR_REPOSITORY='%s' /opt/blocbuy/backend/bin/rollback.sh '%s'\n" \
                "$AWS_ACCOUNT_ID" "$AWS_REGION" "$ECR_REPOSITORY" "$TARGET_IMAGE"
            else
              printf "BLOCBUY_EXPECTED_AWS_ACCOUNT_ID='%s' BLOCBUY_EXPECTED_AWS_REGION='%s' BLOCBUY_EXPECTED_ECR_REPOSITORY='%s' /opt/blocbuy/backend/bin/rollback.sh\n" \
                "$AWS_ACCOUNT_ID" "$AWS_REGION" "$ECR_REPOSITORY"
            fi
            # shellcheck disable=SC2016
            printf '%s\n' 'printf "BLOCBUY_ROLLBACK_IMAGE=%s\n" "$(</opt/blocbuy/backend/state/current-image)"'
          fi
        } > "$remote_script"
        bash -n "$remote_script"

        remote_script_base64="$(base64 --wrap=0 "$remote_script")"
        if [[ "$MODE" == "deploy" ]]; then
          (( ${#remote_script_base64} <= 18000 )) \
            || { echo "::error::Encoded SSM deploy command is too large"; exit 1; }
        else
          (( ${#remote_script_base64} <= 4000 )) \
            || { echo "::error::Encoded SSM rollback command is unexpectedly large"; exit 1; }
        fi
        ssm_command="printf '%s' '$remote_script_base64' | base64 --decode | bash"

        if [[ "$MODE" == "deploy" ]]; then
          comment="Deploy BlocBuy backend ${GITHUB_SHA:0:12}"
        else
          comment="BlocBuy rollback ${GITHUB_RUN_ID}"
        fi

        jq -n \
          --arg instance_id "$INSTANCE_ID" \
          --arg comment "$comment" \
          --arg command "$ssm_command" \
          --arg timeout "$DEPLOY_TIMEOUT" \
          '{
            InstanceIds: [$instance_id],
            DocumentName: "AWS-RunShellScript",
            Comment: $comment,
            TimeoutSeconds: ($timeout | tonumber),
            Parameters: {commands: [$command]}
          }' > "$request_file"

        command_id="$(aws ssm send-command \
          --cli-input-json "file://$request_file" \
          --query 'Command.CommandId' \
          --output text)"
        [[ "$command_id" =~ ^[a-f0-9-]{36}$ ]] \
          || { echo "::error::SSM returned an invalid command ID"; exit 1; }
        echo "SSM command: $command_id"
        echo "command-id=$command_id" >> "$GITHUB_OUTPUT"

        # Poll for completion: (timeout / 5) + 1 iterations, capped at 300
        poll_iterations=$(( (DEPLOY_TIMEOUT / 5) + 1 ))
        (( poll_iterations > 300 )) && poll_iterations=300
        command_status='Pending'
        for attempt in $(seq 1 "$poll_iterations"); do
          command_status="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' \
            --output text 2>/dev/null || true)"
          case "$command_status" in
            Success|Cancelled|TimedOut|Failed) break ;;
          esac
          if ((attempt % 12 == 0)); then
            echo "SSM command is still $command_status after $((attempt * 5)) seconds"
          fi
          sleep 5
        done

        echo "SSM command final status: $command_status"

        aws ssm get-command-invocation \
          --command-id "$command_id" \
          --instance-id "$INSTANCE_ID" \
          --output json > "$invocation_file"
        jq -r '"SSM status: \(.Status)\n--- stdout ---\n\(.StandardOutputContent)\n--- stderr ---\n\(.StandardErrorContent)"' \
          "$invocation_file"

        final_status="$(jq -r '.Status' "$invocation_file")"
        echo "status=$final_status" >> "$GITHUB_OUTPUT"

        # Parse resolved image for step summary
        if [[ "$MODE" == "rollback" ]]; then
          standard_output="$(jq -r '.StandardOutputContent // ""' "$invocation_file")"
          resolved_image="$(sed -n 's/^BLOCBUY_ROLLBACK_IMAGE=//p' <<< "$standard_output" | tail -n 1)"
        else
          resolved_image="$IMAGE_URI"
        fi
        echo "image-uri=${resolved_image:-$IMAGE_URI}" >> "$GITHUB_OUTPUT"

        [[ "$final_status" == 'Success' ]] || exit 1

    # ------------------------------------------------------------------
    # 6. Verify rollback image
    # ------------------------------------------------------------------
    - name: Verify rollback image
      if: inputs.mode == 'rollback'
      shell: bash
      env:
        AWS_ACCOUNT_ID: ${{ inputs.aws-account-id }}
        AWS_REGION: ${{ inputs.aws-region }}
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        IMAGE_URI: ${{ steps.ssm-exec.outputs.image-uri }}
      run: |
        set -Eeuo pipefail
        expected_repository="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
        resolved_digest="${IMAGE_URI#"$expected_repository@"}"
        [[ "$IMAGE_URI" == "$expected_repository@$resolved_digest" ]] \
          || { echo "::error::Rollback succeeded but resulting image repository is unexpected"; exit 1; }
        [[ "$resolved_digest" =~ ^sha256:[a-f0-9]{64}$ ]] \
          || { echo "::error::Rollback succeeded but resulting image is not digest-pinned"; exit 1; }

    # ------------------------------------------------------------------
    # 7. Verify backend health
    # ------------------------------------------------------------------
    - name: Verify backend health
      id: verify-health
      if: inputs.health-url != ''
      shell: bash
      env:
        HEALTH_URL: ${{ inputs.health-url }}
        HEALTH_RETRIES: ${{ inputs.health-retries }}
        HEALTH_RETRY_DELAY: ${{ inputs.health-retry-delay }}
      run: |
        set -Eeuo pipefail
        curl --fail --show-error --silent --connect-timeout 5 --max-time 10 \
          --retry "$HEALTH_RETRIES" --retry-delay "$HEALTH_RETRY_DELAY" "$HEALTH_URL" \
          | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'

    # ------------------------------------------------------------------
    # 8. Rollback on failure
    # ------------------------------------------------------------------
    - name: Rollback on health check failure
      id: rollback-on-failure
      if: inputs.mode == 'deploy' && steps.verify-health.outcome == 'failure' && inputs.health-url != ''
      shell: bash
      env:
        AWS_ACCOUNT_ID: ${{ inputs.aws-account-id }}
        AWS_REGION: ${{ inputs.aws-region }}
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        INSTANCE_ID: ${{ inputs.instance-id }}
        DEPLOY_TIMEOUT: ${{ inputs.deploy-timeout }}
      run: |
        set -Eeuo pipefail
        echo "::warning::Health check failed. Initiating automatic rollback to previous image..."
        remote_script="${RUNNER_TEMP}/blocbuy-rollback-on-failure.sh"
        request_file="${RUNNER_TEMP}/blocbuy-ssm-rollback-request.json"
        invocation_file="${RUNNER_TEMP}/blocbuy-ssm-rollback-invocation.json"

        # Build rollback script (no target image = rollback to previous)
        {
          echo 'set -Eeuo pipefail'
          echo 'test -x /opt/blocbuy/backend/bin/rollback.sh'
          printf "BLOCBUY_EXPECTED_AWS_ACCOUNT_ID='%s' BLOCBUY_EXPECTED_AWS_REGION='%s' BLOCBUY_EXPECTED_ECR_REPOSITORY='%s' /opt/blocbuy/backend/bin/rollback.sh\n" \
            "$AWS_ACCOUNT_ID" "$AWS_REGION" "$ECR_REPOSITORY"
          # shellcheck disable=SC2016
          printf '%s\n' 'printf "BLOCBUY_ROLLBACK_IMAGE=%s\n" "$(</opt/blocbuy/backend/state/current-image)"'
        } > "$remote_script"
        bash -n "$remote_script"

        remote_script_base64="$(base64 --wrap=0 "$remote_script")"
        (( ${#remote_script_base64} <= 4000 )) \
          || { echo "::error::Encoded SSM rollback command is too large"; exit 1; }
        ssm_command="printf '%s' '$remote_script_base64' | base64 --decode | bash"

        jq -n \
          --arg instance_id "$INSTANCE_ID" \
          --arg command "$ssm_command" \
          --arg timeout "$DEPLOY_TIMEOUT" \
          '{
            InstanceIds: [$instance_id],
            DocumentName: "AWS-RunShellScript",
            Comment: "BlocBuy auto-rollback on health check failure",
            TimeoutSeconds: ($timeout | tonumber),
            Parameters: {commands: [$command]}
          }' > "$request_file"

        command_id="$(aws ssm send-command \
          --cli-input-json "file://$request_file" \
          --query 'Command.CommandId' \
          --output text)"
        echo "Auto-rollback SSM command: $command_id"

        poll_iterations=$(( (DEPLOY_TIMEOUT / 5) + 1 ))
        (( poll_iterations > 300 )) && poll_iterations=300
        command_status='Pending'
        for attempt in $(seq 1 "$poll_iterations"); do
          command_status="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' \
            --output text 2>/dev/null || true)"
          case "$command_status" in
            Success|Cancelled|TimedOut|Failed) break ;;
          esac
          if ((attempt % 12 == 0)); then
            echo "Auto-rollback is still $command_status after $((attempt * 5)) seconds"
          fi
          sleep 5
        done

        echo "Auto-rollback SSM final status: $command_status"

        aws ssm get-command-invocation \
          --command-id "$command_id" \
          --instance-id "$INSTANCE_ID" \
          --output json > "$invocation_file"
        jq -r '"Auto-rollback SSM status: \(.Status)\n--- stdout ---\n\(.StandardOutputContent)\n--- stderr ---\n\(.StandardErrorContent)"' \
          "$invocation_file"

        final_status="$(jq -r '.Status' "$invocation_file")"
        if [[ "$final_status" != 'Success' ]]; then
          echo "::error::Auto-rollback failed with status: $final_status"
          exit 1
        fi
        echo "Auto-rollback completed successfully"

    # ------------------------------------------------------------------
    # 9. Write step summary
    # ------------------------------------------------------------------
    - name: Write step summary
      if: always()
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        IMAGE_URI: ${{ steps.ssm-exec.outputs.image-uri }}
        SSM_COMMAND_ID: ${{ steps.ssm-exec.outputs.command-id }}
        SSM_STATUS: ${{ steps.ssm-exec.outputs.status }}
        INSTANCE_ID: ${{ inputs.instance-id }}
        REASON: ${{ inputs.reason }}
        HEALTH_URL: ${{ inputs.health-url }}
        ROLLBACK_STATUS: ${{ steps.rollback-on-failure.outcome || 'skipped' }}
      run: |
        if [[ "$MODE" == "deploy" ]]; then
          {
            echo "### Existing EC2 backend deployment"
            echo "- Git SHA: \`$GITHUB_SHA\`"
            echo "- Image: \`$IMAGE_URI\`"
            echo "- EC2 instance: \`$INSTANCE_ID\`"
            echo "- SSM command: \`$SSM_COMMAND_ID\`"
            echo "- Status: \`$SSM_STATUS\`"
            if [[ -n "$HEALTH_URL" ]]; then
              if [[ "$ROLLBACK_STATUS" == "success" ]]; then
                echo "- Health check: **FAILED** (auto-rollback succeeded)"
              elif [[ "$ROLLBACK_STATUS" == "failure" ]]; then
                echo "- Health check: **FAILED** (auto-rollback also failed)"
              elif [[ "$SSM_STATUS" == "Success" ]]; then
                echo "- Health check: **PASSED**"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        else
          safe_reason="${REASON//$'\r'/ }"
          safe_reason="${safe_reason//$'\n'/ }"
          {
            echo "### Existing EC2 backend rollback"
            echo "- Requested by: \`$GITHUB_ACTOR\`"
            echo "- Reason: $safe_reason"
            echo "- Requested image: \`${{ inputs.target-image || 'recorded previous image' }}\`"
            echo "- Resulting image: \`${IMAGE_URI:-unknown}\`"
            echo "- EC2 instance: \`$INSTANCE_ID\`"
            echo "- SSM command: \`$SSM_COMMAND_ID\`"
            echo "- Status: \`$SSM_STATUS\`"
          } >> "$GITHUB_STEP_SUMMARY"
        fi
