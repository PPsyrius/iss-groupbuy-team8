name: 'Upload SARIF report'
description: 'Preserves scan report as artifact and uploads to GitHub Code Scanning'

inputs:
  name:
    description: 'Artifact name for the SARIF report'
    required: true
  sarif-file:
    description: 'Path to the SARIF file'
    required: true
  code-scanning:
    description: >-
      Upload to GitHub Code Scanning via codeql-action (~45s). Set to 'false' to
      keep only the artifact — e.g. on PRs, where the scan step already gates and
      code scanning history accumulates from branch pushes.
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Preserve scan report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.sarif-file }}
        if-no-files-found: warn
        retention-days: 7

    - name: Upload SARIF
      if: always() && inputs.code-scanning == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        sarif_file: ${{ inputs.sarif-file }}
