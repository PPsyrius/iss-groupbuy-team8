# notification: the notification-svc assembly (backend ADR 0008). Always after a connection profile:
# ec2,notification,aws on ECS, local,notification on a workstation. blocbuy-bootstrap's application.yml
# stays the shared base, so only what differs from the monolith is set here.
spring:
  application:
    name: notification-svc
  flyway:
    # the full migration stream, then the per-service grants callback (blocbuy-platform)
    locations: classpath:db/migration,classpath:db/swe5001
    placeholders:
      service: notification
      # runtime role restricted by the grants; the callback skips when it is empty or the Flyway user
      approle: ${DB_USERNAME:}

mybatis:
  # this service's mapper XML only; the interfaces come from the entry class's @MapperScan
  mapper-locations: classpath*:mapper/notification/**/*.xml,classpath*:mapper/common/**/*.xml

blocbuy:
  topology: distributed
