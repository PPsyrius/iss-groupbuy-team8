spring:
  application:
    name: blocbuy-backend
  profiles:
    active: local
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: domain

  datasource:
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*.xml
  # UUID <-> pg uuid handler (MyBatis core has none); see UuidTypeHandler
  type-handlers-package: com.blocbuy.common.persistence

sa-token:
  token-name: blocbuy-token
  timeout: 86400
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  cookie:
    # token cookie: unreadable from JS (XSS exfiltration barrier), HTTPS-only, not sent on
    # cross-site subrequests (CSRF mitigation; Lax keeps the Google OAuth redirect working)
    http-only: true
    secure: true
    same-site: Lax

server:
  port: 8589
  shutdown: graceful

management:
  endpoints:
    web:
      # /api prefix: CloudFront/ALB forward only /api/*, so actuator must live under it
      # (health probes: /api/actuator/health). No server.servlet.context-path — the /api
      # prefix is carried by the controller mappings (ApiConstants.API_V1), never doubled.
      base-path: /api/actuator
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html

blocbuy:
  payment:
    stripe:
      # secrets via environment only — never commit values
      api-key: ${STRIPE_API_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  oauth:
    google:
      # secrets via environment only — never commit values; redirect-uri must match the Google console
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      # no default here: non-local deployments MUST set GOOGLE_REDIRECT_URI explicitly
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
      state-ttl-seconds: 300
