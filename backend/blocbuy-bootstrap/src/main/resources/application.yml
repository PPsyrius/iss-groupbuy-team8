spring:
  application:
    name: blocbuy-backend
  profiles:
    active: local
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: domain
    postgresql:
      # V23 uses concurrent index creation; a transactional advisory lock blocks that DDL.
      transactional-lock: false

  datasource:
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  task:
    scheduling:
      shutdown:
        # bounded grace for the whole scheduled task; below compose stop_grace_period (30s)
        await-termination: true
        await-termination-period: 20s

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*.xml
  # UUID <-> pg uuid handler (MyBatis core has none); see UuidTypeHandler
  type-handlers-package: com.blocbuy.common.persistence

sa-token:
  token-name: blocbuy-token
  timeout: 86400
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  cookie:
    # token cookie: unreadable from JS (XSS exfiltration barrier), HTTPS-only, not sent on
    # cross-site subrequests (CSRF mitigation; Lax keeps the Google OAuth redirect working)
    http-only: true
    secure: true
    same-site: Lax

server:
  port: 8589
  shutdown: graceful

management:
  endpoints:
    web:
      # /api prefix: CloudFront/ALB forward only /api/*, so actuator must live under it
      # (health probes: /api/actuator/health). No server.servlet.context-path — the /api
      # prefix is carried by the controller mappings (ApiConstants.API_V1), never doubled.
      base-path: /api/actuator
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html

blocbuy:
  events:
    # Cross-service event persistence is opt-in; SWE5006 EC2 stays off, SWE5001 commerce may opt in.
    enabled: ${BLOCBUY_EVENTS_ENABLED:false}
    relay:
      # Delivery is independently opt-in; the EC2 dev profile has no broker and leaves this off.
      enabled: ${BLOCBUY_EVENTS_RELAY_ENABLED:false}
    transport: ${BLOCBUY_EVENTS_TRANSPORT:sqs}
    # Empty: the AWS SDK default region chain (AWS_REGION on ECS). Never a guessed Region.
    region: ${BLOCBUY_EVENTS_REGION:}
    sqs:
      endpoint: ${BLOCBUY_EVENTS_SQS_ENDPOINT:}
      queue-url: ${BLOCBUY_EVENTS_SQS_QUEUE_URL:}
    sns:
      topic-arn: ${BLOCBUY_EVENTS_SNS_TOPIC_ARN:}
    consumer:
      # Notification SQS consumer (#446), independently opt-in; the EC2 dev stack runs no broker.
      # Receives from blocbuy.events.sqs.queue-url with the region/endpoint above, whatever the
      # relay transport. Runs in the monolith and in notification-svc, never in commerce/identity.
      enabled: ${BLOCBUY_EVENTS_CONSUMER_ENABLED:false}
      # ledger key in sys_consumed_message.consumer
      name: notification
      # messages handled at once; nothing more is received while all workers are busy
      concurrency: ${BLOCBUY_EVENTS_CONSUMER_CONCURRENCY:4}
      max-messages: 10
      wait-time: 20s
      # set on every receive (ElasticMQ's queue default is 30 s); matches the Terraform queue
      visibility-timeout: 60s
      # in-flight messages still unfinished after this are made visible again on shutdown
      shutdown-timeout: 15s
      error-backoff: 5s
  scheduling:
    # master switch, off by default everywhere; deployments opt in after their backlog check
    enabled: false
    team-expiry:
      interval: PT1M
      initial-delay: PT30S
      # a crashed holder blocks other instances no longer than this
      lease: PT2M
      batch-size: 100
    purchase-intent-expiry:
      interval: PT1M
      initial-delay: PT30S
      lease: PT2M
      batch-size: 100
    refund-worker:
      # one due obligation per tick; independent of Checkout and gated by master opt-in
      interval: PT30S
      initial-delay: PT45S
      lease: PT2M
  # frontend.* redirect targets (OAuth callback 302 landings) are mandatory and startup-validated
  # (@NotBlank on AuthWebProperties) — no defaults here on purpose; each profile supplies them,
  # non-local profiles via FRONTEND_URL only
  frontend:
    # HTTPS-only flag for the OAuth state-binding cookie; the plain-HTTP profiles (local/docker)
    # override to false. Always equal to sa-token.cookie.secure (CookieSecurityProfileTest).
    state-cookie-secure: true
  payment:
    checkout:
      success-url: ${BLOCBUY_PAYMENT_CHECKOUT_SUCCESS_URL:}
      cancel-url: ${BLOCBUY_PAYMENT_CHECKOUT_CANCEL_URL:}
    stripe:
      checkout-enabled: ${BLOCBUY_STRIPE_CHECKOUT_ENABLED:false}
      # secrets via environment only — never commit values
      api-key: ${STRIPE_API_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  oauth:
    google:
      # secrets via environment only — never commit values; redirect-uri must match the Google console
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      # no default here: non-local deployments MUST set GOOGLE_REDIRECT_URI explicitly
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
      state-ttl-seconds: 300
  catalog:
    search:
      typesafe:
        enabled: ${TYPESAFE_ENABLED:false}
        api-key: ${TYPESAFE_API_KEY:}
        endpoint: ${TYPESAFE_ENDPOINT:https://api.typesafe.ai/v1/systemone}
        model: ${TYPESAFE_MODEL:jev-latest}
        connect-timeout-millis: ${TYPESAFE_CONNECT_TIMEOUT_MILLIS:1000}
        read-timeout-millis: ${TYPESAFE_READ_TIMEOUT_MILLIS:2000}
