# docker: backend inside the compose network; PG/Redis reached by service name.
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/Blocbuy?currentSchema=domain
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 3s

sa-token:
  cookie:
    # compose exposes the backend over plain HTTP — browsers refuse Secure cookies over HTTP
    secure: false

blocbuy:
  events:
    enabled: ${BLOCBUY_EVENTS_ENABLED:false}
    relay:
      enabled: ${BLOCBUY_EVENTS_RELAY_ENABLED:false}
    consumer:
      enabled: ${BLOCBUY_EVENTS_CONSUMER_ENABLED:false}
    transport: ${BLOCBUY_EVENTS_TRANSPORT:sqs}
    sqs:
      endpoint: ${BLOCBUY_EVENTS_SQS_ENDPOINT:http://elasticmq:9324}
      queue-url: ${BLOCBUY_EVENTS_SQS_QUEUE_URL:http://elasticmq:9324/000000000000/notification-events}
  scheduling:
    # team-expiry sweep (#28); opt in after checking the local overdue-team backlog
    enabled: ${BLOCBUY_SCHEDULING_ENABLED:false}
  frontend:
    # SPA origin via env only — no deployment host in the repo; startup validation fails fast when
    # FRONTEND_URL is unset
    success-redirect-uri: "${FRONTEND_URL:}/auth/callback"
    failure-redirect-uri: "${FRONTEND_URL:}/login?error={errorCode}"
    # same transport constraint as sa-token.cookie.secure above — compose serves plain HTTP
    state-cookie-secure: false
