# docker: backend inside the compose network; PG/Redis reached by service name.
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/Blocbuy?currentSchema=domain
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 3s

sa-token:
  cookie:
    # compose exposes the backend over plain HTTP — browsers refuse Secure cookies over HTTP
    secure: false

blocbuy:
  scheduling:
    # team-expiry sweep (#28); set BLOCBUY_SCHEDULING_ENABLED=false to pause it without a code change
    enabled: ${BLOCBUY_SCHEDULING_ENABLED:true}
  frontend:
    # SPA origin via env only — no deployment host in the repo; startup validation fails fast when
    # FRONTEND_URL is unset
    success-redirect-uri: "${FRONTEND_URL:}/auth/callback"
    failure-redirect-uri: "${FRONTEND_URL:}/login?error={errorCode}"
    # same transport constraint as sa-token.cookie.secure above — compose serves plain HTTP
    state-cookie-secure: false
