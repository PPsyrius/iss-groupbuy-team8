# openapi-export: used ONLY by the springdoc-openapi-maven-plugin (make contract-check).
# Boots the app without touching live PG/Redis: Flyway off, and nothing ever opens a connection —
# so no credentials exist here at all (no placeholder secrets to leak).
server:
  port: 18080

springdoc:
  api-docs:
    # the springdoc-maven-plugin fetches apiDocsUrl=http://localhost:18080/v3/api-docs;
    # keep the default path here while every real profile serves it under /api
    path: /v3/api-docs

spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/blocbuy_export_placeholder?currentSchema=domain
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1s

# export profile boots the app for contract generation only; placeholder redirect targets satisfy
# the mandatory startup validation — no browser flow ever runs here
blocbuy:
  frontend:
    success-redirect-uri: "http://localhost:5173/"
    failure-redirect-uri: "http://localhost:5173/login?error={errorCode}"
