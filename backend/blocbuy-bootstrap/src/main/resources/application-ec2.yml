# ec2: backend container uses the Linux host network and reaches the existing PostgreSQL/Redis
# services through host loopback. Secrets remain external environment variables.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/Blocbuy?currentSchema=domain}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3s

sa-token:
  cookie:
    # EC2 Compose deployment has no TLS termination yet (CloudFront/ALB to be executed);
    # browsers refuse Secure cookies over plain HTTP, so the flag must be false until
    # the entry layer is completed.
    secure: false

logging:
  level:
    com.blocbuy: info

blocbuy:
  frontend:
    # SPA origin via env only — no deployment host in the repo; startup validation fails fast when
    # FRONTEND_URL is unset
    success-redirect-uri: "${FRONTEND_URL:}/auth/callback"
    failure-redirect-uri: "${FRONTEND_URL:}/login?error={errorCode}"
    # same transport constraint as sa-token.cookie.secure above — flip both at the CloudFront cutover
    state-cookie-secure: false
