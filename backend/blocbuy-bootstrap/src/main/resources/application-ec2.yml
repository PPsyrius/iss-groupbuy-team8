# ec2: backend container uses the Linux host network and reaches the existing PostgreSQL/Redis
# services through host loopback. Secrets remain external environment variables.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/Blocbuy?currentSchema=domain}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3s

# sa-token.cookie.secure and blocbuy.frontend.state-cookie-secure inherit the base `true`:
# browsers reach this profile only through CloudFront over HTTPS (redirect-to-https, #96)

logging:
  level:
    com.blocbuy: info

blocbuy:
  web:
    # CloudFront sets this header itself; getRemoteAddr() is the caller-controlled leftmost
    # X-Forwarded-For value under the framework forward-headers strategy (#201)
    client-address-header: CloudFront-Viewer-Address
  scheduling:
    # team-expiry sweep (#28); enable only after the deployment backlog check
    enabled: ${BLOCBUY_SCHEDULING_ENABLED:false}
  frontend:
    # SPA origin via env only — no deployment host in the repo; startup validation fails fast when
    # FRONTEND_URL is unset
    success-redirect-uri: "${FRONTEND_URL:}/auth/callback"
    failure-redirect-uri: "${FRONTEND_URL:}/login?error={errorCode}"
