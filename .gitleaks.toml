# Gitleaks config: default ruleset + BlocBuy allowlists.
# Real secrets must NEVER be committed regardless of allowlist — these only silence
# placeholders (${VAR} in yml), docs examples, lockfiles, and the Stripe contract-baseline
# JSON (sha256 content hashes of tracked source files, no secrets).
[extend]
useDefault = true

[allowlist]
  description = "BlocBuy global allowlist"
  paths = [
    '''^docs/''',
    '''^backend/docs/''',
    '''^contracts/''',
    '''^scripts/stripe-dev-contract-baseline\.json$''',
    '''\.gitleaks\.toml$''',
    '''(package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$''',
  ]
  regexes = [
    '''\$\{[A-Z_]+(:[^}]*)?\}''', # ${DB_PASSWORD} / ${STRIPE_API_KEY:} env placeholders
  ]
