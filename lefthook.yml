pre-commit:
  parallel: false
  commands:
    frontend-format:
      # Lefthook evaluates glob/exclude patterns from the Git repository root;
      # `root` changes the command CWD and limits files to frontend/, but does
      # not rebase these patterns.
      root: "frontend/"
      glob: "*.{ts,tsx,js,mjs,cjs,json,css,md,yaml,yml}"
      exclude:
        [
          "frontend/src/api/generated/**",
          "frontend/src/routeTree.gen.ts",
          "frontend/docs/**",
          "frontend/README.md",
          "frontend/**/README.md",
          "frontend/AGENTS.md",
          "frontend/CLAUDE.md",
        ]
      # oxfmt's own ignorePatterns (e.g. README.md at any depth) can leave it no file to format;
      # that is a skip, not an error.
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    frontend-lint:
      root: "frontend/"
      glob: "*.{ts,tsx}"
      exclude:
        [
          "frontend/src/api/generated/**",
          "frontend/src/routeTree.gen.ts",
        ]
      run: pnpm exec oxlint --type-aware {staged_files}
    frontend-typecheck:
      root: "frontend/"
      glob: "*.{ts,tsx}"
      run: pnpm exec tsc --noEmit
