<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="1160" height="520" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="lvTeal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3E8FB"/></linearGradient>
    <linearGradient id="lvOrange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FBDFD9"/></linearGradient>
    <linearGradient id="lvYellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6E2"/><stop offset="1" stop-color="#FFEDC7"/></linearGradient>
    <linearGradient id="lvGrey" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECE6DC"/></linearGradient>
    <linearGradient id="lvSlate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFE9DF"/></linearGradient>
    <marker id="lvFill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B1A18"/></marker>
    <marker id="lvFillRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8402A"/></marker>
    <marker id="lvOpen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#1B1A18" stroke-width="1.6"/></marker>
  </defs>

  <!-- ===== Packages ===== -->
  <rect x="440" y="18" width="210" height="28" fill="#E3E8FB" stroke="#3E5CD9" stroke-width="1.4"/>
  <text x="452" y="38" font-size="16" fill="#3E5CD9">«platform services»</text>
  <rect x="440" y="46" width="560" height="152" fill="#F1F4FD" stroke="#3E5CD9" stroke-width="1.4"/>

  <rect x="745" y="304" width="215" height="28" fill="#FBDFD9" stroke="#E8402A" stroke-width="1.4"/>
  <text x="757" y="324" font-size="16" fill="#B02E1B">«business application»</text>
  <rect x="745" y="332" width="255" height="150" fill="#FDEFEC" stroke="#E8402A" stroke-width="1.4"/>

  <!-- ===== Actors ===== -->
  <g stroke="#6B655C" stroke-width="1.6" fill="none">
    <circle cx="50" cy="66" r="11" fill="url(#lvGrey)"/>
    <line x1="50" y1="77" x2="50" y2="110"/><line x1="32" y1="88" x2="68" y2="88"/>
    <line x1="50" y1="110" x2="36" y2="134"/><line x1="50" y1="110" x2="64" y2="134"/>
    <circle cx="50" cy="300" r="11" fill="url(#lvGrey)"/>
    <line x1="50" y1="311" x2="50" y2="344"/><line x1="32" y1="322" x2="68" y2="322"/>
    <line x1="50" y1="344" x2="36" y2="368"/><line x1="50" y1="344" x2="64" y2="368"/>
  </g>
  <text x="50" y="158" font-size="18" font-weight="700" fill="#1B1A18" text-anchor="middle">Producer</text>
  <text x="52" y="177" font-size="15" fill="#6B655C" text-anchor="middle">seller · admin</text>
  <text x="50" y="392" font-size="18" font-weight="700" fill="#1B1A18" text-anchor="middle">Consumer</text>
  <text x="50" y="411" font-size="15" fill="#6B655C" text-anchor="middle">buyer</text>

  <!-- ===== Web SPA ===== -->
  <rect x="104" y="200" width="118" height="80" fill="url(#lvSlate)" stroke="#6B655C" stroke-width="1.5"/>
  <g fill="#FFFFFF" stroke="#6B655C" stroke-width="1"><rect x="203" y="206" width="11" height="14"/><rect x="200" y="209" width="6" height="3"/><rect x="200" y="215" width="6" height="3"/></g>
  <text x="150" y="223" font-size="15" fill="#6B655C" text-anchor="middle">«component»</text>
  <text x="163" y="247" font-size="18" font-weight="700" fill="#1B1A18" text-anchor="middle">Web SPA</text>
  <text x="163" y="267" font-size="15" fill="#1B1A18" text-anchor="middle">(React)</text>

  <!-- ===== Edge routing node ===== -->
  <polygon points="250,82 260,72 400,72 390,82" fill="#EFE9DF" stroke="#6B655C" stroke-width="1.5"/>
  <polygon points="390,82 400,72 400,372 390,382" fill="#DDD5C8" stroke="#6B655C" stroke-width="1.5"/>
  <rect x="250" y="82" width="140" height="300" fill="url(#lvSlate)" stroke="#6B655C" stroke-width="1.5"/>
  <text x="320" y="106" font-size="15" fill="#6B655C" text-anchor="middle">/auth, /users</text>
  <text x="383" y="158" font-size="15" fill="#6B655C" text-anchor="end">/notifications</text>
  <text x="320" y="212" font-size="15" fill="#6B655C" text-anchor="middle">«node»</text>
  <text x="320" y="236" font-size="18" font-weight="700" fill="#1B1A18" text-anchor="middle">Edge routing</text>
  <text x="320" y="258" font-size="16" fill="#1B1A18" text-anchor="middle">CloudFront</text>
  <text x="320" y="278" font-size="15" fill="#1B1A18" text-anchor="middle">+ ALB path rules</text>
  <text x="320" y="368" font-size="15" fill="#6B655C" text-anchor="middle">/api/* (rest)</text>

  <!-- ===== notification-svc ===== -->
  <rect x="452" y="58" width="262" height="128" fill="url(#lvTeal)" stroke="#3E5CD9" stroke-width="1.6"/>
  <g fill="#FFFFFF" stroke="#3E5CD9" stroke-width="1"><rect x="695" y="64" width="11" height="14"/><rect x="692" y="67" width="6" height="3"/><rect x="692" y="73" width="6" height="3"/></g>
  <text x="583" y="81" font-size="15" fill="#6B655C" text-anchor="middle">«component»</text>
  <text x="583" y="104" font-size="18" font-weight="700" fill="#3E5CD9" text-anchor="middle">notification-svc</text>
  <text x="530" y="140" font-size="16" fill="#1B1A18" text-anchor="middle">reacts to</text>
  <text x="530" y="160" font-size="16" fill="#1B1A18" text-anchor="middle">events only</text>
  <path d="M604,124 A44,8 0 0 1 692,124 V168 A44,8 0 0 1 604,168 Z" fill="#FFFFFF" stroke="#3E5CD9" stroke-width="1.4"/>
  <path d="M604,124 A44,8 0 0 0 692,124" fill="none" stroke="#3E5CD9" stroke-width="1.4"/>
  <text x="648" y="149" font-size="15" fill="#1B1A18" text-anchor="middle">notification</text>
  <text x="648" y="166" font-size="15" fill="#1B1A18" text-anchor="middle">DB</text>

  <!-- ===== identity-svc ===== -->
  <rect x="726" y="58" width="262" height="128" fill="url(#lvTeal)" stroke="#3E5CD9" stroke-width="1.6"/>
  <g fill="#FFFFFF" stroke="#3E5CD9" stroke-width="1"><rect x="969" y="64" width="11" height="14"/><rect x="966" y="67" width="6" height="3"/><rect x="966" y="73" width="6" height="3"/></g>
  <text x="857" y="81" font-size="15" fill="#6B655C" text-anchor="middle">«component»</text>
  <text x="857" y="104" font-size="18" font-weight="700" fill="#3E5CD9" text-anchor="middle">identity-svc</text>
  <text x="806" y="140" font-size="16" fill="#1B1A18" text-anchor="middle">Google sign-in</text>
  <text x="806" y="160" font-size="16" fill="#1B1A18" text-anchor="middle">users · roles</text>
  <path d="M884,124 A44,8 0 0 1 972,124 V168 A44,8 0 0 1 884,168 Z" fill="#FFFFFF" stroke="#3E5CD9" stroke-width="1.4"/>
  <path d="M884,124 A44,8 0 0 0 972,124" fill="none" stroke="#3E5CD9" stroke-width="1.4"/>
  <text x="928" y="149" font-size="15" fill="#1B1A18" text-anchor="middle">identity</text>
  <text x="928" y="166" font-size="15" fill="#1B1A18" text-anchor="middle">DB</text>

  <!-- ===== commerce-svc ===== -->
  <rect x="757" y="344" width="231" height="128" fill="url(#lvOrange)" stroke="#E8402A" stroke-width="1.6"/>
  <g fill="#FFFFFF" stroke="#E8402A" stroke-width="1"><rect x="969" y="350" width="11" height="14"/><rect x="966" y="353" width="6" height="3"/><rect x="966" y="359" width="6" height="3"/></g>
  <text x="866" y="367" font-size="15" fill="#6B655C" text-anchor="middle">«component»</text>
  <text x="866" y="390" font-size="18" font-weight="700" fill="#B02E1B" text-anchor="middle">commerce-svc</text>
  <text x="834" y="416" font-size="15" fill="#1B1A18" text-anchor="middle">catalog · groupbuy</text>
  <text x="834" y="436" font-size="15" fill="#1B1A18" text-anchor="middle">order · payment</text>
  <text x="834" y="456" font-size="15" fill="#1B1A18" text-anchor="middle">+ outbox relay</text>
  <path d="M914,406 A33,7 0 0 1 980,406 V452 A33,7 0 0 1 914,452 Z" fill="#FFFFFF" stroke="#E8402A" stroke-width="1.4"/>
  <path d="M914,406 A33,7 0 0 0 980,406" fill="none" stroke="#E8402A" stroke-width="1.4"/>
  <text x="947" y="431" font-size="15" fill="#1B1A18" text-anchor="middle">commerce</text>
  <text x="947" y="448" font-size="15" fill="#1B1A18" text-anchor="middle">DB</text>

  <!-- ===== Event bus ===== -->
  <polygon points="440,300 450,290 730,290 720,300" fill="#FFEDC7" stroke="#7A5C20" stroke-width="1.5"/>
  <polygon points="720,300 730,290 730,456 720,466" fill="#FFEDC7" stroke="#7A5C20" stroke-width="1.5"/>
  <rect x="440" y="300" width="280" height="166" fill="url(#lvYellow)" stroke="#7A5C20" stroke-width="1.5"/>
  <text x="600" y="322" font-size="18" font-weight="700" fill="#1B1A18" text-anchor="middle">Event bus</text>
  <rect x="452" y="330" width="150" height="56" fill="#FFFFFF" stroke="#7A5C20" stroke-width="1.4"/>
  <text x="527" y="351" font-size="15" fill="#6B655C" text-anchor="middle">«queue»</text>
  <text x="527" y="374" font-size="16" fill="#1B1A18" text-anchor="middle">notification + DLQ</text>
  <rect x="452" y="398" width="150" height="56" fill="#FFFFFF" stroke="#7A5C20" stroke-width="1.4"/>
  <text x="527" y="419" font-size="15" fill="#6B655C" text-anchor="middle">«queue»</text>
  <text x="527" y="442" font-size="16" fill="#1B1A18" text-anchor="middle">audit + DLQ</text>
  <rect x="630" y="352" width="80" height="80" fill="#FFFFFF" stroke="#7A5C20" stroke-width="1.4"/>
  <text x="670" y="384" font-size="15" fill="#6B655C" text-anchor="middle">«topic»</text>
  <text x="670" y="408" font-size="17" font-weight="700" fill="#1B1A18" text-anchor="middle">SNS</text>
  <text x="590" y="492" font-size="15" fill="#6B655C" text-anchor="middle">TeamSucceededV1 · TeamExpiredV1 · PaymentSucceededV1</text>

  <!-- ===== Valkey session store ===== -->
  <polygon points="590,230 600,220 900,220 890,230" fill="#EFE9DF" stroke="#6B655C" stroke-width="1.5"/>
  <polygon points="890,230 900,220 900,272 890,282" fill="#DDD5C8" stroke="#6B655C" stroke-width="1.5"/>
  <rect x="590" y="230" width="300" height="52" fill="url(#lvSlate)" stroke="#6B655C" stroke-width="1.5"/>
  <text x="740" y="250" font-size="15" fill="#6B655C" text-anchor="middle">«node»</text>
  <text x="740" y="272" font-size="16" fill="#1B1A18" text-anchor="middle">Valkey: shared Sa-Token session</text>

  <!-- ===== Externals ===== -->
  <rect x="1028" y="82" width="130" height="62" fill="url(#lvGrey)" stroke="#6B655C" stroke-width="1.5"/>
  <text x="1093" y="104" font-size="15" fill="#6B655C" text-anchor="middle">«external»</text>
  <text x="1093" y="128" font-size="18" font-weight="700" fill="#1B1A18" text-anchor="middle">Google OAuth</text>
  <rect x="1028" y="362" width="130" height="100" fill="url(#lvGrey)" stroke="#6B655C" stroke-width="1.5"/>
  <text x="1093" y="384" font-size="15" fill="#6B655C" text-anchor="middle">«external»</text>
  <text x="1093" y="408" font-size="18" font-weight="700" fill="#1B1A18" text-anchor="middle">Stripe</text>
  <text x="1093" y="432" font-size="15" fill="#1B1A18" text-anchor="middle">checkout,</text><text x="1093" y="451" font-size="15" fill="#1B1A18" text-anchor="middle">webhooks</text>

  <!-- ===== Connectors: synchronous (filled heads) ===== -->
  <g stroke="#1B1A18" stroke-width="1.5" fill="none">
    <line x1="62" y1="186" x2="104" y2="214"/>
    <line x1="68" y1="312" x2="104" y2="266"/>
    <line x1="222" y1="240" x2="248" y2="240" marker-end="url(#lvFill)"/>
    <line x1="400" y1="152" x2="450" y2="152" marker-end="url(#lvFill)"/>
    <path d="M325,72 V8 H857 V56" marker-end="url(#lvFill)"/>
    <path d="M325,382 V508 H866 V474" marker-end="url(#lvFill)"/>
    <line x1="988" y1="113" x2="1026" y2="113" marker-end="url(#lvFill)"/>
    <line x1="988" y1="408" x2="1026" y2="408" marker-end="url(#lvFill)"/>
  </g>
  <!-- the one synchronous service-to-service call -->
  <line x1="968" y1="344" x2="968" y2="189" stroke="#E8402A" stroke-width="2.2" marker-end="url(#lvFillRed)"/>
  <!-- ===== Connectors: asynchronous (open heads) ===== -->
  <g stroke="#1B1A18" stroke-width="1.5" fill="none">
    <line x1="757" y1="392" x2="733" y2="392" marker-end="url(#lvOpen)"/>
    <line x1="630" y1="372" x2="604" y2="358" marker-end="url(#lvOpen)"/>
    <line x1="630" y1="412" x2="604" y2="426" marker-end="url(#lvOpen)"/>
    <line x1="527" y1="330" x2="527" y2="189" marker-end="url(#lvOpen)"/>
  </g>
  <!-- ===== session «use» dependencies (dashed) ===== -->
  <g stroke="#1B1A18" stroke-width="1.4" fill="none" stroke-dasharray="6 4">
    <line x1="660" y1="186" x2="660" y2="217" marker-end="url(#lvOpen)"/>
    <line x1="820" y1="186" x2="820" y2="217" marker-end="url(#lvOpen)"/>
    <line x1="820" y1="344" x2="820" y2="285" marker-end="url(#lvOpen)"/>
  </g>

  <!-- ===== Connector labels ===== -->
  <rect x="490" y="246" width="74" height="22" fill="#FFFFFF"/>
  <text x="527" y="263" font-size="15" fill="#1B1A18" text-anchor="middle">long-poll</text>
  <text x="980" y="232" font-size="16" font-weight="700" fill="#B02E1B">is this user active?</text>
  <text x="980" y="254" font-size="15" fill="#1B1A18">500 ms / 1.5 s</text>
  <text x="980" y="274" font-size="15" fill="#1B1A18">fails closed</text>
  <text x="980" y="296" font-size="15" fill="#B02E1B">the only direct call</text>
</svg>
