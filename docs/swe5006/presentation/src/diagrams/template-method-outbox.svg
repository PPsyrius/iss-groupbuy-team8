<text x="34.0" y="396.0" font-size="24" fill="#1B1A18">publish() is final (the template):</text>
<text x="34.0" y="426.0" font-size="24" fill="#1B1A18">for each batch of 10 while the lease holds:</text>
<text x="34.0" y="456.0" font-size="24" fill="#1B1A18">   entries += entry(event)    ← step 1</text>
<text x="34.0" y="486.0" font-size="24" fill="#1B1A18">   if the lease still holds:</text>
<text x="34.0" y="516.0" font-size="24" fill="#1B1A18">      send(batch, entries)    ← step 2</text>
<text x="34.0" y="546.0" font-size="24" fill="#1B1A18">a bad row fails alone; a provider error</text>
<text x="34.0" y="576.0" font-size="24" fill="#1B1A18">fails only its batch; rows never tried</text>
<text x="34.0" y="606.0" font-size="24" fill="#1B1A18">return skipped.</text>
<line x1="560.0" y1="434.0" x2="600.0" y2="434.0" stroke="#1B1A18" stroke-width="1.4" stroke-dasharray="6 4"/>
