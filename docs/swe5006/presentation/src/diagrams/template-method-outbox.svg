<text x="614.0" y="486.0" font-size="24" fill="#1B1A18">+publish(events: List&lt;OutboxEvent&gt;,</text>
<text x="654.2" y="518.0" font-size="24" fill="#1B1A18">leaseValid: BooleanSupplier)</text>
<text x="654.2" y="550.0" font-size="24" fill="#1B1A18">: List&lt;OutboxPublishResult&gt; {leaf}</text>
<text x="614.0" y="582.0" font-size="24" fill="#1B1A18">-publishBatch(events, entries, results)</text>
<text x="614.0" y="614.0" font-size="24" font-style="italic" fill="#1B1A18">#entry(event: OutboxEvent): E</text>
<text x="614.0" y="646.0" font-size="24" font-style="italic" fill="#1B1A18">#send(events: List&lt;OutboxEvent&gt;,</text>
<text x="654.2" y="678.0" font-size="24" font-style="italic" fill="#1B1A18">entries: List&lt;E&gt;)</text>
<text x="654.2" y="710.0" font-size="24" font-style="italic" fill="#1B1A18">: List&lt;OutboxPublishResult&gt;</text>
