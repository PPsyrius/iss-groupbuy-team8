<svg xmlns="http://www.w3.org/2000/svg" width="2320" height="548" viewBox="0 0 2320 548" font-family="Inter, Helvetica, Arial, sans-serif">
<title>stm GroupDeal (team) lifecycle</title>
<desc>UML state machine of a team (GroupDeal): created OPEN by a confirmed paid start (UC3); paid joins are internal transitions (UC4); the last-seat join moves to SUCCEEDED (UC4 to UC5); the time event at(expireTime), detected by the expiry sweep, moves to EXPIRED (UC5 to UC6); FAILED and CANCELED are declared but never written.</desc>
<defs><marker id="tscFill" viewBox="0 0 14 12" refX="13" refY="6" markerWidth="14" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 Z" fill="#1B1A18"/></marker><marker id="tscFillR" viewBox="0 0 14 12" refX="13" refY="6" markerWidth="14" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L14,6 L0,12 Z" fill="#E8402A"/></marker><marker id="tscOpen" viewBox="0 0 14 12" refX="13" refY="6" markerWidth="14" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L13,6 L1,11" fill="none" stroke="#1B1A18" stroke-width="1.6"/></marker><marker id="tscOpenR" viewBox="0 0 14 12" refX="13" refY="6" markerWidth="14" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L13,6 L1,11" fill="none" stroke="#E8402A" stroke-width="1.8"/></marker><marker id="tscTri" viewBox="0 0 20 18" refX="19" refY="9" markerWidth="20" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L19,9 L1,17 Z" fill="#FFFFFF" stroke="#1B1A18" stroke-width="1.6"/></marker><marker id="tscDia" viewBox="0 0 24 14" refX="23" refY="7" markerWidth="24" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,7 L12,1 L23,7 L12,13 Z" fill="#1B1A18" stroke="#1B1A18" stroke-width="1"/></marker><marker id="tscODia" viewBox="0 0 24 14" refX="23" refY="7" markerWidth="24" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,7 L12,1 L23,7 L12,13 Z" fill="#FFFFFF" stroke="#1B1A18" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="2320" height="548" fill="#FFFFFF" stroke="none"/><rect x="4" y="4" width="2312" height="540" fill="#FFFFFF" stroke="#6B655C" stroke-width="1.4"/><path d="M4 4 H425.6 V30 L413.6 44 H4 Z" fill="#FFFFFF" stroke="#6B655C" stroke-width="1.4"/><text x="14" y="33" font-size="26" font-weight="bold" fill="#1B1A18">stm GroupDeal (team) lifecycle</text><circle cx="44" cy="250" r="13" fill="#1B1A18"/><line x1="57" y1="250" x2="526" y2="250" stroke="#1B1A18" stroke-width="1.6" marker-end="url(#tscFill)"/><text x="70" y="144" font-size="24" fill="#1B1A18">paidStartConfirmed(terms, paid)</text><text x="70" y="176" font-size="24" fill="#1B1A18">[amount = price ∧ now &lt; expireTime]</text><text x="70" y="208" font-size="24" fill="#1B1A18">/ currentSize := 1; leader := payer;</text><text x="70" y="240" font-size="24" fill="#1B1A18">  startTime := now</text><rect x="70" y="265" width="66.8" height="34" rx="4" fill="#FFFFFF" stroke="#3E5CD9" stroke-width="1.6"/><text x="103.4" y="290" font-size="24" text-anchor="middle" font-weight="bold" fill="#3E5CD9">UC3</text><rect x="30" y="360" width="200" height="60" rx="22" fill="#FFFFFF" stroke="#9A938A" stroke-width="1.6" stroke-dasharray="8 6" data-box="FAILED"/><text x="130" y="394" font-size="26" text-anchor="middle" font-weight="bold" fill="#9A938A">FAILED</text><rect x="260" y="360" width="230" height="60" rx="22" fill="#FFFFFF" stroke="#9A938A" stroke-width="1.6" stroke-dasharray="8 6" data-box="CANCELED"/><text x="375" y="394" font-size="26" text-anchor="middle" font-weight="bold" fill="#9A938A">CANCELED</text><text x="30" y="462" font-size="24" fill="#6B655C">declared in DealStatus and allowed by</text><text x="30" y="494" font-size="24" fill="#6B655C">canTransitionTo, but never written</text><rect x="526" y="64" width="610" height="464" rx="22" fill="#FFFFFF" stroke="#1B1A18" stroke-width="2" data-box="OPEN"/><text x="831" y="98" font-size="26" text-anchor="middle" font-weight="bold" fill="#1B1A18">OPEN</text><line x1="526" y1="112" x2="1136" y2="112" stroke="#1B1A18" stroke-width="1.4"/><text x="542" y="144" font-size="24" fill="#1B1A18">paidJoinConfirmed(paid)</text><text x="542" y="176" font-size="24" fill="#1B1A18">  [admissible ∧ currentSize + 1 &lt; targetSize]</text><text x="542" y="208" font-size="24" fill="#1B1A18">  / currentSize := currentSize + 1;</text><text x="542" y="240" font-size="24" fill="#1B1A18">    publish MemberJoined</text><text x="542" y="272" font-size="24" fill="#1B1A18">paidJoinConfirmed(paid) [else]</text><text x="542" y="304" font-size="24" fill="#1B1A18">  / compensation_required → refund owed</text><rect x="1054" y="215" width="67.6" height="34" rx="4" fill="#FFFFFF" stroke="#3E5CD9" stroke-width="1.6"/><text x="1087.8" y="240" font-size="24" text-anchor="middle" font-weight="bold" fill="#3E5CD9">UC4</text><rect x="954" y="247" width="152.7" height="34" rx="4" fill="#FFFFFF" stroke="#3E5CD9" stroke-width="1.6"/><text x="1030.4" y="272" font-size="24" text-anchor="middle" font-weight="bold" fill="#3E5CD9">UC4 → UC6</text><path d="M540 334 H1104 L1122 352 V510 H540 Z" fill="#FFFFFF" stroke="#6B655C" stroke-width="1.4"/><path d="M1104 334 V352 H1122" fill="none" stroke="#6B655C" stroke-width="1.4"/><text x="554" y="366" font-size="24" fill="#1B1A18">admissible ≡ startTime ≤ now &lt; expireTime</text><text x="554" y="398" font-size="24" fill="#1B1A18">∧ buyer not leader or member ∧ amount = price</text><text x="554" y="430" font-size="24" fill="#1B1A18">(now read after the FOR UPDATE row lock)</text><text x="554" y="462" font-size="24" fill="#1B1A18">last join vs expiry: first lock wins, the</text><text x="554" y="494" font-size="24" fill="#1B1A18">other sees DEAL_CLOSED</text><rect x="1830" y="64" width="466" height="186" rx="22" fill="#FFFFFF" stroke="#1B1A18" stroke-width="2" data-box="SUCCEEDED"/><text x="2063" y="98" font-size="26" text-anchor="middle" font-weight="bold" fill="#1B1A18">SUCCEEDED</text><line x1="1830" y1="112" x2="2296" y2="112" stroke="#1B1A18" stroke-width="1.4"/><text x="1846" y="144" font-size="24" fill="#1B1A18">entry / confirm orders (UC5)</text><text x="1846" y="176" font-size="24" fill="#1B1A18">paidJoinConfirmed(paid)</text><text x="1846" y="208" font-size="24" fill="#1B1A18">  / compensation_required</text><rect x="1830" y="330" width="466" height="190" rx="22" fill="#FFFFFF" stroke="#1B1A18" stroke-width="2" data-box="EXPIRED"/><text x="2063" y="364" font-size="26" text-anchor="middle" font-weight="bold" fill="#1B1A18">EXPIRED</text><line x1="1830" y1="378" x2="2296" y2="378" stroke="#1B1A18" stroke-width="1.4"/><text x="1846" y="410" font-size="24" fill="#1B1A18">entry / cancel orders; refunds owed</text><text x="1846" y="442" font-size="24" fill="#1B1A18">paidJoinConfirmed(paid)</text><text x="1846" y="474" font-size="24" fill="#1B1A18">  / compensation_required</text><line x1="1136" y1="118" x2="1830" y2="118" stroke="#E8402A" stroke-width="2.6" marker-end="url(#tscFillR)"/><text x="1168" y="154" font-size="24" fill="#B02E1B">paidJoinConfirmed(paid)</text><text x="1168" y="186" font-size="24" fill="#B02E1B">[admissible ∧</text><text x="1168" y="218" font-size="24" fill="#B02E1B"> currentSize + 1 = targetSize]</text><text x="1168" y="250" font-size="24" fill="#B02E1B">/ successTime := now; publish</text><text x="1168" y="282" font-size="24" fill="#B02E1B">  MemberJoined, TeamSucceeded</text><rect x="1168" y="79" width="152.1" height="34" rx="4" fill="#FFFFFF" stroke="#3E5CD9" stroke-width="1.6"/><text x="1244" y="104" font-size="24" text-anchor="middle" font-weight="bold" fill="#3E5CD9">UC4 → UC5</text><line x1="1136" y1="470" x2="1830" y2="470" stroke="#1B1A18" stroke-width="1.6" marker-end="url(#tscFill)"/><text x="1168" y="348" font-size="24" fill="#1B1A18">at(expireTime)</text><text x="1168" y="380" font-size="24" fill="#1B1A18">/ status-guarded UPDATE;</text><text x="1168" y="412" font-size="24" fill="#1B1A18">  publish TeamExpired</text><text x="1168" y="444" font-size="24" fill="#6B655C">detected by TeamExpirySweepJob (PT1M)</text><rect x="1168" y="485" width="151.4" height="34" rx="4" fill="#FFFFFF" stroke="#3E5CD9" stroke-width="1.6"/><text x="1243.7" y="510" font-size="24" text-anchor="middle" font-weight="bold" fill="#3E5CD9">UC5 → UC6</text>
</svg>
