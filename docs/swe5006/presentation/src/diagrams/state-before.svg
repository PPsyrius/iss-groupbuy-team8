<line x1="660.0" y1="662.0" x2="660.0" y2="1106.0" stroke="#1B1A18" stroke-width="1.4" stroke-dasharray="7 5"/>
<rect x="980.3" y="616.0" width="139.3" height="46.0" fill="#FFFFFF" stroke="#1B1A18" stroke-width="1.6"/>
<text x="1050.0" y="650.0" font-size="26" font-weight="700" text-anchor="middle" fill="#1B1A18">:Product</text>
<line x1="1050.0" y1="662.0" x2="1050.0" y2="1106.0" stroke="#1B1A18" stroke-width="1.4" stroke-dasharray="7 5"/>
<rect x="212.0" y="702.0" width="16.0" height="390.0" fill="#FFFFFF" stroke="#1B1A18" stroke-width="1.4"/>
<circle cx="10" cy="702" r="6" fill="#1B1A18"/>
<line x1="10.0" y1="702.0" x2="212.0" y2="702.0" stroke="#1B1A18" stroke-width="1.6" marker-end="url(#sbFill)"/>
<text x="22.0" y="693.0" font-size="24" fill="#1B1A18">PUT …/status</text>
<rect x="652.0" y="764.0" width="16.0" height="328.0" fill="#FFFFFF" stroke="#1B1A18" stroke-width="1.4"/>
<line x1="228.0" y1="764.0" x2="652.0" y2="764.0" stroke="#1B1A18" stroke-width="1.6" marker-end="url(#sbFill)"/>
<text x="440.0" y="725.0" font-size="24" text-anchor="middle" fill="#1B1A18">changeStatus(id, ON_SALE,</text>
<text x="440.0" y="755.0" font-size="24" text-anchor="middle" fill="#1B1A18">expectedVersion, actorId)</text>
<rect x="1042.0" y="804.0" width="16.0" height="258.0" fill="#FFFFFF" stroke="#1B1A18" stroke-width="1.4"/>
<line x1="668.0" y1="804.0" x2="1042.0" y2="804.0" stroke="#1B1A18" stroke-width="1.6" marker-end="url(#sbFill)"/>
<text x="855.0" y="795.0" font-size="24" text-anchor="middle" fill="#1B1A18">publish(): Product</text>
<path d="M1058,826 H1098 V846 H1062" fill="none" stroke="#1B1A18" stroke-width="1.6" marker-end="url(#sbFill)"/>
<text x="1032.0" y="834.0" font-size="24" text-anchor="end" fill="#1B1A18">switch (status)</text>
