<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1120" viewBox="0 0 1160 1120" font-family="Inter, Helvetica, Arial, sans-serif">
<!-- UC9 listing lifecycle before State: brute-force status switches -->
<rect x="0" y="0" width="1160" height="1120" fill="#FFFFFF"/>
<defs><marker id="sbFill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B1A18"/></marker><marker id="sbFillRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8402A"/></marker><marker id="sbOpen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#1B1A18" stroke-width="1.6"/></marker><marker id="sbTri" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L15,8 L1,15 z" fill="#FFFFFF" stroke="#1B1A18" stroke-width="1.4"/></marker></defs>
<text x="20.0" y="36.0" font-size="26" font-weight="700" fill="#1B1A18">Before (brute force): a status switch in every operation</text>
<rect x="20.0" y="70.0" width="520.0" height="262.0" fill="#FFFFFF" stroke="#1B1A18" stroke-width="1.6"/>
<text x="280.0" y="106.0" font-size="26" font-weight="700" text-anchor="middle" fill="#1B1A18">Product</text>
<line x1="20.0" y1="116.0" x2="540.0" y2="116.0" stroke="#1B1A18" stroke-width="1.6"/>
<text x="34.0" y="148.0" font-size="24" fill="#1B1A18">-status: ProductStatus</text>
<text x="34.0" y="180.0" font-size="24" fill="#1B1A18">-version: int</text>
<line x1="20.0" y1="192.0" x2="540.0" y2="192.0" stroke="#1B1A18" stroke-width="1.6"/>
<text x="34.0" y="224.0" font-size="24" fill="#1B1A18">+publish(): Product</text>
<text x="34.0" y="256.0" font-size="24" fill="#1B1A18">+delist(): Product</text>
<text x="34.0" y="288.0" font-size="24" fill="#1B1A18">+revise(details): Product</text>
<text x="34.0" y="320.0" font-size="24" fill="#1B1A18">+requireDeletable(): void</text>
<rect x="20.0" y="386.0" width="520.0" height="120.0" fill="#FFFFFF" stroke="#1B1A18" stroke-width="1.6"/>
<text x="280.0" y="418.0" font-size="24" text-anchor="middle" fill="#1B1A18">«enumeration»</text>
<text x="280.0" y="452.0" font-size="26" font-weight="700" text-anchor="middle" fill="#1B1A18">ProductStatus</text>
<line x1="20.0" y1="462.0" x2="540.0" y2="462.0" stroke="#1B1A18" stroke-width="1.6"/>
<text x="34.0" y="494.0" font-size="24" fill="#1B1A18">DRAFT, ON_SALE, OFF_SALE</text>
<line x1="280.0" y1="332.0" x2="280.0" y2="386.0" stroke="#1B1A18" stroke-width="1.6" marker-end="url(#sbOpen)"/>
<text x="296.0" y="366.0" font-size="24" fill="#1B1A18">-status  1</text>
<path d="M590,70 H1122 L1140,88 V450 H590 Z" fill="#FFFFFF" stroke="#E8402A" stroke-width="2.2"/>
<path d="M1122,70 V88 H1140" fill="none" stroke="#E8402A" stroke-width="2.2"/>
<text x="604.0" y="102.0" font-size="24" font-weight="700" fill="#1B1A18">Same switch, repeated 4 times</text>
<text x="604.0" y="132.0" font-size="24" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#1B1A18">publish(): switch (status)</text>
<text x="604.0" y="162.0" font-size="24" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#1B1A18">  DRAFT, OFF_SALE → ON_SALE</text>
<text x="604.0" y="192.0" font-size="24" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#1B1A18">  ON_SALE → throw 409</text>
<text x="604.0" y="222.0" font-size="24" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#1B1A18">delist(): switch (status)</text>
<text x="604.0" y="252.0" font-size="24" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#1B1A18">  ON_SALE → OFF_SALE</text>
<text x="604.0" y="282.0" font-size="24" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#1B1A18">  DRAFT, OFF_SALE → throw 409</text>
<text x="604.0" y="312.0" font-size="24" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#1B1A18">requireDeletable(): switch</text>
<text x="604.0" y="342.0" font-size="24" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#1B1A18">  DRAFT → ok, else throw 409</text>
<text x="604.0" y="372.0" font-size="24" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#1B1A18">revise(d): switch (status)</text>
<text x="604.0" y="402.0" font-size="24" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#1B1A18">  DRAFT → every field editable</text>
<text x="604.0" y="432.0" font-size="24" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#1B1A18">  else 409 if price/stock/currency</text>
<line x1="590.0" y1="250.0" x2="540.0" y2="250.0" stroke="#1B1A18" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="20.0" y="536.0" font-size="24" fill="#1B1A18">Problem: each operation repeats the status test; a new state edits all four.</text>
