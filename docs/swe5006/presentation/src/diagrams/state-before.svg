<text x="855.0" y="903.0" font-size="24" text-anchor="middle" fill="#1B1A18">Product(ON_SALE, v+1)</text>
<line x1="1042.0" y1="982.0" x2="668.0" y2="982.0" stroke="#1B1A18" stroke-width="1.6" stroke-dasharray="8 6" marker-end="url(#sbOpen)"/>
<text x="855.0" y="973.0" font-size="24" text-anchor="middle" fill="#1B1A18">Product(ON_SALE, v+1)</text>
<line x1="1042.0" y1="1062.0" x2="668.0" y2="1062.0" stroke="#1B1A18" stroke-width="1.6" stroke-dasharray="8 6" marker-end="url(#sbOpen)"/>
<text x="672.0" y="1023.0" font-size="24" fill="#1B1A18">throw BizException(</text>
