<text x="34.0" y="694.0" font-size="24" font-weight="700" fill="#1B1A18">Implementation (ProductStatus.java, Product.java)</text>
<text x="34.0" y="724.0" font-size="24" fill="#1B1A18">Each constant body compiles to an anonymous final subclass</text>
<text x="34.0" y="754.0" font-size="24" fill="#1B1A18">(ProductStatus$1, $2, $3) that overrides the State operations.</text>
<text x="34.0" y="784.0" font-size="24" fill="#1B1A18">Inherited defaults: publish(), delist() throw PRODUCT_STATE_CONFLICT (409).</text>
<text x="34.0" y="814.0" font-size="24" fill="#1B1A18">Product.publish(): stock &gt; 0 and price &gt; 0, then transition(status.publish()).</text>
