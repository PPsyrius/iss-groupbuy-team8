admin:
  address:
    socket_address: {address: 127.0.0.1, port_value: 9901}
static_resources:
  listeners:
    - name: local_catalogue
      address:
        socket_address: {address: 0.0.0.0, port_value: 8588}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: local_catalogue
                route_config:
                  name: local_only
                  virtual_hosts:
                    - name: commerce
                      domains: ['*']
                      routes:
                        - match: {prefix: /api/}
                          route: {cluster: commerce, timeout: 15s}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: commerce
      type: STATIC
      connect_timeout: 1s
      load_assignment:
        cluster_name: commerce
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: 127.0.0.1, port_value: 8589}
