<svg id="dawscostbreakdown" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="-199.515625 0 1026.90625 450" style="max-width: 1026.90625px;" role="graphics-document document" aria-roledescription="pie"><style>#dawscostbreakdown{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#dawscostbreakdown .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#dawscostbreakdown .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#dawscostbreakdown .error-icon{fill:#552222;}#dawscostbreakdown .error-text{fill:#552222;stroke:#552222;}#dawscostbreakdown .edge-thickness-normal{stroke-width:1px;}#dawscostbreakdown .edge-thickness-thick{stroke-width:3.5px;}#dawscostbreakdown .edge-pattern-solid{stroke-dasharray:0;}#dawscostbreakdown .edge-thickness-invisible{stroke-width:0;fill:none;}#dawscostbreakdown .edge-pattern-dashed{stroke-dasharray:3;}#dawscostbreakdown .edge-pattern-dotted{stroke-dasharray:2;}#dawscostbreakdown .marker{fill:#333333;stroke:#333333;}#dawscostbreakdown .marker.cross{stroke:#333333;}#dawscostbreakdown svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#dawscostbreakdown p{margin:0;}#dawscostbreakdown .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#dawscostbreakdown .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#dawscostbreakdown .pieTitleText{text-anchor:middle;font-size:25px;fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;}#dawscostbreakdown .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;font-size:17px;}#dawscostbreakdown .legend text{fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#dawscostbreakdown .node .neo-node{stroke:#9370DB;}#dawscostbreakdown [data-look="neo"].node rect,#dawscostbreakdown [data-look="neo"].cluster rect,#dawscostbreakdown [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#dawscostbreakdown [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#dawscostbreakdown [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#dawscostbreakdown [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#dawscostbreakdown [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#dawscostbreakdown [data-look="neo"].node circle .state-start{fill:#000000;}#dawscostbreakdown [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#dawscostbreakdown [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#dawscostbreakdown :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(225,225)"><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,0,1,149.842,108.501L0,0Z" fill="#ECECFF" class="pieCircle"></path><path d="M149.842,108.501A185,185,0,0,1,-139.555,121.447L0,0Z" fill="#ffffde" class="pieCircle"></path><path d="M-139.555,121.447A185,185,0,0,1,-125.305,-136.101L0,0Z" fill="hsl(80, 100%, 56.2745098039%)" class="pieCircle"></path><path d="M-125.305,-136.101A185,185,0,0,1,-50.2,-178.059L0,0Z" fill="hsl(240, 100%, 86.2745098039%)" class="pieCircle"></path><path d="M-50.2,-178.059A185,185,0,0,1,0,-185L0,0Z" fill="hsl(60, 100%, 63.5294117647%)" class="pieCircle"></path><text transform="translate(123.57673386243665,-63.09004159051175)" class="slice" style="text-anchor: middle;">35%</text><text transform="translate(6.200672961156095,138.61137815788715)" class="slice" style="text-anchor: middle;">29%</text><text transform="translate(-138.5381020882735,-7.665296457352963)" class="slice" style="tex