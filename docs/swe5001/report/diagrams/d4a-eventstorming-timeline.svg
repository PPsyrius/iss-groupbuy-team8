<text x="650.0" y="209" text-anchor="middle" class="h2" style="fill:#1F2328">TeamExpired</text>
<text x="650.0" y="226" text-anchor="middle" class="small" style="fill:#1F2328">TeamExpirySweepJob (60s)</text>
<text x="650.0" y="241" text-anchor="middle" class="small" style="fill:#5E2200">Status: OPEN 鈫?EXPIRED</text>
<rect x="755" y="190" width="175" height="66" fill="#E2D5F8" stroke="#6E3CBC" stroke-width="1.4" rx="4"/>
<text x="842.5" y="209" text-anchor="middle" class="h2" style="fill:#1F2328">BEFORE_COMMIT (@Order)</text>
<text x="842.5" y="226" text-anchor="middle" class="small" style="fill:#1F2328">10: Cancel 路 20: Record Refund</text>
<text x="842.5" y="241" text-anchor="middle" class="small" style="fill:#5628A0">LOWEST: Outbox V1 Row</text>
<line x1="740" y1="223" x2="755" y2="223" stroke="#2F363D" stroke-width="1.3" marker-end="url(#arrow-solid)"/>
<rect x="560" y="280" width="370" height="68" fill="#FFD8B5" stroke="#BC4C00" stroke-width="1.4" rx="4"/>
<text x="745.0" y="299" text-anchor="middle" class="h2" style="fill:#1F2328">OrdersConfirmed / Cancelled + RefundObligation</text>
<text x="745.0" y="316" text-anchor="middle" class="small" style="fill:#1F2328">+ sys_outbox: TeamSucceededV1 / TeamExpiredV1 / PaymentSucceededV1</text>
<text x="745.0" y="331" text-anchor="middle" class="small" style="fill:#8A3600">(Enriched with recipientUserIds inside the same transaction)</text>
<line x1="842" y1="256" x2="842" y2="280" stroke="#2F363D" stroke-width="1.3" marker-end="url(#arrow-solid)"/>
<polyline points="930,135 938,135 938,268 842,268" fill="none" stroke="#2F363D" stroke-width="1.3"/>
<rect x="560" y="368" width="370" height="96" fill="#FFCCD7" stroke="#A40E26" stroke-width="1.6" rx="4"/>
<text x="745.0" y="387" text-anchor="middle" class="h2" style="fill:#860B30">HS-4 Sweeper vs Webhook Race on Expiring Team</text>
<text x="745.0" y="404" text-anchor="middle" class="small" style="fill:#1F2328">Both acquire SELECT ... FOR UPDATE on GroupDeal first;</text>
<text x="745.0" y="419" text-anchor="middle" class="small" style="fill:#1F2328">status-guarded transition makes the second caller a safe no-op</text>
<text x="745.0" y="434" text-anchor="middle" class="small" style="fill:#860B30">preventing double-settlement or orphan refunds</text>
<rect x="985" y="102" width="300" height="66" fill="#FFF8C5" stroke="#9A6700" stroke-width="1.4" rx="4"/>
<text x="1135.0" y="121" text-anchor="middle" class="h2" style="fill:#1F2328">RefundWorkerJob 鈫?RefundWork</text>
<text x="1135.0" y="138" text-anchor="middle" class="small" style="fill:#1F2328">Claims pending biz_refund outside DB txn</text>
<text x="1135.0" y="153" text-anchor="middle" class="small" style="fill:#9E2A6B">Calls Stripe Refunds API (idempotency key)</text>
<polyline points="930,305 958,305 958,135 985,135" fill="none" stroke="#2F363D" stroke-width="1.3" marker-end="url(#arrow-solid)"/>
<rect x="985" y="190" width="300" height="66" fill="#FFD8B5" stroke="#BC4C00" stroke-width="1.4" rx="4"/>
<text x="1135.0" y="209" text-anchor="middle" class="h2" style="fill:#1F2328">RefundSucceeded / RetryDue / Review</text>
<text x="1135.0" y="226" text-anchor="middle" class="small" style="fill:#1F2328">Exponential backoff up to 5 attempts;</text>
<text x="1135.0" y="241" text-anchor="middle" class="small" style="fill:#8A3600">23h Stripe idempotency window guard (HS-6)</text>
<line x1="1135" y1="168" x2="1135" y2="190" stroke="#2F363D" stroke-width="1.3" marker-end="url(#arrow-solid)"/>
<rect x="985" y="280" width="300" height="184" fill="#E2D5F8" stroke="#6E3CBC" stroke-width="1.4" rx="4"/>
<text x="1135.0" y="299" text-anchor="middle" class="h2" style="fill:#1F2328">Async Cross-Service Choreography</text>
<text x="1135.0" y="316" text-anchor="middle" class="small" style="fill:#1F2328">1. OutboxRelayJob (leased, batches of 10)</text>
<text x="1135.0" y="331" text-anchor="middle" class="small" style="fill:#1F2328">2. SNS Topic fan-out by eventType filter</text>
<text x="1135.0" y="346" text-anchor="middle" class="small" style="fill:#1F2328">3. SQS notification &amp; audit</text>
<text x="1135.0" y="361" text-anchor="middle" class="small" style="fill:#1F2328">4. notification-svc: sys_consumed_message</text>
<text x="1135.0" y="376" text-anchor="middle" class="small" style="fill:#1F2328">   dedup + insert biz_notification in 1 txn</text>
<text x="1135.0" y="391" text-anchor="middle" class="small" style="fill:#5628A0">5. Zero callbacks to commerce-svc / identity-svc</text>
<line x1="930" y1="325" x2="985" y2="325" stroke="#6E3CBC" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-purple)"/>
