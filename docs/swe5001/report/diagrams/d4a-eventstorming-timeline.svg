<text x="147.5" y="387" text-anchor="middle" class="h2" style="fill:#860B30">HS-1 Last-Slot &amp; HS-2 Replay</text>
<text x="147.5" y="404" text-anchor="middle" class="small" style="fill:#1F2328">Row lock on GroupDeal + webhook</text>
<text x="147.5" y="419" text-anchor="middle" class="small" style="fill:#1F2328">event claim &amp; unique payment index</text>
<text x="147.5" y="434" text-anchor="middle" class="small" style="fill:#860B30">prevent over-admission &amp; replay</text>
<rect x="275" y="368" width="230" height="96" fill="#FFCCD7" stroke="#A40E26" stroke-width="1.6" rx="4"/>
<text x="390.0" y="387" text-anchor="middle" class="h2" style="fill:#860B30">HS-8 Shared Settlement Txn</text>
<text x="390.0" y="404" text-anchor="middle" class="small" style="fill:#1F2328">Payment, Order, Stock &amp; Team</text>
<text x="390.0" y="419" text-anchor="middle" class="small" style="fill:#1F2328">must commit or roll back together</text>
<text x="390.0" y="434" text-anchor="middle" class="small" style="fill:#860B30">inside commerce-svc PostgreSQL</text>
<rect x="560" y="102" width="180" height="66" fill="#FFB77C" stroke="#7A2E00" stroke-width="2.4" rx="4"/>
<text x="650.0" y="121" text-anchor="middle" class="h2" style="fill:#1F2328">TeamSucceeded</text>
<text x="650.0" y="138" text-anchor="middle" class="small" style="fill:#1F2328">Quota filled (current == target)</text>
<text x="650.0" y="153" text-anchor="middle" class="small" style="fill:#5E2200">Status: OPEN 鈫?SUCCEEDED</text>
