<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 390" width="1160" height="390" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="esArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B1A18"/></marker>
    <marker id="esOpen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#6A1B9A" stroke-width="1.6"/></marker>
  </defs>
  <rect x="0" y="0" width="1160" height="390" fill="#FFFFFF"/>

  <!-- Legend bar -->
  <rect x="14" y="10" width="1132" height="32" rx="4" fill="#FAF8F5" stroke="#D5CFC7" stroke-width="1"/>
  <text x="26" y="31" font-size="12.5" font-weight="700" fill="#1B1A18">EventStorming Legend:</text>
  <rect x="172" y="16" width="16" height="18" rx="2" fill="#6FB4F2" stroke="#1565C0" stroke-width="1.2"/>
  <text x="194" y="30" font-size="12" fill="#1B1A18">Command</text>
  <rect x="266" y="16" width="16" height="18" rx="2" fill="#FFF6C2" stroke="#A38F00" stroke-width="1.2"/>
  <text x="288" y="30" font-size="12" fill="#1B1A18">Aggregate</text>
  <rect x="360" y="16" width="16" height="18" rx="2" fill="#FFA040" stroke="#B85C00" stroke-width="1.2"/>
  <text x="382" y="30" font-size="12" fill="#1B1A18">Domain Event</text>
  <rect x="476" y="16" width="16" height="18" rx="2" fill="#FFA040" stroke="#5C2E00" stroke-width="2.6"/>
  <text x="498" y="30" font-size="12" font-weight="700" fill="#1B1A18">Pivotal Event (Java Record)</text>
  <rect x="676" y="16" width="16" height="18" rx="2" fill="#D7B4F3" stroke="#6A1B9A" stroke-width="1.2"/>
  <text x="698" y="30" font-size="12" fill="#1B1A18">Policy / Subscriber</text>
  <rect x="822" y="16" width="16" height="18" rx="2" fill="#F7B6D2" stroke="#9C1A5A" stroke-width="1.2"/>
  <text x="844" y="30" font-size="12" fill="#1B1A18">External System</text>
  <rect x="952" y="16" width="16" height="18" rx="2" fill="#D81B60" stroke="#7A0036" stroke-width="1.2"/>
  <text x="974" y="30" font-size="12" fill="#1B1A18">Hot Spot (Risk)</text>

  <!-- Phase 1: UC3 & UC4 Pay-First Formation & Settlement -->
  <rect x="14" y="52" width="466" height="326" rx="4" fill="#FAF8F5" stroke="#6B655C" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="26" y="72" font-size="13.5" font-weight="700" fill="#1B1A18">Act 1 — UC3 Initiate &amp; UC4 Join: Pay-First Settlement</text>

  <!-- Command: Issue Intent & Checkout -->
  <rect x="26" y="86" width="126" height="52" rx="3" fill="#6FB4F2" stroke="#1565C0" stroke-width="1.3"/>
  <text x="89" y="104" font-size="12" font-weight="700" fill="#1B1A18" text-anchor="middle">POST /intents &amp;</text>
  <text x="89" y="119" font-size="12" font-weight="700" fill="#1B1A18" text-anchor="middle">/checkout-sessions</text>
  <text x="89" y="133" font-size="11" fill="#1B1A18" text-anchor="middle">(START or JOIN)</text>

  <!-- Aggregate: PurchaseIntent / CheckoutPayment -->
  <rect x="168" y="86" width="132" height="52" rx="3" fill="#FFF6C2" stroke="#A38F00" stroke-width="1.3"/>
  <text x="234" y="105" font-size="12" font-weight="700" fill="#1B1A18" text-anchor="middle">PurchaseIntent &amp;</text>
  <text x="234" y="121" font-size="12" font-weight="700" fill="#1B1A18" text-anchor="middle">CheckoutPayment</text>
  <text x="234" y="134" font-size="11" fill="#6B655C" text-anchor="middle">Freeze quote &amp; terms</text>

  <!-- External: Stripe -->
  <rect x="316" y="86" width="148" height="52" rx="3" fill="#F7B6D2" stroke="#9C1A5A" stroke-width="1.3"/>
  <text x="390" y="105" font-size="12" font-weight="700" fill="#1B1A18" text-anchor="middle">Stripe Hosted Checkout</text>
  <text x="390" y="121" font-size="11.5" fill="#1B1A18" text-anchor="middle">POST /webhooks/stripe</text>
  <text x="390" y="134" font-size="11" fill="#9C1A5A" text-anchor="middle">(Signed + Event Dedup)</text>

  <!-- Pivotal Event: PaymentSucceeded -->
  <rect x="26" y="162" width="136" height="52" rx="3" fill="#FFA040" stroke="#5C2E00" stroke-width="2.6"/>
  <text x="94" y="182" font-size="12.5" font-weight="700" fill="#1B1A18" text-anchor="middle">PaymentSucceeded</text>
  <text x="94" y="198" font-size="11" fill="#1B1A18" text-anchor="middle">Pivotal Event Record</text>
  <text x="94" y="210" font-size="10.5" fill="#5C2E00" text-anchor="middle">(Money committed)</text>

  <!-- Policy: OrderFulfilmentAdapter.fulfil -->
  <rect x="178" y="162" width="146" height="52" rx="3" fill="#D7B4F3" stroke="#6A1B9A" stroke-width="1.3"/>
  <text x="251" y="180" font-size="11.5" font-weight="700" fill="#1B1A18" text-anchor="middle">Policy: Fulfil Intent</text>
  <text x="251" y="195" font-size="11" fill="#1B1A18" text-anchor="middle">1 Local ACID Txn</text>
  <text x="251" y="209" font-size="10.5" fill="#6A1B9A" text-anchor="middle">Lock: Team→Intent→Payment</text>

  <!-- Aggregate: GroupDeal + Order + Product -->
  <rect x="340" y="162" width="124" height="52" rx="3" fill="#FFF6C2" stroke="#A38F00" stroke-width="1.3"/>
  <text x="402" y="180" font-size="12" font-weight="700" fill="#1B1A18" text-anchor="middle">GroupDeal · Order</text>
  <text x="402" y="195" font-size="12" font-weight="700" fill="#1B1A18" text-anchor="middle">Product Stock</text>
  <text x="402" y="209" font-size="10.5" fill="#6B655C" text-anchor="middle">joinPaid + Order.create</text>

  <!-- Events: MemberJoined & OrderPlaced / FulfilmentRejected -->
  <rect x="26" y="236" width="196" height="52" rx="3" fill="#FFA040" stroke="#5C2E00" stroke-width="2.4"/>
  <text x="124" y="255" font-size="12" font-weight="700" fill="#1B1A18" text-anchor="middle">MemberJoined (Record)</text>
  <text x="124" y="271" font-size="11.5" fill="#1B1A18" text-anchor="middle">+ TeamStarted + OrderPlaced</text>
  <text x="124" y="284" font-size="10.5" fill="#5C2E00" text-anchor="middle">(AFTER_COMMIT → ShareCredit)</text>

  <rect x="238" y="236" width="226" height="52" rx="3" fill="#FFA040" stroke="#B85C00" stroke-width="1.3"/>
  <text x="351" y="255" font-size="12" font-weight="700" fill="#1B1A18" text-anchor="middle">Alt: FulfilmentRejected</text>
  <text x="351" y="271" font-size="11" fill="#1B1A18" text-anchor="middle">GROUP_REJECTED / BUSINESS_EXPIRED</text>
  <text x="351" y="284" font-size="10.5" fill="#5C2E00" text-anchor="middle">→ Refund Obligation in Same Txn</text>

  <!-- Hot spots in Act 1 -->
  <rect x="26" y="304" width="210" height="60" rx="3" fill="#D81B60" stroke="#7A0036" stroke-width="1.2"/>
  <text x="131" y="322" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">HS-1 Last-Slot Race &amp; HS-2 Replay</text>
  <text x="131" y="338" font-size="11" fill="#FFFFFF" text-anchor="middle">Row lock on GroupDeal + webhook</text>
  <text x="131" y="353" font-size="11" fill="#FFFFFF" text-anchor="middle">event claim &amp; unique payment index</text>

  <rect x="250" y="304" width="214" height="60" rx="3" fill="#D81B60" stroke="#7A0036" stroke-width="1.2"/>
  <text x="357" y="322" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">HS-8 Shared Settlement Txn</text>
  <text x="357" y="338" font-size="11" fill="#FFFFFF" text-anchor="middle">Payment, Order, Stock &amp; Team</text>
  <text x="357" y="353" font-size="11" fill="#FFFFFF" text-anchor="middle">must commit or roll back together</text>

  <!-- Phase 2: UC5 Team Resolution -->
  <rect x="494" y="52" width="346" height="326" rx="4" fill="#FAF8F5" stroke="#6B655C" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="506" y="72" font-size="13.5" font-weight="700" fill="#1B1A18">Act 2 — UC5 Team Resolution (In-Txn + Outbox)</text>

  <!-- Pivotal Event: TeamSucceeded -->
  <rect x="508" y="86" width="150" height="54" rx="3" fill="#FFA040" stroke="#5C2E00" stroke-width="2.6"/>
  <text x="583" y="106" font-size="12.5" font-weight="700" fill="#1B1A18" text-anchor="middle">TeamSucceeded</text>
  <text x="583" y="122" font-size="11" fill="#1B1A18" text-anchor="middle">Quota filled (current == target)</text>
  <text x="583" y="135" font-size="10.5" fill="#5C2E00" text-anchor="middle">DealStatus: OPEN → SUCCEEDED</text>

  <!-- Policy: Confirm Orders + Write Outbox -->
  <rect x="674" y="86" width="152" height="54" rx="3" fill="#D7B4F3" stroke="#6A1B9A" stroke-width="1.3"/>
  <text x="750" y="104" font-size="11.5" font-weight="700" fill="#1B1A18" text-anchor="middle">BEFORE_COMMIT (@Order)</text>
  <text x="750" y="119" font-size="11" fill="#1B1A18" text-anchor="middle">10: Confirm Team Orders</text>
  <text x="750" y="134" font-size="11" fill="#6A1B9A" text-anchor="middle">LOWEST: Outbox V1 Row</text>

  <!-- Time Trigger + TeamExpired -->
  <rect x="508" y="162" width="150" height="54" rx="3" fill="#FFA040" stroke="#5C2E00" stroke-width="2.6"/>
  <text x="583" y="182" font-size="12.5" font-weight="700" fill="#1B1A18" text-anchor="middle">TeamExpired</text>
  <text x="583" y="198" font-size="11" fill="#1B1A18" text-anchor="middle">TeamExpirySweepJob (60s)</text>
  <text x="583" y="211" font-size="10.5" fill="#5C2E00" text-anchor="middle">DealStatus: OPEN → EXPIRED</text>

  <!-- Policy: Cancel Orders + Record Refunds + Write Outbox -->
  <rect x="674" y="162" width="152" height="54" rx="3" fill="#D7B4F3" stroke="#6A1B9A" stroke-width="1.3"/>
  <text x="750" y="180" font-size="11.5" font-weight="700" fill="#1B1A18" text-anchor="middle">BEFORE_COMMIT (@Order)</text>
  <text x="750" y="195" font-size="11" fill="#1B1A18" text-anchor="middle">10: Cancel · 20: Record Refund</text>
  <text x="750" y="210" font-size="11" fill="#6A1B9A" text-anchor="middle">LOWEST: Outbox V1 Row</text>

  <!-- Events: Orders Confirmed / Cancelled + Refund Obligation -->
  <rect x="508" y="236" width="318" height="52" rx="3" fill="#FFA040" stroke="#B85C00" stroke-width="1.3"/>
  <text x="667" y="255" font-size="12" font-weight="700" fill="#1B1A18" text-anchor="middle">OrdersConfirmed / OrdersCancelled + RefundObligationRecorded</text>
  <text x="667" y="271" font-size="11" fill="#1B1A18" text-anchor="middle">+ sys_outbox: TeamSucceededV1 / TeamExpiredV1 / PaymentSucceededV1</text>
  <text x="667" y="284" font-size="10.5" fill="#5C2E00" text-anchor="middle">(Enriched with recipientUserIds inside the same transaction)</text>

  <!-- Hot spot in Act 2 -->
  <rect x="508" y="304" width="318" height="60" rx="3" fill="#D81B60" stroke="#7A0036" stroke-width="1.2"/>
  <text x="667" y="322" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">HS-4 Sweeper vs Webhook Race on Expiring Team</text>
  <text x="667" y="338" font-size="11" fill="#FFFFFF" text-anchor="middle">Both acquire SELECT ... FOR UPDATE on GroupDeal first;</text>
  <text x="667" y="353" font-size="11" fill="#FFFFFF" text-anchor="middle">status-guarded transition makes the second caller a safe no-op</text>

  <!-- Phase 3: UC6 Refund & Cross-Service Fan-out -->
  <rect x="854" y="52" width="292" height="326" rx="4" fill="#FAF8F5" stroke="#6B655C" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="866" y="72" font-size="13.5" font-weight="700" fill="#1B1A18">Act 3 — UC6 Refund &amp; Async Fan-out</text>

  <!-- Refund Worker + Stripe Refunds -->
  <rect x="868" y="86" width="264" height="62" rx="3" fill="#FFF6C2" stroke="#A38F00" stroke-width="1.3"/>
  <text x="1000" y="105" font-size="12" font-weight="700" fill="#1B1A18" text-anchor="middle">RefundWorkerJob → RefundWork</text>
  <text x="1000" y="121" font-size="11.5" fill="#1B1A18" text-anchor="middle">Claims pending biz_refund outside DB txn</text>
  <text x="1000" y="136" font-size="11" fill="#9C1A5A" text-anchor="middle">Calls Stripe Refunds API (idempotency key)</text>

  <!-- Refund Events -->
  <rect x="868" y="164" width="264" height="52" rx="3" fill="#FFA040" stroke="#B85C00" stroke-width="1.3"/>
  <text x="1000" y="183" font-size="12" font-weight="700" fill="#1B1A18" text-anchor="middle">RefundSucceeded / RetryDue / Review</text>
  <text x="1000" y="199" font-size="11" fill="#1B1A18" text-anchor="middle">23h idempotency window guard (HS-6)</text>

  <!-- Outbox Relay -> SNS -> SQS -> Notification -->
  <rect x="868" y="232" width="264" height="132" rx="3" fill="#D7B4F3" stroke="#6A1B9A" stroke-width="1.3"/>
  <text x="1000" y="252" font-size="12" font-weight="700" fill="#1B1A18" text-anchor="middle">Async Cross-Service Choreography</text>
  <text x="1000" y="270" font-size="11.5" fill="#1B1A18" text-anchor="middle">1. OutboxRelayJob (leased, batches of 10)</text>
  <text x="1000" y="287" font-size="11.5" fill="#1B1A18" text-anchor="middle">2. SNS Topic fan-out by eventType</text>
  <text x="1000" y="304" font-size="11.5" fill="#1B1A18" text-anchor="middle">3. SQS notification-events &amp; audit-events</text>
  <text x="1000" y="321" font-size="11.5" fill="#1B1A18" text-anchor="middle">4. notification-svc: sys_consumed_message</text>
  <text x="1000" y="338" font-size="11.5" fill="#6A1B9A" text-anchor="middle">dedup + insert biz_notification in 1 txn</text>

  <!-- Connectors -->
  <g stroke="#1B1A18" stroke-width="1.4" fill="none">
    <line x1="152" y1="112" x2="168" y2="112" marker-end="url(#esArr)"/>
    <line x1="300" y1="112" x2="316" y2="112" marker-end="url(#esArr)"/>
    <polyline points="390,138 390,150 94,150 94,162" marker-end="url(#esArr)"/>
    <line x1="162" y1="188" x2="178" y2="188" marker-end="url(#esArr)"/>
    <line x1="324" y1="188" x2="340" y2="188" marker-end="url(#esArr)"/>
    <polyline points="402,214 402,225 124,225 124,236" marker-end="url(#esArr)"/>
    <line x1="351" y1="225" x2="351" y2="236" marker-end="url(#esArr)"/>
    <!-- Act 1 to Act 2 -->
    <polyline points="222,252 486,252 486,112 508,112" marker-end="url(#esArr)"/>
    <line x1="658" y1="112" x2="674" y2="112" marker-end="url(#esArr)"/>
    <line x1="658" y1="188" x2="674" y2="188" marker-end="url(#esArr)"/>
    <line x1="750" y1="140" x2="750" y2="162"/>
    <line x1="750" y1="216" x2="750" y2="236" marker-end="url(#esArr)"/>
    <!-- Act 2 to Act 3 -->
    <polyline points="826,252 846,252 846,116 868,116" marker-end="url(#esArr)"/>
    <line x1="1000" y1="148" x2="1000" y2="164" marker-end="url(#esArr)"/>
    <line x1="826" y1="274" x2="868" y2="274" stroke="#6A1B9A" stroke-dasharray="5 3" marker-end="url(#esOpen)"/>
  </g>
</svg>
