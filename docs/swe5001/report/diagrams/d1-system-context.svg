<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1310" viewBox="0 0 1400 1310" font-family="Inter, Helvetica, Arial, sans-serif">
<defs>
<marker id="d1Fill" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 Z" fill="#1B1A18"/></marker>
<linearGradient id="d1Blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3E8FB"/></linearGradient>
<linearGradient id="d1Person" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6E2"/><stop offset="1" stop-color="#FFEDC7"/></linearGradient>
<linearGradient id="d1Ext" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECE6DC"/></linearGradient>
</defs>
<rect x="0" y="0" width="1400" height="1310" fill="#FFFFFF"/>

<!-- title tab -->
<rect x="20" y="10" width="600" height="46" fill="#FFFFFF" stroke="#1B1A18" stroke-width="1.8"/>
<text x="36" y="43" font-size="30" font-weight="700" fill="#1B1A18">System context — BlocBuy (C4 level 1)</text>

<!-- platform-role groups -->
<rect x="20" y="70" width="420" height="330" fill="none" stroke="#6B655C" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="34" y="102" font-size="28" font-weight="700" fill="#6B655C">Consumers</text>
<rect x="470" y="70" width="910" height="330" fill="none" stroke="#6B655C" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="484" y="102" font-size="28" font-weight="700" fill="#6B655C">Producers</text>

<!-- person: buyer (joiner) -->
<rect x="40" y="160" width="380" height="225" rx="24" fill="url(#d1Person)" stroke="#7A5C20" stroke-width="1.8"/>
<circle cx="230" cy="138" r="24" fill="#FFF6E2" stroke="#7A5C20" stroke-width="1.8"/>
<text x="230" y="198" font-size="26" text-anchor="middle" fill="#6B655C">«person»</text>
<text x="230" y="236" font-size="30" font-weight="700" text-anchor="middle" fill="#1B1A18">Buyer (joiner)</text>
<text x="230" y="282" font-size="26" text-anchor="middle" fill="#1B1A18"><tspan x="230">Browses, pays to join a</tspan><tspan x="230" dy="31">team, tracks orders,</tspan><tspan x="230" dy="31">receives notifications</tspan></text>

<!-- person: team leader -->
<rect x="490" y="160" width="420" height="225" rx="24" fill="url(#d1Person)" stroke="#7A5C20" stroke-width="1.8"/>
<circle cx="700" cy="138" r="24" fill="#FFF6E2" stroke="#7A5C20" stroke-width="1.8"/>
<text x="700" y="198" font-size="26" text-anchor="middle" fill="#6B655C">«person»</text>
<text x="700" y="236" font-size="30" font-weight="700" text-anchor="middle" fill="#1B1A18"><tspan x="700">Buyer</tspan><tspan x="700" dy="34">(team leader / sharer)</tspan></text>
<text x="700" y="314" font-size="26" text-anchor="middle" fill="#1B1A18"><tspan x="700">Starts a team by paying,</tspan><tspan x="700" dy="31">shares invite links</tspan></text>

<!-- person: seller / admin -->
<rect x="940" y="160" width="420" height="225" rx="24" fill="url(#d1Person)" stroke="#7A5C20" stroke-width="1.8"/>
<circle cx="1150" cy="138" r="24" fill="#FFF6E2" stroke="#7A5C20" stroke-width="1.8"/>
<text x="1150" y="198" font-size="26" text-anchor="middle" fill="#6B655C">«person»</text>
<text x="1150" y="236" font-size="30" font-weight="700" text-anchor="middle" fill="#1B1A18"><tspan x="1150">Seller / Platform</tspan><tspan x="1150" dy="34">administrator</tspan></text>
<text x="1150" y="314" font-size="26" text-anchor="middle" fill="#1B1A18"><tspan x="1150">Publishes listings and</tspan><tspan x="1150" dy="31">team price rules (UC9)</tspan></text>

<!-- software system in scope -->
<rect x="40" y="530" width="1320" height="220" fill="url(#d1Blue)" stroke="#3E5CD9" stroke-width="2.4"/>
<text x="700" y="574" font-size="26" text-anchor="middle" fill="#6B655C">«software system»</text>
<text x="700" y="622" font-size="36" font-weight="700" text-anchor="middle" fill="#3E5CD9">BlocBuy community group-buying platform</text>
<text x="700" y="674" font-size="26" text-anchor="middle" fill="#1B1A18"><tspan x="700">Team-priced group buying: start or join a team by paying;</tspan><tspan x="700" dy="32">the team succeeds at target size or expires with automatic refunds</tspan></text>

<!-- external: Google -->
<rect x="120" y="900" width="440" height="180" fill="url(#d1Ext)" stroke="#6B655C" stroke-width="1.8"/>
<text x="340" y="938" font-size="26" text-anchor="middle" fill="#6B655C">«external system»</text>
<text x="340" y="976" font-size="30" font-weight="700" text-anchor="middle" fill="#1B1A18"><tspan x="340">Google Sign-In</tspan><tspan x="340" dy="34">(OAuth 2.0 / OIDC)</tspan></text>
<text x="340" y="1056" font-size="26" text-anchor="middle" fill="#1B1A18">Authenticates users</text>

<!-- external: Stripe -->
<rect x="820" y="900" width="460" height="180" fill="url(#d1Ext)" stroke="#6B655C" stroke-width="1.8"/>
<text x="1050" y="938" font-size="26" text-anchor="middle" fill="#6B655C">«external system»</text>
<text x="1050" y="976" font-size="30" font-weight="700" text-anchor="middle" fill="#1B1A18">Stripe (test mode)</text>
<text x="1050" y="1018" font-size="26" text-anchor="middle" fill="#1B1A18"><tspan x="1050">Checkout payments,</tspan><tspan x="1050" dy="31">webhooks, refunds</tspan></text>

<!-- relationships: people <-> system -->
<line x1="80" y1="385" x2="80" y2="530" stroke="#1B1A18" stroke-width="1.8" marker-end="url(#d1Fill)"/>
<text x="92" y="432" font-size="26" fill="#1B1A18"><tspan x="92">Browses deals, pays,</tspan><tspan x="92" dy="30">tracks teams</tspan><tspan x="92" dy="30" fill="#6B655C">[HTTPS, web SPA]</tspan></text>
<line x1="390" y1="530" x2="390" y2="385" stroke="#1B1A18" stroke-width="1.8" marker-end="url(#d1Fill)"/>
<text x="402" y="447" font-size="26" fill="#1B1A18"><tspan x="402">In-app</tspan><tspan x="402" dy="30">notifications</tspan></text>
<line x1="700" y1="385" x2="700" y2="530" stroke="#1B1A18" stroke-width="1.8" marker-end="url(#d1Fill)"/>
<text x="712" y="432" font-size="26" fill="#1B1A18"><tspan x="712">Starts teams,</tspan><tspan x="712" dy="30">shares invite links</tspan><tspan x="712" dy="30" fill="#6B655C">[HTTPS, web SPA]</tspan></text>
<line x1="1060" y1="385" x2="1060" y2="530" stroke="#1B1A18" stroke-width="1.8" marker-end="url(#d1Fill)"/>
<text x="1072" y="432" font-size="26" fill="#1B1A18"><tspan x="1072">Publishes listings,</tspan><tspan x="1072" dy="30">team price rules</tspan><tspan x="1072" dy="30" fill="#6B655C">[HTTPS, web SPA]</tspan></text>

<!-- relationships: system <-> Google / Stripe -->
<line x1="340" y1="750" x2="340" y2="900" stroke="#1B1A18" stroke-width="1.8" marker-end="url(#d1Fill)"/>
<text x="352" y="812" font-size="26" fill="#1B1A18"><tspan x="352">Delegates sign-in</tspan><tspan x="352" dy="30" fill="#6B655C">[OIDC]</tspan></text>
<line x1="880" y1="750" x2="880" y2="900" stroke="#1B1A18" stroke-width="1.8" marker-end="url(#d1Fill)"/>
<text x="868" y="798" font-size="26" text-anchor="end" fill="#1B1A18"><tspan x="868">Creates Checkout</tspan><tspan x="868" dy="30">sessions, refunds</tspan><tspan x="868" dy="30" fill="#6B655C">[HTTPS API]</tspan></text>
<line x1="1000" y1="900" x2="1000" y2="750" stroke="#1B1A18" stroke-width="1.8" marker-end="url(#d1Fill)"/>
<text x="1012" y="812" font-size="26" fill="#1B1A18"><tspan x="1012">Payment webhooks</tspan><tspan x="1012" dy="30" fill="#6B655C">[HTTPS, signed]</tspan></text>

<!-- key -->
<rect x="20" y="1120" width="820" height="176" fill="none" stroke="#1B1A18" stroke-width="1.4"/>
<text x="36" y="1154" font-size="26" font-weight="700" fill="#1B1A18">Key</text>
<rect x="40" y="1172" width="56" height="32" rx="10" fill="url(#d1Person)" stroke="#7A5C20" stroke-width="1.6"/>
<text x="110" y="1197" font-size="26" fill="#1B1A18">Person</text>
<rect x="40" y="1214" width="56" height="32" fill="url(#d1Blue)" stroke="#3E5CD9" stroke-width="2"/>
<text x="110" y="1239" font-size="26" fill="#1B1A18">Software system in scope</text>
<rect x="40" y="1256" width="56" height="32" fill="url(#d1Ext)" stroke="#6B655C" stroke-width="1.6"/>
<text x="110" y="1281" font-size="26" fill="#1B1A18">External software system</text>
<line x1="450" y1="1188" x2="520" y2="1188" stroke="#1B1A18" stroke-width="1.8" marker-end="url(#d1Fill)"/>
<text x="534" y="1197" font-size="26" fill="#1B1A18">Run-time interaction</text>
<text x="450" y="1239" font-size="26" fill="#6B655C">[technology]</text>
<text x="606" y="1239" font-size="26" fill="#1B1A18">on the arrow</text>
<rect x="450" y="1256" width="70" height="32" fill="none" stroke="#6B655C" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="534" y="1281" font-size="26" fill="#1B1A18">Platform role group</text>

<!-- seed note -->
<path d="M870,1120 L1352,1120 L1380,1148 L1380,1296 L870,1296 Z" fill="url(#d1Ext)" stroke="#6B655C" stroke-width="1.6"/>
<path d="M1352,1120 L1352,1148 L1380,1148" fill="none" stroke="#6B655C" stroke-width="1.6"/>
<text x="890" y="1160" font-size="26" fill="#1B1A18"><tspan x="890" font-weight="700">Seed:</tspan><tspan x="890" dy="32">curated team-priced offers</tspan><tspan x="890" dy="32">published by the operator</tspan><tspan x="890" dy="32">through UC9</tspan></text>
</svg>
