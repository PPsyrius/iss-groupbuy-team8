<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 740" width="100%" height="100%">
<rect width="1320" height="740" fill="#FFFFFF"/>

  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1F2328; }
      .title { font-size: 13px; font-weight: bold; }
      .h1 { font-size: 12.5px; font-weight: bold; }
      .h2 { font-size: 11.5px; font-weight: bold; }
      .stereo { font-size: 10px; fill: #57606A; }
      .body { font-size: 10.5px; fill: #1F2328; }
      .small { font-size: 9.8px; fill: #57606A; }
      .code { font-family: Consolas, 'Courier New', monospace; font-size: 9.8px; fill: #1F2328; }
    </style>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2F363D"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5" fill="none" stroke="#2F363D" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#C93B2B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5" fill="none" stroke="#6E3CBC" stroke-width="1.5"/>
    </marker>
    <marker id="diamond-black" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="1,6 6,2 11,6 6,10" fill="#1F2328" stroke="#1F2328" stroke-width="1"/>
    </marker>
  </defs>

<rect x="30" y="25" width="880" height="125" fill="#F4F7FB" stroke="#2B5B84" stroke-width="1.4" stroke-dasharray="6,4" rx="5"/>
<text x="45" y="46" class="h1" fill="#2B5B84">«service» identity-svc (Reusable Platform Service)</text>
<rect x="45" y="56" width="515" height="82" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.3" rx="4"/>
<text x="58" y="76" class="h2">Identity &amp; Access Context</text>
<text x="235" y="76" class="small">(Generic Subdomain)</text>
<text x="58" y="96" class="body">Aggregates &amp; Entities: User (Root), OAuthIdentity · VOs: UserStatus, RoleCode</text>
<text x="58" y="114" class="small">Provides Open Host Service: UserAppService (/internal/users/**) + Shared Valkey Session</text>
<rect x="575" y="56" width="320" height="82" fill="#FAF9F6" stroke="#6E6A64" stroke-width="1.3" stroke-dasharray="5,3" rx="4"/>
<text x="588" y="76" class="h2">Shared Kernel (common)</text>
<text x="588" y="96" class="body">ErrorCode, BizException, Result, UuidV7,</text>
<text x="588" y="114" class="body">PageQuery, RoleCode, LeasedJobRunner</text>
<line x1="250" y1="150" x2="250" y2="200" stroke="#C93B2B" stroke-width="1.6" marker-end="url(#arrow-red)"/>
<text x="235" y="168" text-anchor="end" class="h2">U</text>
<text x="235" y="193" text-anchor="end" class="h2">D</text>
<text x="265" y="170" class="body" fill="#C93B2B" font-weight="bold">Customer/Supplier + Open Host Service (OHS)</text>
<text x="265" y="187" class="small">Sync HTTP UserAppService (/internal/users/**) + Shared Valkey Session</text>
<rect x="30" y="200" width="880" height="355" fill="#FDF6F5" stroke="#C93B2B" stroke-width="1.4" stroke-dasharray="6,4" rx="5"/>
<text x="45" y="221" class="h1" fill="#C93B2B">«service» commerce-svc (Core Transactional Service — Co-locates Contexts Sharing Settlement ACID Txn)</text>
<rect x="45" y="235" width="365" height="125" fill="#FFFFFF" stroke="#2B5B84" stroke-width="1.4" rx="4"/>
<text x="58" y="256" class="h1">Catalog &amp; Pricing Context</text>
<text x="235" y="256" class="small" fill="#2B5B84">(Supporting)</text>
<text x="58" y="277" class="body">Roots: Product, TeamPricePolicy</text>
<text x="58" y="295" class="body">VOs: ProductTeamTerms, TeamPriceQuote</text>
<text x="58" y="313" class="body">Service: DualPricingStrategy (Strategy)</text>
<text x="58" y="331" class="small">Support: CatalogPurchaseSupport (consumeOneUnit)</text>
<rect x="525" y="235" width="370" height="125" fill="#FFFDF8" stroke="#BC4C00" stroke-width="1.8" rx="4"/>
<text x="538" y="256" class="h1">GroupBuy Context</text>
<text x="665" y="256" class="body" fill="#BC4C00" font-weight="bold">(CORE Subdomain)</text>
<text x="538" y="277" class="body">Root: GroupDeal / Team (DealStatus state machine)</text>
<text x="538" y="295" class="body">Entities/VOs: PaidMember, ParticipationReceipt</text>
<text x="538" y="313" class="body">Own-Repo: ShareInvite, ShareCredit · PaidGroupDealCreator</text>
<text x="538" y="331" class="small" fill="#BC4C00">Events: TeamSucceeded, TeamExpired, MemberJoined</text>
<line x1="525" y1="295" x2="410" y2="295" stroke="#2F363D" stroke-width="1.4" marker-end="url(#arrow-solid)"/>
<text x="467" y="270" text-anchor="middle" class="small" font-weight="bold" fill="#1F2328">Customer/Supplier</text>
<text x="424" y="288" class="h2">D</text>
<text x="504" y="288" class="h2">U</text>
<text x="467" y="312" text-anchor="middle" class="small">GroupDealOffer</text>
<line x1="165" y1="360" x2="165" y2="415" stroke="#2F363D" stroke-width="1.4" marker-end="url(#arrow-solid)"/>
<text x="150" y="376" text-anchor="end" class="h2">U</text>
<text x="150" y="408" text-anchor="end" class="h2">D</text>
<text x="175" y="384" class="small" font-weight="bold" fill="#1F2328">Customer/Supplier</text>
<text x="175" y="399" class="small">CatalogPurchaseSupport</text>
<line x1="525" y1="360" x2="410" y2="415" stroke="#BC4C00" stroke-width="1.5" marker-start="url(#arrow-solid)" marker-end="url(#arrow-solid)"/>
<rect x="382" y="370" width="170" height="34" fill="#FFF8C5" stroke="#BC4C00" stroke-width="1.1" rx="4"/>
<text x="467" y="384" text-anchor="middle" class="small" font-weight="bold" fill="#7A2E00">Partnership (1 ACID Txn)</text>
<text x="467" y="398" text-anchor="middle" class="small" fill="#1F2328">Settlement &amp; BEFORE_COMMIT</text>
<line x1="680" y1="360" x2="680" y2="415" stroke="#2F363D" stroke-width="1.4" marker-end="url(#arrow-solid)"/>
<text x="668" y="376" text-anchor="end" class="h2">U</text>
<text x="668" y="408" text-anchor="end" class="h2">D</text>
<text x="690" y="384" class="small" font-weight="bold" fill="#1F2328">Published Language</text>
<text x="690" y="399" class="small">TeamExpired (BEFORE_COMMIT)</text>
<rect x="45" y="415" width="365" height="125" fill="#FFFDF8" stroke="#BC4C00" stroke-width="1.8" rx="4"/>
<text x="58" y="436" class="h1">Ordering Context</text>
<text x="178" y="436" class="body" fill="#BC4C00" font-weight="bold">(CORE Subdomain)</text>
<text x="58" y="457" class="body">Roots: PurchaseIntent, Order (OrderStatus)</text>
<text x="58" y="475" class="body">Adapter: OrderFulfilmentAdapter (implements</text>
<text x="58" y="493" class="body">PaymentIntentPort &amp; PaymentBusinessPort)</text>
<text x="58" y="511" class="small">Subscriber: OrderLifecycleSubscriber (@Order 10)</text>
<rect x="525" y="415" width="370" height="125" fill="#FFFFFF" stroke="#2B5B84" stroke-width="1.4" rx="4"/>
<text x="538" y="436" class="h1">Payment &amp; Refund Context</text>
<text x="718" y="436" class="body" fill="#BC4C00" font-weight="bold">(CORE Subdomain)</text>
<text x="538" y="457" class="body">Roots: CheckoutPayment, RefundWork, ReviewCase</text>
<text x="538" y="475" class="body">VO: CheckoutQuote · Event: PaymentSucceeded</text>
<text x="538" y="493" class="body">Ports: PaymentIntentPort, PaymentBusinessPort</text>
<text x="538" y="511" class="small">Subscriber: TeamExpiryRefundSubscriber (@Order 20)</text>
<line x1="525" y1="480" x2="410" y2="480" stroke="#2F363D" stroke-width="1.4" marker-end="url(#arrow-solid)"/>
<text x="467" y="456" text-anchor="middle" class="small" font-weight="bold" fill="#1F2328">Conformist (Ports)</text>
<text x="424" y="473" class="h2">D</text>
<text x="504" y="473" class="h2">U</text>
<text x="467" y="497" text-anchor="middle" class="small">PaymentBusinessPort</text>
<line x1="250" y1="555" x2="250" y2="605" stroke="#2F363D" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow-open)"/>
<line x1="720" y1="555" x2="720" y2="605" stroke="#2F363D" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow-open)"/>
<text x="235" y="573" text-anchor="end" class="h2">U</text>
<text x="235" y="598" text-anchor="end" class="h2">D</text>
<text x="265" y="576" class="body" font-weight="bold">Published Language (PL) over Outbox → SNS → SQS</text>
<text x="265" y="593" class="small">IntegrationEventEnvelope&lt;T&gt;: TeamSucceededV1, TeamExpiredV1, PaymentSucceededV1</text>
<rect x="30" y="605" width="535" height="110" fill="#F4F7FB" stroke="#2B5B84" stroke-width="1.4" stroke-dasharray="6,4" rx="5"/>
<text x="45" y="626" class="h1" fill="#2B5B84">«service» notification-svc (Reusable Platform Service)</text>
<rect x="45" y="636" width="505" height="66" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.3" rx="4"/>
<text x="58" y="657" class="h2">Notification Context</text>
<text x="195" y="657" class="small">(Supporting Subdomain)</text>
<text x="58" y="677" class="body">Root: Notification · Inbox Dedup: sys_consumed_message</text>
<text x="58" y="693" class="small">Consumer: SqsNotificationEventConsumer (Zero callbacks to upstream)</text>
<rect x="590" y="605" width="320" height="110" fill="#FBF8F1" stroke="#8C6D3F" stroke-width="1.4" stroke-dasharray="6,4" rx="5"/>
<text x="605" y="628" class="h1" fill="#8C6D3F">Audit &amp; Analytics Subscriber</text>
<text x="605" y="649" class="body">audit SQS Queue (+ DLQ)</text>
<text x="605" y="668" class="small">Subscribed with 0 producer code changes</text>
<text x="605" y="685" class="small">(Supports high-compute / batch analytics)</text>
<rect x="1075" y="45" width="220" height="92" fill="#F8F6F2" stroke="#6E6A64" stroke-width="1.3" rx="4"/>
<text x="1185" y="68" text-anchor="middle" class="stereo">«external system»</text>
