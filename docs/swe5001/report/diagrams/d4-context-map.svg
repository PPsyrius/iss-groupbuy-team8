<rect x="1075" y="250" width="220" height="92" fill="#F8F6F2" stroke="#6E6A64" stroke-width="1.3" rx="4"/>
<text x="1185" y="273" text-anchor="middle" class="stereo">«external system»</text>
<text x="1185" y="293" text-anchor="middle" class="h1">TypeSafe Reranker</text>
<text x="1185" y="313" text-anchor="middle" class="small">Optional Semantic Search</text>
<line x1="1075" y1="296" x2="895" y2="296" stroke="#2F363D" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow-solid)"/>
<text x="922" y="286" class="h2">D (ACL, fail-open)</text>
<text x="1055" y="286" class="h2">U</text>
<text x="992" y="314" text-anchor="middle" class="small">ListingSearchReranker</text>
<rect x="1075" y="425" width="220" height="105" fill="#F8F6F2" stroke="#6E6A64" stroke-width="1.3" rx="4"/>
<text x="1185" y="448" text-anchor="middle" class="stereo">«external system»</text>
<text x="1185" y="468" text-anchor="middle" class="h1">Stripe</text>
<text x="1185" y="488" text-anchor="middle" class="body">Hosted Checkout, Signed</text>
<text x="1185" y="505" text-anchor="middle" class="body">Webhooks &amp; Refunds API</text>
<line x1="1075" y1="477" x2="895" y2="477" stroke="#2F363D" stroke-width="1.4" marker-end="url(#arrow-solid)"/>
<text x="922" y="467" class="h2">D (ACL)</text>
<text x="1055" y="467" class="h2">U</text>
