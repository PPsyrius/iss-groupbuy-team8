<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 650" width="100%" height="100%">
<rect width="1320" height="650" fill="#FFFFFF"/>

  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #1F2328; }
      .title { font-size: 13px; font-weight: bold; }
      .h1 { font-size: 12.5px; font-weight: bold; }
      .h2 { font-size: 11.5px; font-weight: bold; }
      .stereo { font-size: 10px; fill: #57606A; }
      .body { font-size: 10.5px; fill: #1F2328; }
      .small { font-size: 9.8px; fill: #57606A; }
      .code { font-family: Consolas, 'Courier New', monospace; font-size: 9.8px; fill: #1F2328; }
    </style>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2F363D"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5" fill="none" stroke="#2F363D" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#C93B2B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5" fill="none" stroke="#6E3CBC" stroke-width="1.5"/>
    </marker>
    <marker id="diamond-black" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="1,6 6,2 11,6 6,10" fill="#1F2328" stroke="#1F2328" stroke-width="1"/>
    </marker>
  </defs>

<rect x="20" y="20" width="695" height="610" fill="#FDF6F5" stroke="#C93B2B" stroke-width="1.4" stroke-dasharray="6,4" rx="5"/>
<text x="35" y="43" class="h1" fill="#C93B2B">«service» commerce-svc — In-Process Domain Events &amp; Transactional Outbox</text>
<rect x="35" y="56" width="665" height="405" fill="#FFFFFF" stroke="#C93B2B" stroke-width="1.3" stroke-dasharray="4,3" rx="4"/>
<text x="48" y="76" class="h2" fill="#C93B2B">Single Local PostgreSQL ACID Transaction Boundary (BEFORE_COMMIT Phase)</text>
<rect x="55" y="92" width="235" height="135" fill="#FFF5F5" stroke="#C93B2B" stroke-width="1.4" rx="3"/>
<text x="172" y="114" text-anchor="middle" class="stereo">«aggregate root»</text>
<text x="172" y="135" text-anchor="middle" class="h1">GroupDeal (groupbuy)</text>
<text x="172" y="158" text-anchor="middle" class="body">Emits Domain Event Records:</text>
<text x="172" y="180" text-anchor="middle" class="body" fill="#C93B2B" font-weight="bold">MemberJoined · TeamSucceeded</text>
<text x="172" y="198" text-anchor="middle" class="body" fill="#C93B2B" font-weight="bold">TeamExpired</text>
<rect x="55" y="252" width="235" height="115" fill="#FFF5F5" stroke="#C93B2B" stroke-width="1.4" rx="3"/>
<text x="172" y="274" text-anchor="middle" class="stereo">«aggregate root»</text>
<text x="172" y="295" text-anchor="middle" class="h1">CheckoutPayment (payment)</text>
<text x="172" y="318" text-anchor="middle" class="body">Emits Domain Event Record:</text>
<text x="172" y="340" text-anchor="middle" class="body" fill="#C93B2B" font-weight="bold">PaymentSucceeded</text>
<rect x="330" y="92" width="355" height="72" fill="#F6F8FA" stroke="#57606A" stroke-width="1.3" rx="3"/>
<text x="507" y="112" text-anchor="middle" class="h2">OrderLifecycleSubscriber (@Order 10)</text>
<text x="507" y="131" text-anchor="middle" class="small" fill="#1F2328">BEFORE_COMMIT: confirms all orders on TeamSucceeded;</text>
<text x="507" y="147" text-anchor="middle" class="small" fill="#1F2328">cancels all orders on TeamExpired</text>
<rect x="330" y="176" width="355" height="72" fill="#F6F8FA" stroke="#57606A" stroke-width="1.3" rx="3"/>
<text x="507" y="196" text-anchor="middle" class="h2">TeamExpiryRefundSubscriber (@Order 20)</text>
<text x="507" y="215" text-anchor="middle" class="small" fill="#1F2328">BEFORE_COMMIT: inserts idempotent biz_refund rows</text>
<text x="507" y="231" text-anchor="middle" class="small">via TeamExpiryRefundService.recordExpiredTeam</text>
<rect x="330" y="260" width="355" height="110" fill="#FFF5F5" stroke="#C93B2B" stroke-width="1.4" rx="3"/>
<text x="507" y="280" text-anchor="middle" class="h2" fill="#C93B2B">IntegrationOutboxWriter (@Order LOWEST)</text>
<text x="507" y="299" text-anchor="middle" class="small" fill="#1F2328">BEFORE_COMMIT: maps internal records to V1 contracts</text>
<text x="507" y="315" text-anchor="middle" class="small" fill="#1F2328">Enriches recipientUserIds via IntegrationRecipientRepository</text>
<text x="507" y="331" text-anchor="middle" class="small" fill="#1F2328">Strips PII/card data; propagates MDC traceId</text>
<text x="507" y="349" text-anchor="middle" class="small" fill="#C93B2B" font-weight="bold">Inserts into sys_outbox (UUIDv7 eventId)</text>
<line x1="290" y1="128" x2="330" y2="128" stroke="#2F363D" stroke-width="1.4" marker-end="url(#arrow-solid)"/>
<line x1="290" y1="165" x2="330" y2="210" stroke="#2F363D" stroke-width="1.4" marker-end="url(#arrow-solid)"/>
<line x1="290" y1="195" x2="330" y2="295" stroke="#2F363D" stroke-width="1.4" marker-end="url(#arrow-solid)"/>
<line x1="290" y1="315" x2="330" y2="315" stroke="#2F363D" stroke-width="1.4" marker-end="url(#arrow-solid)"/>

    <g>
      <path d="M 392,394 L 392,444 A 115.0,8 0 0 0 622,444 L 622,394 Z" fill="#FFFFFF" stroke="#C93B2B" stroke-width="1.3"/>
      <ellipse cx="507.0" cy="394" rx="115.0" ry="8" fill="#FFFFFF" stroke="#C93B2B" stroke-width="1.3"/>
      <text x="507.0" y="414" text-anchor="middle" class="stereo">«database table»</text>
      <text x="507.0" y="429" text-anchor="middle" class="h2">sys_outbox</text>
    <text x="507.0" y="444" text-anchor="middle" class="small">(Committed atomically with state)</text></g>
<line x1="507" y1="370" x2="507" y2="386" stroke="#2F363D" stroke-width="1.4" marker-end="url(#arrow-solid)"/>
<rect x="55" y="480" width="265" height="130" fill="#F6F8FA" stroke="#57606A" stroke-width="1.3" stroke-dasharray="5,3" rx="3"/>
<text x="187" y="502" text-anchor="middle" class="h2">ShareCreditSubscriber (ADR 0003)</text>
<text x="187" y="521" text-anchor="middle" class="small" fill="#1F2328">Phase: AFTER_COMMIT + REQUIRES_NEW</text>
<text x="187" y="539" text-anchor="middle" class="small" fill="#1F2328">Consumes: MemberJoined (in-process)</text>
<text x="187" y="557" text-anchor="middle" class="small" fill="#1F2328">Inserts biz_share_credit; catches all</text>
<text x="187" y="575" text-anchor="middle" class="small">errors so credit never rolls back seat</text>
<polyline points="55,160 44,160 44,545 55,545" fill="none" stroke="#2F363D" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow-open)"/>
<rect x="340" y="480" width="345" height="130" fill="#FBF8F1" stroke="#8C6D3F" stroke-width="1.4" rx="3"/>
<text x="512" y="502" text-anchor="middle" class="h2">OutboxRelayJob → OutboxRelayService</text>
<text x="512" y="521" text-anchor="middle" class="small" fill="#1F2328">Runs under LeasedJobRunner (sys_scheduler_lock)</text>
<text x="512" y="539" text-anchor="middle" class="small" fill="#1F2328">Claims ≤ 100 due rows; sends in 10-entry batches</text>
<text x="512" y="557" text-anchor="middle" class="small" fill="#1F2328">No DB txn spans network I/O; 10-attempt budget</text>
<text x="512" y="575" text-anchor="middle" class="small" fill="#8C6D3F">OutboxRetentionJob prunes published rows &gt; 7d</text>
<line x1="507" y1="480" x2="507" y2="452" stroke="#2F363D" stroke-width="1.4" marker-end="url(#arrow-solid)"/>
<rect x="740" y="20" width="255" height="610" fill="#FBF8F1" stroke="#8C6D3F" stroke-width="1.4" stroke-dasharray="6,4" rx="5"/>
<text x="867" y="43" text-anchor="middle" class="h1" fill="#8C6D3F">Broker Choreography</text>
<rect x="755" y="70" width="225" height="155" fill="#FFFFFF" stroke="#8C6D3F" stroke-width="1.4" rx="3"/>
<text x="867" y="92" text-anchor="middle" class="stereo">«component»</text>
<text x="867" y="112" text-anchor="middle" class="h1" fill="#8C6D3F">SNS Domain Topic</text>
<text x="867" y="134" text-anchor="middle" class="body">IntegrationEventEnvelope&lt;T&gt;</text>
<text x="867" y="154" text-anchor="middle" class="small" fill="#8C6D3F" font-weight="bold">• TeamSucceededV1</text>
<text x="867" y="171" text-anchor="middle" class="small" fill="#8C6D3F" font-weight="bold">• TeamExpiredV1</text>
<text x="867" y="188" text-anchor="middle" class="small" fill="#8C6D3F" font-weight="bold">• PaymentSucceededV1</text>
<text x="867" y="208" text-anchor="middle" class="small">Attrs: eventType, version, traceId</text>
<rect x="755" y="255" width="225" height="150" fill="#FFFFFF" stroke="#8C6D3F" stroke-width="1.4" rx="3"/>
<text x="867" y="277" text-anchor="middle" class="stereo">«queue»</text>
<text x="867" y="297" text-anchor="middle" class="h1">notification-events</text>
<text x="867" y="318" text-anchor="middle" class="body">Raw delivery · All 3 V1 events</text>
<text x="867" y="336" text-anchor="middle" class="small" fill="#1F2328">Drives ECS backlog scaling (50/task)</text>
<rect x="770" y="352" width="195" height="32" fill="#FFF5F5" stroke="#C93B2B" stroke-width="1.2" rx="4"/>
<text x="867" y="372" text-anchor="middle" class="small" fill="#C93B2B" font-weight="bold">+ DLQ (maxReceiveCount = 5)</text>
<rect x="755" y="435" width="225" height="165" fill="#FFFFFF" stroke="#8C6D3F" stroke-width="1.4" rx="3"/>
<text x="867" y="457" text-anchor="middle" class="stereo">«queue» (Extension &amp; High-Compute)</text>
<text x="867" y="477" text-anchor="middle" class="h1">audit-events</text>
<text x="867" y="498" text-anchor="middle" class="body">SNS Filter: TeamSucceeded,</text>
<text x="867" y="515" text-anchor="middle" class="body">TeamExpired (2 lines in Terraform)</text>
<text x="867" y="534" text-anchor="middle" class="small">Zero code change in commerce-svc</text>
<rect x="770" y="550" width="195" height="32" fill="#FFF5F5" stroke="#C93B2B" stroke-width="1.2" rx="4"/>
<text x="867" y="570" text-anchor="middle" class="small" fill="#C93B2B" font-weight="bold">+ audit-events-dlq</text>
<polyline points="685,545 728,545 728,145 755,145" fill="none" stroke="#2F363D" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow-open)"/>
<line x1="867" y1="225" x2="867" y2="255" stroke="#2F363D" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow-open)"/>
<polyline points="755,185 738,185 738,515 755,515" fill="none" stroke="#2F363D" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow-open)"/>
<rect x="1020" y="20" width="280" height="610" fill="#F4F7FB" stroke="#2B5B84" stroke-width="1.4" stroke-dasharray="6,4" rx="5"/>
<text x="1160" y="43" text-anchor="middle" class="h1" fill="#2B5B84">«service» notification-svc</text>
<rect x="1036" y="92" width="248" height="140" fill="#FFFFFF" stroke="#2B5B84" stroke-width="1.4" rx="3"/>
<text x="1160" y="114" text-anchor="middle" class="stereo">«component»</text>
<text x="1160" y="135" text-anchor="middle" class="h2" fill="#2B5B84">SqsNotificationEventConsumer</text>
<text x="1160" y="156" text-anchor="middle" class="body">+ IntegrationEventDecoder</text>
<text x="1160" y="174" text-anchor="middle" class="small" fill="#1F2328">Restores traceId to SLF4J MDC</text>
<text x="1160" y="192" text-anchor="middle" class="small" fill="#1F2328">Ignores unknown eventType/version</text>
<text x="1160" y="210" text-anchor="middle" class="small">(Forward-compatible schema rule)</text>
<polyline points="980,330 1005,330 1005,162 1036,162" fill="none" stroke="#2F363D" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow-open)"/>
<rect x="1036" y="265" width="248" height="340" fill="#FFFFFF" stroke="#2B5B84" stroke-width="1.3" stroke-dasharray="4,3" rx="4"/>
<text x="1160" y="286" text-anchor="middle" class="h2" fill="#2B5B84">1 Local ACID Txn per Message</text>
<rect x="1048" y="300" width="224" height="110" fill="#F0F6FC" stroke="#2B5B84" stroke-width="1.3" rx="3"/>
<text x="1160" y="324" text-anchor="middle" class="h2">NotificationEventAppService</text>
<text x="1160" y="346" text-anchor="middle" class="body">1. Claim (eventId, consumer)</text>
<text x="1160" y="365" text-anchor="middle" class="body">2. Assemble Notification per</text>
<text x="1160" y="384" text-anchor="middle" class="body">recipientUserId (no callback)</text>
<line x1="1160" y1="232" x2="1160" y2="300" stroke="#2F363D" stroke-width="1.4" marker-end="url(#arrow-solid)"/>

    <g>
      <path d="M 1058,448 L 1058,567 A 102.0,8 0 0 0 1262,567 L 1262,448 Z" fill="#FFFFFF" stroke="#2B5B84" stroke-width="1.3"/>
      <ellipse cx="1160.0" cy="448" rx="102.0" ry="8" fill="#FFFFFF" stroke="#2B5B84" stroke-width="1.3"/>
      <text x="1160.0" y="468" text-anchor="middle" class="stereo">«database»</text>
      <text x="1160.0" y="483" text-anchor="middle" class="h2">notification DB</text>
    </g>
<text x="1160" y="512" text-anchor="middle" class="small" fill="#1F2328">• sys_consumed_message</text>
<text x="1160" y="528" text-anchor="middle" class="small">(event_id PK, consumer)</text>
<text x="1160" y="548" text-anchor="middle" class="small" fill="#1F2328">• biz_notification</text>
<line x1="1160" y1="410" x2="1160" y2="440" stroke="#2F363D" stroke-width="1.4" marker-end="url(#arrow-solid)"/>
</svg>