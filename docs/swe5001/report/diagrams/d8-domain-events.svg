<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="1160" height="520" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="d8Biz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FBDFD9"/></linearGradient>
    <linearGradient id="d8Msg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6E2"/><stop offset="1" stop-color="#FFEDC7"/></linearGradient>
    <linearGradient id="d8Plat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3E8FB"/></linearGradient>
    <linearGradient id="d8Sub" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFE9DF"/></linearGradient>
    <marker id="d8Fill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B1A18"/></marker>
    <marker id="d8Open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#1B1A18" stroke-width="1.6"/></marker>
  </defs>
  <rect x="0" y="0" width="1160" height="520" fill="#FFFFFF"/>

  <!-- ===== 1. commerce-svc Boundary (Producer) ===== -->
  <rect x="14" y="14" width="606" height="492" fill="#FDEFEC" stroke="#E8402A" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="28" y="34" font-size="14" font-weight="700" fill="#B02E1B">«service» commerce-svc — In-Process Domain Events &amp; Transactional Outbox</text>

  <!-- Transaction Boundary Highlight inside commerce-svc -->
  <rect x="28" y="46" width="578" height="332" rx="4" fill="#FFFFFF" stroke="#B02E1B" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="40" y="64" font-size="12.5" font-weight="700" fill="#B02E1B">Single Local PostgreSQL ACID Transaction Boundary (BEFORE_COMMIT Phase)</text>

  <!-- Producer Aggregates -->
  <rect x="40" y="78" width="218" height="106" fill="url(#d8Biz)" stroke="#E8402A" stroke-width="1.5"/>
  <text x="149" y="96" font-size="12" fill="#6B655C" text-anchor="middle">«aggregate root»</text>
  <text x="149" y="114" font-size="15" font-weight="700" fill="#1B1A18" text-anchor="middle">GroupDeal (groupbuy)</text>
  <text x="149" y="134" font-size="12" fill="#1B1A18" text-anchor="middle">Emits Domain Event Records:</text>
  <text x="149" y="152" font-size="12" font-weight="700" fill="#B02E1B" text-anchor="middle">MemberJoined · TeamSucceeded</text>
  <text x="149" y="168" font-size="12" font-weight="700" fill="#B02E1B" text-anchor="middle">TeamExpired</text>

  <rect x="40" y="202" width="218" height="92" fill="url(#d8Biz)" stroke="#E8402A" stroke-width="1.5"/>
  <text x="149" y="220" font-size="12" fill="#6B655C" text-anchor="middle">«aggregate root»</text>
  <text x="149" y="238" font-size="15" font-weight="700" fill="#1B1A18" text-anchor="middle">CheckoutPayment (payment)</text>
  <text x="149" y="258" font-size="12" fill="#1B1A18" text-anchor="middle">Emits Domain Event Record:</text>
  <text x="149" y="276" font-size="12" font-weight="700" fill="#B02E1B" text-anchor="middle">PaymentSucceeded</text>

  <!-- In-Process BEFORE_COMMIT Subscribers -->
  <rect x="296" y="76" width="296" height="58" fill="url(#d8Sub)" stroke="#6B655C" stroke-width="1.3"/>
  <text x="444" y="94" font-size="12.5" font-weight="700" fill="#1B1A18" text-anchor="middle">OrderLifecycleSubscriber (@Order 10)</text>
  <text x="444" y="111" font-size="11.5" fill="#1B1A18" text-anchor="middle">BEFORE_COMMIT: confirms all orders on TeamSucceeded;</text>
  <text x="444" y="126" font-size="11.5" fill="#1B1A18" text-anchor="middle">cancels all orders on TeamExpired</text>

  <rect x="296" y="144" width="296" height="54" fill="url(#d8Sub)" stroke="#6B655C" stroke-width="1.3"/>
  <text x="444" y="162" font-size="12.5" font-weight="700" fill="#1B1A18" text-anchor="middle">TeamExpiryRefundSubscriber (@Order 20)</text>
  <text x="444" y="179" font-size="11.5" fill="#1B1A18" text-anchor="middle">BEFORE_COMMIT: inserts idempotent biz_refund rows</text>
  <text x="444" y="192" font-size="11" fill="#6B655C" text-anchor="middle">via TeamExpiryRefundService.recordExpiredTeam</text>

  <!-- IntegrationOutboxWriter -->
  <rect x="296" y="210" width="296" height="92" fill="url(#d8Biz)" stroke="#E8402A" stroke-width="1.5"/>
  <text x="444" y="228" font-size="13" font-weight="700" fill="#B02E1B" text-anchor="middle">IntegrationOutboxWriter (@Order LOWEST)</text>
  <text x="444" y="245" font-size="11.5" fill="#1B1A18" text-anchor="middle">BEFORE_COMMIT: maps internal records to V1 contracts</text>
  <text x="444" y="261" font-size="11.5" fill="#1B1A18" text-anchor="middle">Enriches recipientUserIds via IntegrationRecipientRepository</text>
  <text x="444" y="277" font-size="11.5" fill="#1B1A18" text-anchor="middle">Strips PII/card data; propagates MDC traceId</text>
  <text x="444" y="293" font-size="11" font-weight="700" fill="#B02E1B" text-anchor="middle">Inserts into sys_outbox (UUIDv7 eventId)</text>

  <!-- sys_outbox table cylinder -->
  <path d="M364,318 A80,8 0 0 1 524,318 V362 A80,8 0 0 1 364,362 Z" fill="#FFFFFF" stroke="#E8402A" stroke-width="1.5"/>
  <path d="M364,318 A80,8 0 0 0 524,318" fill="none" stroke="#E8402A" stroke-width="1.5"/>
  <text x="444" y="341" font-size="12.5" font-weight="700" fill="#1B1A18" text-anchor="middle">«database table» sys_outbox</text>
  <text x="444" y="356" font-size="11" fill="#6B655C" text-anchor="middle">(Committed atomically with state)</text>

  <!-- AFTER_COMMIT Subscriber (outside main commit risk) -->
  <rect x="40" y="392" width="248" height="98" fill="url(#d8Sub)" stroke="#6B655C" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="164" y="412" font-size="12.5" font-weight="700" fill="#1B1A18" text-anchor="middle">ShareCreditSubscriber (ADR 0003)</text>
  <text x="164" y="429" font-size="11.5" fill="#1B1A18" text-anchor="middle">Phase: AFTER_COMMIT + REQUIRES_NEW</text>
  <text x="164" y="445" font-size="11.5" fill="#1B1A18" text-anchor="middle">Consumes: MemberJoined (in-process)</text>
  <text x="164" y="461" font-size="11.5" fill="#1B1A18" text-anchor="middle">Inserts biz_share_credit; catches all</text>
  <text x="164" y="477" font-size="11" fill="#6B655C" text-anchor="middle">errors so credit never rolls back seat</text>

  <!-- OutboxRelayJob & OutboxRelayService -->
  <rect x="304" y="392" width="302" height="98" fill="url(#d8Msg)" stroke="#7A5C20" stroke-width="1.5"/>
  <text x="455" y="412" font-size="13" font-weight="700" fill="#1B1A18" text-anchor="middle">OutboxRelayJob → OutboxRelayService</text>
  <text x="455" y="429" font-size="11.5" fill="#1B1A18" text-anchor="middle">Runs under LeasedJobRunner (sys_scheduler_lock)</text>
  <text x="455" y="445" font-size="11.5" fill="#1B1A18" text-anchor="middle">Claims ≤ 100 due rows; sends in 10-entry batches</text>
  <text x="455" y="461" font-size="11.5" fill="#1B1A18" text-anchor="middle">No DB txn spans network I/O; 10-attempt budget</text>
  <text x="455" y="477" font-size="11" fill="#6B655C" text-anchor="middle">OutboxRetentionJob prunes published rows &gt; 7d</text>

  <!-- ===== 2. Broker Topology (SNS + SQS) ===== -->
  <rect x="636" y="14" width="234" height="492" fill="#FFFBF2" stroke="#7A5C20" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="753" y="34" font-size="14" font-weight="700" fill="#7A5C20" text-anchor="middle">Broker Choreography</text>

  <!-- SNS Topic -->
  <rect x="650" y="54" width="206" height="128" fill="url(#d8Msg)" stroke="#7A5C20" stroke-width="1.5"/>
  <text x="753" y="74" font-size="12" fill="#6B655C" text-anchor="middle">«component»</text>
  <text x="753" y="92" font-size="15" font-weight="700" fill="#1B1A18" text-anchor="middle">SNS Domain Topic</text>
  <text x="753" y="112" font-size="11.5" fill="#1B1A18" text-anchor="middle">IntegrationEventEnvelope&lt;T&gt;</text>
  <text x="753" y="129" font-size="11.5" font-weight="700" fill="#7A5C20" text-anchor="middle">• TeamSucceededV1</text>
  <text x="753" y="145" font-size="11.5" font-weight="700" fill="#7A5C20" text-anchor="middle">• TeamExpiredV1</text>
  <text x="753" y="161" font-size="11.5" font-weight="700" fill="#7A5C20" text-anchor="middle">• PaymentSucceededV1</text>
  <text x="753" y="176" font-size="10.5" fill="#6B655C" text-anchor="middle">Attrs: eventType, version, traceId</text>

  <!-- Notification Queue + DLQ -->
  <rect x="650" y="216" width="206" height="114" fill="#FFFFFF" stroke="#7A5C20" stroke-width="1.4"/>
  <text x="753" y="236" font-size="12" fill="#6B655C" text-anchor="middle">«queue»</text>
  <text x="753" y="254" font-size="14" font-weight="700" fill="#1B1A18" text-anchor="middle">notification-events</text>
  <text x="753" y="272" font-size="11.5" fill="#1B1A18" text-anchor="middle">Raw delivery · All 3 V1 events</text>
  <text x="753" y="288" font-size="11.5" fill="#1B1A18" text-anchor="middle">Drives ECS backlog scaling (50/task)</text>
  <rect x="664" y="296" width="178" height="24" rx="3" fill="#FDEFEC" stroke="#E8402A" stroke-width="1"/>
  <text x="753" y="312" font-size="11" font-weight="700" fill="#B02E1B" text-anchor="middle">+ DLQ (maxReceiveCount = 5)</text>

  <!-- Audit Queue + DLQ -->
  <rect x="650" y="356" width="206" height="134" fill="#FFFFFF" stroke="#7A5C20" stroke-width="1.4"/>
  <text x="753" y="376" font-size="12" fill="#6B655C" text-anchor="middle">«queue» (Extension Proof)</text>
  <text x="753" y="394" font-size="14" font-weight="700" fill="#1B1A18" text-anchor="middle">audit-events</text>
  <text x="753" y="412" font-size="11.5" fill="#1B1A18" text-anchor="middle">SNS Filter: TeamSucceeded,</text>
  <text x="753" y="428" font-size="11.5" fill="#1B1A18" text-anchor="middle">TeamExpired (2 lines in Terraform)</text>
  <text x="753" y="444" font-size="11" fill="#6B655C" text-anchor="middle">Zero code change in commerce-svc</text>
  <rect x="664" y="454" width="178" height="24" rx="3" fill="#FDEFEC" stroke="#E8402A" stroke-width="1"/>
  <text x="753" y="470" font-size="11" font-weight="700" fill="#B02E1B" text-anchor="middle">+ audit-events-dlq</text>

  <!-- ===== 3. notification-svc Boundary (Consumer) ===== -->
  <rect x="886" y="14" width="260" height="492" fill="#F1F4FD" stroke="#3E5CD9" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="1016" y="34" font-size="14" font-weight="700" fill="#3E5CD9" text-anchor="middle">«service» notification-svc</text>

  <!-- SqsNotificationEventConsumer -->
  <rect x="900" y="76" width="232" height="114" fill="url(#d8Plat)" stroke="#3E5CD9" stroke-width="1.5"/>
  <text x="1016" y="96" font-size="12" fill="#6B655C" text-anchor="middle">«component»</text>
  <text x="1016" y="114" font-size="13.5" font-weight="700" fill="#3E5CD9" text-anchor="middle">SqsNotificationEventConsumer</text>
  <text x="1016" y="133" font-size="11.5" fill="#1B1A18" text-anchor="middle">+ IntegrationEventDecoder</text>
  <text x="1016" y="150" font-size="11.5" fill="#1B1A18" text-anchor="middle">Restores traceId to SLF4J MDC</text>
  <text x="1016" y="167" font-size="11.5" fill="#1B1A18" text-anchor="middle">Ignores unknown eventType/version</text>
  <text x="1016" y="182" font-size="11" fill="#6B655C" text-anchor="middle">(Forward-compatible schema rule)</text>

  <!-- Consumer Local Transaction -->
  <rect x="900" y="216" width="232" height="270" rx="4" fill="#FFFFFF" stroke="#3E5CD9" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="1016" y="236" font-size="12" font-weight="700" fill="#3E5CD9" text-anchor="middle">1 Local ACID Txn per Message</text>

  <rect x="912" y="248" width="208" height="84" fill="url(#d8Plat)" stroke="#3E5CD9" stroke-width="1.4"/>
  <text x="1016" y="268" font-size="13" font-weight="700" fill="#1B1A18" text-anchor="middle">NotificationEventAppService</text>
  <text x="1016" y="286" font-size="11.5" fill="#1B1A18" text-anchor="middle">1. Claim (eventId, consumer)</text>
  <text x="1016" y="302" font-size="11.5" fill="#1B1A18" text-anchor="middle">2. Assemble Notification per</text>
  <text x="1016" y="318" font-size="11.5" fill="#1B1A18" text-anchor="middle">recipientUserId (no callback)</text>

  <path d="M926,364 A90,9 0 0 1 1106,364 V460 A90,9 0 0 1 926,460 Z" fill="#FFFFFF" stroke="#3E5CD9" stroke-width="1.5"/>
  <path d="M926,364 A90,9 0 0 0 1106,364" fill="none" stroke="#3E5CD9" stroke-width="1.5"/>
  <text x="1016" y="392" font-size="12" font-weight="700" fill="#1B1A18" text-anchor="middle">notification DB</text>
  <text x="1016" y="412" font-size="11.5" fill="#1B1A18" text-anchor="middle">• sys_consumed_message</text>
  <text x="1016" y="428" font-size="11" fill="#6B655C" text-anchor="middle">(event_id PK, consumer)</text>
  <text x="1016" y="446" font-size="11.5" fill="#1B1A18" text-anchor="middle">• biz_notification</text>

  <!-- ===== Connectors ===== -->
  <g stroke="#1B1A18" stroke-width="1.4" fill="none">
    <line x1="258" y1="104" x2="296" y2="104" marker-end="url(#d8Fill)"/>
    <line x1="258" y1="146" x2="296" y2="168" marker-end="url(#d8Fill)"/>
    <line x1="258" y1="168" x2="296" y2="236" marker-end="url(#d8Fill)"/>
    <line x1="258" y1="252" x2="296" y2="252" marker-end="url(#d8Fill)"/>
    <line x1="444" y1="302" x2="444" y2="318" marker-end="url(#d8Fill)"/>
    <line x1="444" y1="392" x2="444" y2="370" marker-end="url(#d8Fill)"/>
    <line x1="149" y1="184" x2="149" y2="392" stroke-dasharray="5 3" marker-end="url(#d8Open)"/>
    <!-- Relay -> SNS Topic -->
    <polyline points="606,440 624,440 624,118 650,118" stroke-dasharray="6 4" marker-end="url(#d8Open)"/>
    <!-- SNS -> SQS Queues -->
    <line x1="753" y1="182" x2="753" y2="216" stroke-dasharray="6 4" marker-end="url(#d8Open)"/>
    <polyline points="650,152 642,152 642,412 650,412" stroke-dasharray="6 4" marker-end="url(#d8Open)"/>
    <!-- SQS -> Consumer -->
    <polyline points="856,262 876,262 876,132 900,132" stroke-dasharray="6 4" marker-end="url(#d8Open)"/>
    <line x1="1016" y1="190" x2="1016" y2="248" marker-end="url(#d8Fill)"/>
    <line x1="1016" y1="332" x2="1016" y2="364" marker-end="url(#d8Fill)"/>
  </g>
</svg>
