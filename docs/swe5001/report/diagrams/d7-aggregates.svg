<text x="602.0" y="404" text-anchor="middle" class="h2">CheckoutPayment</text>
<text x="430" y="425" class="small" style="fill:#1F2328">+ id : UUID · status : Status (CREATED→SUCCEEDED|FAILED)</text>
<text x="430" y="440" class="small" style="fill:#1F2328">+ quote : CheckoutQuote «VO» (intentId, businessId, amount)</text>
<text x="430" y="455" class="small" style="fill:#1F2328">+ providerSessionId, providerPaymentIntentId : String</text>
<line x1="422" y1="461" x2="782" y2="461" stroke="#2B5B84" stroke-width="1"/>
<text x="430" y="474" class="small" style="fill:#0969DA">+ bind() · succeed() → PaymentSucceeded · cancelUnpaid()</text>
<rect x="422" y="497" width="360" height="78" fill="#FFFFFF" stroke="#2B5B84" stroke-width="1.3" rx="2"/>
<rect x="422" y="497" width="360" height="36" fill="#F0F6FC" stroke="#2B5B84" stroke-width="1.3" rx="2"/>
<text x="602.0" y="511" text-anchor="middle" class="stereo">«aggregate root»</text>
<text x="602.0" y="527" text-anchor="middle" class="h2">RefundWork &amp; PaymentReviewCase</text>
<text x="430" y="548" class="small" style="fill:#1F2328">+ paymentId (UNIQUE) : UUID · status (pending→processing→ok)</text>
<line x1="422" y1="554" x2="782" y2="554" stroke="#2B5B84" stroke-width="1"/>
<text x="430" y="567" class="small" style="fill:#0969DA">+ version : int (fencing token) · 23h Stripe idempotency guard</text>
<rect x="28" y="596" width="764" height="156" fill="#F4F7FB" stroke="#2B5B84" stroke-width="1.2" stroke-dasharray="5,3" rx="4"/>
<text x="38" y="614" class="h2" style="fill:#2B5B84">Platform Services — Identity (User) &amp; Notification (Notification) Aggregates</text>
<rect x="38" y="622" width="352" height="120" fill="#FFFFFF" stroke="#2B5B84" stroke-width="1.3" rx="2"/>
<rect x="38" y="622" width="352" height="36" fill="#F0F6FC" stroke="#2B5B84" stroke-width="1.3" rx="2"/>
<text x="214.0" y="636" text-anchor="middle" class="stereo">«aggregate root»</text>
<text x="214.0" y="652" text-anchor="middle" class="h2">User (owns OAuthIdentity «entity»)</text>
<text x="46" y="673" class="small" style="fill:#1F2328">+ id : UUID · email (UNIQUE) : String</text>
<text x="46" y="688" class="small" style="fill:#1F2328">+ status : UserStatus (ACTIVE | DISABLED)</text>
<text x="46" y="703" class="small" style="fill:#1F2328">+ oauthIdentities : List&lt;OAuthIdentity&gt; (provider, sub)</text>
<line x1="38" y1="709" x2="390" y2="709" stroke="#2B5B84" stroke-width="1"/>
<text x="46" y="722" class="small" style="fill:#0969DA">+ registerViaOAuth() · ensureActive() · disable()</text>
<rect x="422" y="622" width="360" height="120" fill="#FFFFFF" stroke="#2B5B84" stroke-width="1.3" rx="2"/>
<rect x="422" y="622" width="360" height="36" fill="#F0F6FC" stroke="#2B5B84" stroke-width="1.3" rx="2"/>
<text x="602.0" y="636" text-anchor="middle" class="stereo">«aggregate root»</text>
<text x="602.0" y="652" text-anchor="middle" class="h2">Notification (Immutable Effect Record)</text>
<text x="430" y="673" class="small" style="fill:#1F2328">+ id, eventId, userId, referenceId : UUID</text>
<text x="430" y="688" class="small" style="fill:#1F2328">+ type : NotificationType · title, content : String</text>
<text x="430" y="703" class="small" style="fill:#1F2328">+ Guarded by sys_consumed_message (event_id, consumer)</text>
<line x1="422" y1="709" x2="782" y2="709" stroke="#2B5B84" stroke-width="1"/>
<text x="430" y="722" class="small" style="fill:#0969DA">+ One effect per (eventId, userId); no read-state mutation</text>
<rect x="820" y="15" width="525" height="750" fill="#FAFAFA" stroke="#6E6A64" stroke-width="1.3" rx="4"/>
<text x="835" y="38" class="title">b) Aggregate Lifecycle State Machines</text>

