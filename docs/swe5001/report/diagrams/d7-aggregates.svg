<text x="214.0" y="527" text-anchor="middle" class="h2">TeamPricePolicy &amp; DualPricingStrategy</text>
<text x="46" y="548" class="small" style="fill:#1F2328">+ amount : BigDecimal · validFrom, validUntil : Instant</text>
<line x1="38" y1="554" x2="390" y2="554" stroke="#2B5B84" stroke-width="1"/>
<text x="46" y="567" class="small" style="fill:#0969DA">+ requireQuotable(product, now) → TeamPriceQuote «VO»</text>
<rect x="412" y="348" width="380" height="235" fill="#F4F7FB" stroke="#2B5B84" stroke-width="1.2" stroke-dasharray="5,3" rx="4"/>
