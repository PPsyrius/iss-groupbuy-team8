<rect x="15" y="15" width="790" height="750" fill="#FAFAFA" stroke="#6E6A64" stroke-width="1.3" rx="4"/>
<text x="30" y="38" class="title">a) Tactical Aggregate Boundaries (Aggregates Reference Other Aggregates by ID Only)</text>
<rect x="28" y="50" width="372" height="285" fill="#FDF6F5" stroke="#C93B2B" stroke-width="1.2" stroke-dasharray="5,3" rx="4"/>
<text x="38" y="68" class="h2" style="fill:#C93B2B">GroupBuy Context — Team / GroupDeal Aggregate</text>
<rect x="38" y="76" width="352" height="122" fill="#FFFFFF" stroke="#C93B2B" stroke-width="1.3" rx="2"/>
<rect x="38" y="76" width="352" height="36" fill="#FFF5F5" stroke="#C93B2B" stroke-width="1.3" rx="2"/>
<text x="214.0" y="90" text-anchor="middle" class="stereo">«aggregate root»</text>
<text x="214.0" y="106" text-anchor="middle" class="h2">GroupDeal (Team)</text>
<text x="46" y="127" class="small" style="fill:#1F2328">+ id, productId, leaderUserId : UUID · version : Long</text>
<text x="46" y="142" class="small" style="fill:#1F2328">+ dealPrice : BigDecimal · targetSize, currentSize : int</text>
<text x="46" y="157" class="small" style="fill:#1F2328">+ status : DealStatus · startTime, expireTime : Instant</text>
<line x1="38" y1="163" x2="390" y2="163" stroke="#C93B2B" stroke-width="1"/>
<text x="46" y="176" class="small" style="fill:#C93B2B">+ joinPaid(payment, userId, now) : PaidAdmission</text>
<text x="46" y="191" class="small" style="fill:#C93B2B">+ expire(now : Instant) : TeamExpired</text>
<rect x="38" y="214" width="170" height="110" fill="#FFFFFF" stroke="#57606A" stroke-width="1.3" rx="2"/>
<rect x="38" y="214" width="170" height="36" fill="#F6F8FA" stroke="#57606A" stroke-width="1.3" rx="2"/>
<text x="123.0" y="228" text-anchor="middle" class="stereo">«internal entities»</text>
<text x="123.0" y="244" text-anchor="middle" class="h2">PaidMember &amp; Receipt</text>
<text x="46" y="265" class="small" style="fill:#1F2328">+ dealId, userId : UUID</text>
<text x="46" y="280" class="small" style="fill:#1F2328">+ orderId : UUID · status : String</text>
<text x="46" y="295" class="small" style="fill:#1F2328">«entity» ParticipationReceipt</text>
<text x="46" y="310" class="small" style="fill:#1F2328">+ fingerprint, result</text>
<rect x="216" y="214" width="174" height="110" fill="#FFFFFF" stroke="#8C6D3F" stroke-width="1.3" rx="2"/>
<rect x="216" y="214" width="174" height="36" fill="#FBF8F1" stroke="#8C6D3F" stroke-width="1.3" rx="2"/>
<text x="303.0" y="228" text-anchor="middle" class="stereo">«own-repository records»</text>
<text x="303.0" y="244" text-anchor="middle" class="h2">ShareInvite &amp; ShareCredit</text>
<text x="224" y="265" class="small" style="fill:#1F2328">+ dealId : UUID (ID ref only)</text>
<text x="224" y="280" class="small" style="fill:#1F2328">ShareInvite (ShareInviteRepo)</text>
<text x="224" y="295" class="small" style="fill:#1F2328">ShareCredit (ShareCreditRepo,</text>
<text x="224" y="310" class="small" style="fill:#1F2328">  AFTER_COMMIT REQUIRES_NEW)</text>
<line x1="123" y1="198" x2="123" y2="214" stroke="#1F2328" stroke-width="1.3" marker-start="url(#diamond-black)"/>
<line x1="303" y1="214" x2="303" y2="198" stroke="#8C6D3F" stroke-width="1.3" stroke-dasharray="3,2" marker-end="url(#arrow-open)"/>
<rect x="412" y="50" width="380" height="285" fill="#FDF6F5" stroke="#C93B2B" stroke-width="1.2" stroke-dasharray="5,3" rx="4"/>
<text x="422" y="68" class="h2" style="fill:#C93B2B">Ordering Context — Intent &amp; Order Aggregates</text>
<rect x="422" y="76" width="360" height="118" fill="#FFFFFF" stroke="#C93B2B" stroke-width="1.3" rx="2"/>
<rect x="422" y="76" width="360" height="36" fill="#FFF5F5" stroke="#C93B2B" stroke-width="1.3" rx="2"/>
<text x="602.0" y="90" text-anchor="middle" class="stereo">«aggregate root»</text>
<text x="602.0" y="106" text-anchor="middle" class="h2">PurchaseIntent</text>
<text x="430" y="127" class="small" style="fill:#1F2328">+ id, userId, dealId, productId, sharerUserId : UUID</text>
<text x="430" y="142" class="small" style="fill:#1F2328">+ operation : PurchaseOperation (START | JOIN)</text>
<text x="430" y="157" class="small" style="fill:#1F2328">+ amount : BigDecimal · quoteValidUntil, deadline : Instant</text>
<line x1="422" y1="163" x2="782" y2="163" stroke="#C93B2B" stroke-width="1"/>
<text x="430" y="176" class="small" style="fill:#C93B2B">+ fulfilBy(paymentId : UUID) · expiredAt(now : Instant)</text>
<rect x="422" y="206" width="360" height="118" fill="#FFFFFF" stroke="#C93B2B" stroke-width="1.3" rx="2"/>
<rect x="422" y="206" width="360" height="36" fill="#FFF5F5" stroke="#C93B2B" stroke-width="1.3" rx="2"/>
<text x="602.0" y="220" text-anchor="middle" class="stereo">«aggregate root»</text>
<text x="602.0" y="236" text-anchor="middle" class="h2">Order</text>
<text x="430" y="257" class="small" style="fill:#1F2328">+ id, paymentId (UNIQUE), dealId, userId : UUID</text>
<text x="430" y="272" class="small" style="fill:#1F2328">+ productTitle : String · unitPrice, totalAmount : BigDecimal</text>
<text x="430" y="287" class="small" style="fill:#1F2328">+ status : OrderStatus (PENDING | CONFIRMED | CANCELLED)</text>
<line x1="422" y1="293" x2="782" y2="293" stroke="#C93B2B" stroke-width="1"/>
<text x="430" y="306" class="small" style="fill:#C93B2B">+ create(terms, paidAt) · confirm() · cancel(at)</text>
<rect x="28" y="348" width="372" height="235" fill="#F4F7FB" stroke="#2B5B84" stroke-width="1.2" stroke-dasharray="5,3" rx="4"/>
<text x="38" y="366" class="h2" style="fill:#2B5B84">Catalog Context — Product &amp; Pricing</text>
<rect x="38" y="374" width="352" height="115" fill="#FFFFFF" stroke="#2B5B84" stroke-width="1.3" rx="2"/>
<rect x="38" y="374" width="352" height="36" fill="#F0F6FC" stroke="#2B5B84" stroke-width="1.3" rx="2"/>
<text x="214.0" y="388" text-anchor="middle" class="stereo">«aggregate root»</text>
<text x="214.0" y="404" text-anchor="middle" class="h2">Product</text>
<text x="46" y="425" class="small" style="fill:#1F2328">+ id : UUID · originalPrice : BigDecimal · stock : int</text>
<text x="46" y="440" class="small" style="fill:#1F2328">+ status : ProductStatus (DRAFT → ON_SALE ⇄ OFF_SHELF)</text>
<text x="46" y="455" class="small" style="fill:#1F2328">+ teamTerms : ProductTeamTerms «VO» (size ≥ 2, window)</text>
<line x1="38" y1="461" x2="390" y2="461" stroke="#2B5B84" stroke-width="1"/>
<text x="46" y="474" class="small" style="fill:#0969DA">+ draft() · revise() · publish() · delist() · requireDeletable()</text>
<rect x="38" y="497" width="352" height="78" fill="#FFFFFF" stroke="#2B5B84" stroke-width="1.3" rx="2"/>
<rect x="38" y="497" width="352" height="36" fill="#F0F6FC" stroke="#2B5B84" stroke-width="1.3" rx="2"/>
